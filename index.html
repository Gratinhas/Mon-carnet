<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carnet</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#3F6259">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper: #EFEAE0;
    --paper-raised: #F7F3EA;
    --ink: #2B2A28;
    --ink-soft: #6B655C;
    --line: #DAD2C2;
    --teal: #3F6259;
    --teal-deep: #2C4842;
    --amber: #C97B3D;
    --danger: #A2503B;
    --radius: 14px;
    --lock-pink: #C97F87;
    --lock-yellow: #C99A38;
    --lock-green: #6E9169;
    --lock-green-deep: #4A6647;
    --crown-leaf: #6E9169;
    --crown-leaf-deep: #4F6E4B;
    --crown-gold: #C4890F;
    --crown-gold-light: #D9A027;
    --crown-brown: #5C4530;
    --crown-brown-deep: #3F2F20;
    --crown-plum: #8B5A7A;
    --crown-red: #C0392B;
    --info-text-brown: #6B4A32;
    --journal-bg: #FBF6EC;
    --journal-card-bg: #FFFDF7;
    --journal-card-shadow: #EEDFC0;
    --journal-accent: #B2543C;
    --journal-accent-soft: #C9A45E;
    --journal-muted: #8A7654;
    --journal-chip-bg: #F3EBD9;
    --journal-tape: rgba(201,164,94,0.35);
    --journal-highlight-bg: #FFF3DC;
    --journal-unknown: #7A1F35;
    --journal-unknown-tint: rgba(122,31,53,0.10);
    --journal-unknown-border: rgba(122,31,53,0.45);
    --health-wash-daily: rgba(122,148,113,0.16);
    --health-wash-episodes: rgba(178,84,60,0.14);
    --health-wash-medical: rgba(122,31,53,0.13);
    --health-wash-cycle: rgba(201,127,135,0.18);
    --relation-bg: #F4EFE4;
    --relation-card-bg: #FFFDF8;
    --relation-dash: #B9A87E;
    --relation-muted: #8A8375;
    --relation-accent-mine: #7A1F35;
    --relation-accent-partner: #7A9471;
    --relation-highlight: #9C4A42;
    --cal-accent: #7A9471;
    --cal-accent-soft: #F0EADA;
    --cal-secondary: #C97B5A;
    --cal-muted: #8C8567;
    --mood-note-line: #E4DEC8;
    --mood-note-bg: #FFFDF7;
    font-size: 16px;
  }
  :root.dark{
    --paper: #1E1B17;
    --paper-raised: #262220;
    --ink: #EDE6DA;
    --ink-soft: #A79E90;
    --line: #3A342E;
    --teal: #4FA391;
    --teal-deep: #7BCBB8;
    --amber: #E0954F;
    --danger: #E2776A;
    --lock-pink: #E3AEB0;
    --lock-yellow: #F0CE7E;
    --lock-green: #8FAF8B;
    --lock-green-deep: #5E7D5A;
    --info-text-brown: #D4B594;
    --journal-bg: #1C160F;
    --journal-card-bg: #2A2118;
    --journal-card-shadow: #120D08;
    --journal-accent: #E3906B;
    --journal-accent-soft: #D9BB7B;
    --journal-muted: #B8A98C;
    --journal-chip-bg: #332618;
    --journal-tape: rgba(201,164,94,0.22);
    --journal-highlight-bg: #3A2A16;
    --journal-unknown: #8C2A43;
    --journal-unknown-tint: rgba(140,42,67,0.16);
    --journal-unknown-border: rgba(140,42,67,0.55);
    --health-wash-daily: rgba(147,192,138,0.16);
    --health-wash-episodes: rgba(227,144,107,0.16);
    --health-wash-medical: rgba(140,42,67,0.20);
    --health-wash-cycle: rgba(227,174,176,0.16);
    --relation-bg: #1C1912;
    --relation-card-bg: #262019;
    --relation-dash: #4A4030;
    --relation-muted: #B0A68F;
    --relation-accent-mine: #D97C93;
    --relation-accent-partner: #93C08A;
    --relation-highlight: #E08868;
    --cal-accent: #93C08A;
    --cal-accent-soft: #2A2A1E;
    --cal-secondary: #E0956F;
    --cal-muted: #B8AF93;
    --mood-note-line: #3A342E;
    --mood-note-bg: #262019;
  }
  html.dark, html.dark body{ background: var(--paper); }
  html.dark .lightbox{ background: rgba(0,0,0,.92); }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Quicksand', -apple-system, "Avenir Next", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  h1, h2, h3{
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  /* ---------- LOCK SCREEN ---------- */
  .lock-screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 28px;
  }
  .lock-mark{
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--teal);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-mark svg{ width: 26px; height: 26px; }
  .emergency-shield-badge{ width: 84px; height: 84px; }
  .emergency-shield-badge svg{ width: 100%; height: 100%; }
  .lock-screen, .lock-screen input, .lock-screen button{ font-family: 'Quicksand', sans-serif; font-weight: 500; }
  .lock-title{ font-size: 1.5rem; text-align:center; }
  .lock-sub{ color: var(--ink-soft); font-size: 0.9rem; text-align:center; margin-top: 2px; max-width: 280px; line-height:1.6; font-weight: 500; }
  .pin-dots{ display:flex; gap: 16px; margin: 4px 0; }
  .pin-dot{
    width: 14px; height:14px; border-radius:50%;
    border: 1.5px solid var(--ink-soft);
    background: transparent;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .pin-dot.filled{ background: var(--teal); border-color: var(--teal); transform: scale(1.1); }
  .pin-dot.error{ background: var(--danger); border-color: var(--danger); }
  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 14px;
    justify-content: center;
  }
  .key{
    width:64px; height:64px; border-radius:50%;
    border: none;
    background: var(--paper-raised);
    box-shadow: 0 1px 0 rgba(0,0,0,.06);
    font-size: 1.3rem;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .key:active{ background: var(--line); }
  .key.ghost{ background: transparent; box-shadow:none; color: var(--ink-soft); font-size: 0.95rem; }
  .lock-error{ color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  .lock-lang-switch{ display:flex; gap: 8px; margin-top: 4px; }
  .lock-screen-unlock{
    background: radial-gradient(ellipse 70% 50% at 50% 12%, color-mix(in srgb, var(--teal) 18%, transparent), transparent 70%);
  }
  .lock-hero{ position:relative; width:130px; height:130px; display:flex; align-items:center; justify-content:center; }
  .lock-screen-unlock{
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(220,238,218,0.45) 0%, transparent 62%),
      radial-gradient(ellipse 70% 40% at 85% 85%, rgba(246,227,216,0.4) 0%, transparent 60%),
      linear-gradient(180deg, #FBF8F0 0%, #F5F0E4 100%);
    position: relative;
    overflow: hidden;
  }
  html.dark .lock-screen-unlock{
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, #223324 0%, transparent 62%),
      radial-gradient(ellipse 70% 40% at 85% 85%, #332822 0%, transparent 60%),
      linear-gradient(180deg, #1E1B17 0%, #191713 100%);
  }
  .lock-screen-unlock > *{ position:relative; z-index:1; }
  .botanical-deco{ position:absolute; pointer-events:none; opacity: 0.75; z-index:0; }
  .lock-flower-ring{
    position:absolute; inset:0; width:100%; height:100%;
    animation: lock-ring-spin 60s linear infinite;
  }
  .lock-hero-glow{
    position:absolute; inset:16px; border-radius:50%;
    background: radial-gradient(circle, rgba(143,175,139,0.45) 0%, transparent 72%);
    filter: blur(5px);
  }
  @keyframes lock-ring-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  .lock-mark-big{
    position:relative; width:78px; height:78px; border-radius:50%;
    background: linear-gradient(145deg, var(--lock-green), var(--lock-green-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 26px rgba(94,125,90,0.4);
  }
  .lock-mark-big svg{ width:34px; height:34px; }
  .lock-title-big{ font-family: 'Quicksand', sans-serif; font-size: 1.9rem; text-align:center; color: var(--ink); }
  .lock-sub-italic{ font-style: italic; }
  .lock-input-bar{
    width:100%; max-width: 300px; display:flex; align-items:center; gap: 6px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 30px;
    padding: 6px 6px 6px 20px;
  }
  .lock-input-bar input{
    flex:1; min-width:0; border:none; background:transparent; color: var(--ink);
    font-size: 1rem; outline:none; padding: 8px 0;
  }
  .lock-submit-btn{
    width:42px; height:42px; border-radius:50%; flex-shrink:0; border:none;
    background: var(--lock-green-deep); color:white; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 10px rgba(94,125,90,0.4);
    transition: transform .12s;
  }
  .lock-submit-btn:active{ transform: scale(0.92); }
  .lock-submit-btn svg{ width:20px; height:20px; }
  .lock-screen-unlock .lock-input-bar, .lock-screen-unlock .lock-input-pill{ border-color: #B9D2B4; }
  .lock-screen-unlock .passphrase-toggle{ color: var(--lock-green-deep); }
  .lock-screen-unlock .settings-btn-full{ background: var(--lock-green-deep); border-color: var(--lock-green-deep); }
  .lock-screen-unlock .lock-lang-switch button.active{ background: var(--lock-green); color:white; border-color:var(--lock-green); }
  .lock-input-pill{
    width:100%; max-width: 300px; border: 1px solid var(--line); border-radius: 30px;
    background: var(--paper-raised); color: var(--ink); padding: 13px 20px; font-size: 1rem; outline:none;
  }
  .emergency-access-btn{
    background: none; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 20px; padding: 9px 18px; font-size: 0.82rem; font-weight: 600;
    max-width: 280px; width: 100%;
  }
  .emergency-card{
    width: 100%; max-width: 340px; display:flex; flex-direction:column; gap: 10px; margin: 10px 0 20px;
  }
  .emergency-row{
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--danger);
    border-radius: 10px; padding: 10px 14px;
  }
  .emergency-label{ font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .emergency-value{ font-size: 1rem; margin-top: 2px; }
  .passphrase-input{
    width: 100%; max-width: 280px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper-raised); color: var(--ink); padding: 13px 14px; font-size: 1rem;
  }
  .passphrase-toggle{ background:none; border:none; color: var(--teal-deep); font-size: 0.85rem; margin-top: -8px; }
  .lock-lang-switch button{
    background: var(--paper-raised); border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 20px; padding: 5px 12px; font-size: 0.75rem;
  }
  .lock-lang-switch button.active{ background: var(--teal); color: white; border-color: var(--teal); }

  /* ---------- HEADER ---------- */
  .top-bar{
    padding: 20px 20px 14px;
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
  }
  .top-bar h1{ font-size: 1.6rem; }
  .flower-o{ display:inline-block; width:0.56em; height:0.56em; vertical-align:0; }
  .flower-o svg{ width:100%; height:100%; display:block; }
  .top-bar .count{ color: var(--ink-soft); font-size: 0.85rem; }
  .top-bar-right{ display:flex; align-items:center; gap: 12px; flex-shrink:0; }
  .top-bar-left{ display:flex; align-items:center; gap: 8px; flex:1; min-width:0; }
  .top-bar-left h1{ font-size: 1.4rem; }
  .top-bar-left .icon-btn{ padding: 4px 4px 4px 0; }

  /* ---------- CATEGORY HOME (GRID) ---------- */
  .home-info-card{
    background:
      radial-gradient(circle at 50% 0%, rgba(240,198,79,0.3) 0%, transparent 60%),
      linear-gradient(180deg, #FBF8F0 0%, #F5F0E4 100%);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    color: var(--ink);
    text-align:center;
  }
  html.dark .home-info-card{
    background:
      radial-gradient(circle at 50% 0%, rgba(224,176,58,0.2) 0%, transparent 60%),
      linear-gradient(180deg, #262220 0%, #201d1a 100%);
  }
  .home-date{ font-family: 'Quicksand', sans-serif; font-size: 1.05rem; text-transform: capitalize; margin-bottom: 4px; color: var(--info-text-brown); }
  .home-time{ font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: var(--info-text-brown); }
  .relation-location-live{ display:flex; align-items:center; justify-content:center; gap: 8px; flex-wrap:wrap; font-weight: 600; margin: 4px 0; }
  .home-weather{ display:flex; align-items:center; justify-content:center; gap: 10px; }
  .home-weather-icon{ font-size: 1.8rem; }
  .home-weather-temp{ font-size: 1.6rem; font-weight: 700; color: var(--info-text-brown); }
  .home-weather-label{ font-size: 0.9rem; opacity: 0.75; color: var(--info-text-brown); }
  .home-weather-loading{ font-size: 0.85rem; opacity: 0.75; }
  .home-weather-retry{
    background: color-mix(in srgb, var(--ink) 8%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); color: var(--ink);
    border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; margin: 3px;
  }
  .home-location-setup{ display:flex; flex-direction:column; gap: 8px; margin-top: 6px; }
  .home-location-setup input{ background: var(--paper-raised); border: 1px solid var(--line); color: var(--ink); }
  .home-location-setup input::placeholder{ color: var(--ink-soft); }
  .welcome-slide{
    position: fixed; inset: 0; z-index: 500;
    background:
      radial-gradient(circle at 50% 20%, rgba(240,198,79,0.35) 0%, transparent 55%),
      linear-gradient(180deg, #FBF8F0 0%, #F5F0E4 100%);
    color: var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 32px; gap: 6px; cursor: pointer;
    animation: welcomeFadeIn 1.1s ease;
  }
  html.dark .welcome-slide{
    background:
      radial-gradient(circle at 50% 20%, rgba(224,176,58,0.25) 0%, transparent 55%),
      linear-gradient(180deg, #1E1B17 0%, #191713 100%);
  }
  .welcome-slide.welcome-fade-out{
    animation: welcomeFadeOut 0.6s ease forwards;
  }
  @keyframes welcomeFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes welcomeFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .welcome-greeting{ font-family: 'Quicksand', sans-serif; font-size: 1.6rem; margin-bottom: 6px; }
  .flower-crown-svg{ width: 240px; max-width: 80vw; display:block; }
  .welcome-info-row{
    display:flex; align-items:center; gap: 8px; font-size: 0.9rem;
    margin: 10px 0 4px; text-transform:capitalize;
  }
  .welcome-info-row svg{ width: 14px; height: 14px; flex-shrink:0; }
  .welcome-message{ font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 1.05rem; margin-top: 14px; max-width: 280px; text-align: center; line-height: 1.5; }
  .welcome-tap-hint{ font-size: 0.75rem; opacity: 0.75; position: absolute; bottom: 36px; }
  .welcome-section-title{ font-family: 'Quicksand', sans-serif; font-size: 1.15rem; margin-bottom: 12px; }
  .small-garland-svg{ width: 220px; max-width: 70vw; display:block; margin: 0 auto; }
  .welcome-list{ display:flex; flex-direction:column; max-width: 300px; width:100%; }
  .welcome-list-item{
    display:flex; align-items:center; gap: 10px;
    padding: 6px 4px; font-size: 0.88rem; text-align:left;
  }
  .event-bullet-icon{ width: 22px; height: 22px; flex-shrink:0; }
  .event-divider-svg{ width:100%; height:14px; margin: 2px 0; display:block; }
  .welcome-list-empty{ font-size: 0.85rem; opacity: 0.85; display:flex; flex-direction:column; align-items:center; gap: 8px; }
  .empty-week-svg{ width: 100px; }
  .profile-banner{
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--teal);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
    display:flex; flex-direction:column; gap: 10px;
  }
  .profile-banner-text{ font-size: 0.82rem; color: var(--ink-soft); line-height:1.5; }
  .profile-banner-actions{ display:flex; align-items:center; justify-content:space-between; gap: 10px; }
  .profile-banner-btn{
    background: var(--teal); color: white; border: none; border-radius: 20px;
    padding: 7px 16px; font-size: 0.8rem; font-weight: 600;
  }
  .profile-banner-close{ background:none; border:none; color: var(--ink-soft); font-size: 1.1rem; padding: 4px 8px; }
  .search-input{
    width: 100%; border: 1px solid var(--line); border-radius: 20px; background: var(--paper-raised);
    color: var(--ink); padding: 10px 16px; font-size: 0.88rem; margin-bottom: 14px;
  }
  .pwd-row-secret{
    display:flex; align-items:center; gap: 8px; margin-top: 6px; font-family: monospace; font-size: 0.85rem;
  }
  .pwd-row-secret .icon-btn{ padding: 2px; width: 24px; height: 24px; }
  .pwd-row-secret svg{ width: 16px; height: 16px; }
  .category-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .category-tile{
    aspect-ratio: 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 12px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .category-tile svg{ width: 38px; height: 38px; }
  .category-tile span{ font-family: 'Quicksand', sans-serif; font-size: 0.98rem; color: var(--info-text-brown); text-align:center; padding: 0 10px; }

  .category-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .category-header{
    width: 100%; display:flex; align-items:center; justify-content:space-between;
    background: none; border: none; padding: 18px 18px; text-align:left;
    font-family: 'Quicksand', sans-serif; font-size: 1.1rem; color: var(--ink);
  }
  .category-chevron{ width: 18px; height: 18px; color: var(--ink-soft); display:flex; transition: transform .2s; }
  .category-chevron svg{ width: 100%; height: 100%; }
  .category-chevron.open{ transform: rotate(90deg); }
  .subcategory-list{}
  .subcategory-item{
    width: 100%; display:flex; align-items:center; justify-content:space-between;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 16px 18px; text-align:left; font-size: 0.95rem; color: var(--ink);
  }
  .subcategory-item:last-child{ border-bottom: none; }
  .subcategory-item .soon{ font-size: 0.68rem; color: var(--ink-soft); background: var(--paper); border-radius: 10px; padding: 2px 8px; }
  .life-vine-svg{ width: 100%; max-width: 320px; display:block; margin: 10px auto; }
  .life-vine-svg g[onclick]:active{ opacity: 0.65; }
  .wellbeing-pulse-block{ margin-bottom: 30px; cursor:pointer; }
  .wellbeing-pulse-block:active{ opacity: 0.65; }
  .wellbeing-pulse-svg{ width: 100%; display:block; }
  .wellbeing-pulse-label{ font-family:'Quicksand', sans-serif; font-size: 1.05rem; color: var(--info-text-brown); margin-top: 4px; }
  .wellbeing-pulse-preview{ font-size: 0.85rem; color: var(--info-text-brown); opacity: 0.75; }
  .finances-pots-content{ display:flex; flex-direction:column; }
  .finances-pots-center{ width:100%; margin-top: 22vh; }
  .finances-pots-svg{ width: 100%; max-width: 340px; display:block; margin: 0 auto; }
  .finances-pots-svg g[onclick]:active{ opacity: 0.65; }
  .finances-pots-labels{ display:flex; justify-content: space-between; max-width: 340px; margin: 0 auto; padding: 0 4px; }
  .finances-pots-label{ flex: 1; text-align:center; cursor:pointer; padding: 0 4px; }
  .finances-pots-label:active{ opacity: 0.65; }
  .finances-pots-title{ font-family:'Quicksand', sans-serif; font-size: 0.92rem; color: var(--info-text-brown); }
  .finances-pots-preview{ font-size: 0.72rem; color: var(--info-text-brown); opacity: 0.75; }

  /* ---------- NOTE EDITOR ---------- */
  .editor{

  .icon-btn svg{ width: 18px; height: 18px; }
  .editor-bar-actions{ display:flex; align-items:center; gap:2px; }

    border:none; background:transparent; outline:none;

  .editor-content.rich-editable ul, .editor-content.rich-editable ol{ padding-left: 22px; margin: 6px 0; }
  .editor-content.rich-editable li{ margin-bottom: 4px; }
  .note-view-content.rich ul, .note-view-content.rich ol{ padding-left: 22px; margin: 6px 0; }
  .note-view-content.rich li{ margin-bottom: 4px; }
  .inline-chk{ cursor:pointer; display:inline-block; margin-right:3px; user-select:none; font-size: 1.05em; line-height:1; vertical-align: -1px; }
  .note-toolbar{
    position: relative; flex-shrink:0;
    padding: 16px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--paper-raised);
  }
  .note-toolbar::before{
    content:''; position:absolute; top:0; left:0; right:0; height:12px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='12'><g><circle cx='10' cy='6' r='2.1' fill='%23C98F5E'/><circle cx='10' cy='3' r='1.2' fill='%236E9169'/><circle cx='10' cy='9' r='1.2' fill='%236E9169'/><circle cx='7.2' cy='6' r='1.2' fill='%236E9169'/><circle cx='12.8' cy='6' r='1.2' fill='%236E9169'/></g></svg>");
    background-repeat: repeat-x; background-size: 20px 12px;
  }

  .note-tb-btn{

  .hl-terracotta{ background-color:#E3B48C; }

  /* ---------- CALENDAR ---------- */
  .calendar-header{ display:flex; align-items:center; justify-content:space-between; padding: 10px 4px 18px; }
  .calendar-month-label{ font-family: 'Quicksand', sans-serif; font-size: 1.15rem; text-transform: capitalize; }
  .calendar-nav-btn{ background: var(--paper-raised); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .calendar-nav-btn svg{ width: 16px; height: 16px; }
  .calendar-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .calendar-weekday{ text-align:center; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

  .calendar-day.has-couple{ background: rgba(122,31,53,0.16); border: 1.5px solid #7A1F35; color: #7A1F35; font-weight: 600; }
  .calendar-toolbar{ display:flex; align-items:center; gap: 8px; margin-bottom: 12px; }
  .calendar-today-btn{ background: var(--paper-raised); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 0.78rem; color: var(--ink); flex-shrink:0; }
  .calendar-view-toggle{ display:flex; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 20px; padding: 3px; gap: 2px; margin-left: auto; }

  .calendar-view-toggle button.active{ background: var(--teal); color: #fff; font-weight: 600; }
  .calendar-filter-row{ display:flex; gap: 8px; padding: 0 0 14px; overflow-x:auto; }
  .calendar-filter-chip{
    flex-shrink:0; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 13px; font-size: 0.78rem; color: var(--ink-soft); display:flex; align-items:center; gap: 5px;

  .calendar-agenda-group-label{ font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); margin: 16px 0 6px; }
  .calendar-agenda-group-label:first-child{ margin-top: 0; }

  /* ---------- CALENDRIER ILLUSTRÉ (toute interface avec un calendrier) ---------- */

  .cal-illustrated .calendar-month-label::before{
    content:''; width: 15px; height: 15px; flex-shrink:0; background-color: var(--cal-accent);

    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 4C14 4 9 9 9 15c0-6-5-11-11-11 6 2 9 6 9 11 0-5 3-9 9-11z"/></svg>');

function normalizeUrl(url){
  const trimmed = (url || '').trim();
  if(!trimmed) return '';
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return 'https://' + trimmed;
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

function relationDurationParts(startISO){
  const [y,m,d] = startISO.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if(days < 0){
    months--;
    days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  }
  if(months < 0){
    years--;
    months += 12;
  }
  return { years, months, days };
}

async function addShoppingItem(){
  const input = document.getElementById('shoppingItemInput');
  const qtyInput = document.getElementById('shoppingQtyInput');
  const name = (input ? input.value : '').trim();
  if(!name) return;
  const quantity = (qtyInput ? qtyInput.value : '').trim();
  state.shoppingList.push({ id: 'sh' + Date.now(), name, quantity, category: guessShoppingCategory(name), checked: false });
  await storageSet('shoppingList', state.shoppingList);
  triggerAutoSync();
  if(input) input.value = '';
  if(qtyInput) qtyInput.value = '';
  render();
  const s = document.getElementById('shoppingItemInput');
  if(s) s.focus();
}

  item.category = cat;
  state.shoppingCategoryPickerFor = null;
  await storageSet('shoppingList', state.shoppingList);
  triggerAutoSync();
  render();
}

async function addItemsToShoppingList(items){
  let added = 0;
  items.forEach(it => {
    const name = (it.name || '').trim();
    if(!name) return;
    const exists = state.shoppingList.some(x => !x.checked && x.name.trim().toLowerCase() === name.toLowerCase());
    if(exists) return;
    state.shoppingList.push({
      id: 'sh' + Date.now() + Math.random().toString(36).slice(2,6),
      name,
      quantity: it.quantity || '',
      category: it.category || guessShoppingCategory(name),
      checked: false,
    });
    added++;
  });
  await storageSet('shoppingList', state.shoppingList);
  triggerAutoSync();
  render();
  return added;
}

async function saveShoppingListAsTemplate(){
  const activeItems = state.shoppingList.filter(i => !i.checked);
  if(!activeItems.length){ showToast(tr('shopping_no_items_to_save')); return; }
  const name = window.prompt(tr('shopping_template_name_prompt'), '');
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  state.shoppingTemplates.push({
    id: 'stpl' + Date.now(),
    name: trimmed,
    items: activeItems.map(i => ({ name: i.name, quantity: i.quantity || '', category: i.category || 'autre' })),
  });
  await storageSet('shoppingTemplates', state.shoppingTemplates);
  triggerAutoSync();
  showToast(tr('shopping_template_saved'));
  render();
}

async function applyShoppingTemplate(id){
  const tpl = state.shoppingTemplates.find(t => t.id === id);
  if(!tpl) return;
  const added = await addItemsToShoppingList(tpl.items);
  showToast(tr('shopping_template_applied', added));
}

async function deleteShoppingTemplate(id){
  state.shoppingTemplates = state.shoppingTemplates.filter(t => t.id !== id);
  await storageSet('shoppingTemplates', state.shoppingTemplates);
  triggerAutoSync();
  render();
}

function moodPatternInsights(){
  const allDates = Object.keys(state.moods);
  const positiveDates = allDates.filter(iso => MOOD_POSITIVE_IDS.includes(state.moods[iso]));
  const difficultDates = allDates.filter(iso => MOOD_DIFFICULT_IDS.includes(state.moods[iso]));

  function avgSleepHours(dates){
    const durations = dates.map(iso => {
      const entries = state.sleepLog.filter(e => e.date === iso && !e.isNap);
      if(!entries.length) return null;
      const totalMin = entries.reduce((sum,e) => sum + entryDurationMinutesGeneric(e.bedTime, e.wakeTime), 0);
      return totalMin / 60;
    }).filter(v => v !== null && v > 0);
    if(durations.length < 3) return null;
    return { avg: durations.reduce((a,b)=>a+b,0) / durations.length, count: durations.length };
  }

  function avgHydration(dates){
    const values = dates.map(iso => hydrationLitersForDate(iso)).filter(v => v > 0);
    if(values.length < 3) return null;
    return { avg: values.reduce((a,b)=>a+b,0) / values.length, count: values.length };
  }

  function avgBathroomVisits(dates){
    const values = dates.map(iso => state.bathroomLog.filter(e => e.date === iso).length).filter(v => v > 0);
    if(values.length < 3) return null;
    return { avg: values.reduce((a,b)=>a+b,0) / values.length, count: values.length };
  }

  function pctWithEntries(dates, log){
    if(dates.length < 3) return null;
    const withEntry = dates.filter(iso => log.some(e => e.date === iso)).length;
    return Math.round(100 * withEntry / dates.length);
  }

  const sleep = { positive: avgSleepHours(positiveDates), difficult: avgSleepHours(difficultDates) };
  const hydration = { positive: avgHydration(positiveDates), difficult: avgHydration(difficultDates) };
  const bathroom = { positive: avgBathroomVisits(positiveDates), difficult: avgBathroomVisits(difficultDates) };

  let migraine = null;
  if(state.migraines.length >= 2 && positiveDates.length >= 3 && difficultDates.length >= 3){
    const difficultPct = pctWithEntries(difficultDates, state.migraines);
    const positivePct = pctWithEntries(positiveDates, state.migraines);
    if(difficultPct !== null && positivePct !== null && (difficultPct > 0 || positivePct > 0)) migraine = { difficultPct, positivePct };
  }

  let stress = null;
  if(state.stressLog.length >= 2 && positiveDates.length >= 3 && difficultDates.length >= 3){
    const difficultPct = pctWithEntries(difficultDates, state.stressLog);
    const positivePct = pctWithEntries(positiveDates, state.stressLog);
    if(difficultPct !== null && positivePct !== null && (difficultPct > 0 || positivePct > 0)) stress = { difficultPct, positivePct };
  }

  let deprime = null;
  if(state.deprimeLog.length >= 2 && positiveDates.length >= 3 && difficultDates.length >= 3){
    const difficultPct = pctWithEntries(difficultDates, state.deprimeLog);
    const positivePct = pctWithEntries(positiveDates, state.deprimeLog);
    if(difficultPct !== null && positivePct !== null && (difficultPct > 0 || positivePct > 0)) deprime = { difficultPct, positivePct };
  }

  function pctFollowingEpisode(sourceLog, targetLog, hours){
    if(sourceLog.length < 3 || targetLog.length < 2) return null;
    const targetTimestamps = sourceLog === targetLog ? [] : targetLog.map(episodeTimestamp).filter(t => t !== null);
    if(!targetTimestamps.length) return null;
    const sourceTimestamps = sourceLog.map(episodeTimestamp).filter(t => t !== null);
    if(!sourceTimestamps.length) return null;
    const withPrecedent = sourceTimestamps.filter(t =>
      targetTimestamps.some(ts => ts <= t && (t - ts) <= hours * 3600000)
    ).length;
    return Math.round(100 * withPrecedent / sourceTimestamps.length);
  }

  let migraineAfterStress = null;
  {
    const pct = pctFollowingEpisode(state.migraines, state.stressLog, 24);
    if(pct !== null) migraineAfterStress = { pct };
  }

  let period = null;
  if(state.periodDays && state.periodDays.length){
    const periodMoodDates = state.periodDays.filter(iso => state.moods[iso]);
    const nonPeriodMoodDates = allDates.filter(iso => !state.periodDays.includes(iso));
    if(periodMoodDates.length >= 3 && nonPeriodMoodDates.length >= 3){
      const pctDifficult = arr => Math.round(100 * arr.filter(iso => MOOD_DIFFICULT_IDS.includes(state.moods[iso])).length / arr.length);
      period = { periodPct: pctDifficult(periodMoodDates), otherPct: pctDifficult(nonPeriodMoodDates), count: periodMoodDates.length };
    }
  }

  const hasSleepInsight = sleep.positive && sleep.difficult;
  const hasHydrationInsight = hydration.positive && hydration.difficult;
  const hasBathroomInsight = bathroom.positive && bathroom.difficult;
  const hasAny = hasSleepInsight || hasHydrationInsight || hasBathroomInsight || migraine || stress || deprime || migraineAfterStress || period;

  return { sleep, hydration, bathroom, migraine, stress, deprime, migraineAfterStress, period, hasSleepInsight, hasHydrationInsight, hasBathroomInsight, hasAny };
}

const JOURNAL_TOGETHER = '__together__';
function journalEntryMinuteRange(e){
  const toMin = (t) => {
    if(!t) return null;
    const [h,m] = t.split(':').map(Number);
    return (isNaN(h) || isNaN(m)) ? null : h*60+m;
  };
  const startMin = toMin(e.startTime);
  if(startMin === null) return { start: 0, end: 1 };
  let endMin = toMin(e.endTime);
  if(endMin === null) endMin = startMin;
  if(endMin < startMin) endMin += 24*60; // activity crosses midnight
  // Point-in-time entries (start === end) are left as a zero-width range here;
  // the row-span computation below gives them a minimal 1-row height using
  // whichever shared grid line comes next, instead of us fabricating a
  // start+1 boundary that no other entry shares (which used to introduce an
  // extra, unaligned row into the shared timeline grid).
  return { start: startMin, end: endMin };
}

function journalEntryWho(e){
  if(e.person === JOURNAL_TOGETHER) return 'together';
  if(!e.person) return 'me';
  return 'other';
}

function journalPersonDisplay(person){
  if(person === JOURNAL_TOGETHER) return tr('journal_who_together');
  return person;
}

function tr(key, ...args){
  const dict = STRINGS[state.lang] || STRINGS.fr;
  const val = dict[key] !== undefined ? dict[key] : STRINGS.fr[key];
  return typeof val === 'function' ? val(...args) : val;
}

function getTodayReminders(){
  const today = todayISO();
  const yesterday = (() => {
    const [y,m,d] = today.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() - 1);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  })();
  const reminders = [];
  if(!state.moods[today]) reminders.push({ key: 'mood_' + today, text: tr('home_reminder_mood'), action: `selectMoodDay('${today}')` });
  const hasRecentSleep = state.sleepLog.some(e => !e.isNap && (e.date === today || e.date === yesterday));
  if(!hasRecentSleep) reminders.push({ key: 'sleep_' + today, text: tr('home_reminder_sleep'), action: `openSleepEntry(null)` });
  const hasWeightToday = state.weightLog.some(e => e.date === today);
  if(!hasWeightToday) reminders.push({ key: 'weight_' + today, text: tr('home_reminder_weight'), action: `openWeightEntry(null)` });
  const untakenCount = state.treatments.filter(t => !(t.takenDates || []).includes(today)).length;
  if(untakenCount > 0) reminders.push({ key: 'treatment_' + today, text: tr('home_reminder_treatment', untakenCount), action: `openHealthCategory('medical')` });
  if(!diaryHasEntry(today)) reminders.push({ key: 'diary_' + today, text: tr('home_reminder_diary'), action: `selectDiaryDay('${today}')` });
  return reminders.filter(r => !state.dismissedReminders[r.key]);
}

  triggerAutoSync();
  render();
}

/* ---------- ENCRYPTION (Web Crypto API, AES-GCM + PBKDF2) ---------- */
const PLAINTEXT_KEYS = new Set(['lang','darkMode','googleClientId','rates','ratesDate','lastDriveSync']);
const SENSITIVE_KEYS = ['notes','noteCategories','events','journal','journalCategories','lastJournalCategory','moods','moodNotes',
  'budgetAmount','budgetTopups','expenses','savings','debts','projects','illnesses','symptoms','treatments','allergies','migraines','stressLog',
  'hydration','hydrationGoal','bathroomLog','periodDays','sleepLog','pendingSleepStart','height','weightLog','goalWeight',
  'activityLog','foodLog','relationInfo','personalInfo','contacts','recipes','fitnessLevel','trainingGoal',
  'assistantApiKey','tmdbApiKey','assistantModel','assistantHistory','assistantWindowDays','doctorHistory',
  'coachConstraints','coachProgram','aiSpendTotalUsd','passwordEntries','dismissedReminders','shoppingList'];
let cryptoKey = null;

function bytesToBase64(bytes){
  let binary = '';
  for(let i=0; i<bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToBytes(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function deriveKeyFromPassphrase(passphrase, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 210000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptString(plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, enc.encode(plaintext));
  const combined = new Uint8Array(iv.length + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.length);
  return 'enc:' + bytesToBase64(combined);
}

async function decryptPayloadWithKey(payload, key){
  if(!payload || !payload.startsWith('enc:')) throw new Error('not-encrypted');
  const combined = base64ToBytes(payload.slice(4));
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(dec);
}

async function decryptString(payload){
  return decryptPayloadWithKey(payload, cryptoKey);
}

async function encryptBackupPayload(payload){
  const saltB64 = window.localStorage.getItem('carnet:encSalt') || '';
  const inner = await encryptString(JSON.stringify(payload));
  return 'enc2:' + saltB64 + ':' + inner;
}
async function decryptBackupPayload(text){
  try{
    const trimmed = text.trim();
    if(trimmed.startsWith('enc2:')){
      const rest = trimmed.slice(5);
      const sepIdx = rest.indexOf(':');
      const saltB64 = rest.slice(0, sepIdx);
      const innerEnc = rest.slice(sepIdx + 1);
      const localSaltB64 = window.localStorage.getItem('carnet:encSalt') || '';
      let keyToUse = cryptoKey;
      if(saltB64 && saltB64 !== localSaltB64){
        const passphrase = window.prompt(tr('backup_passphrase_prompt'));
        if(!passphrase) return null;
        keyToUse = await deriveKeyFromPassphrase(passphrase, base64ToBytes(saltB64));
      }
      const json = await decryptPayloadWithKey(innerEnc, keyToUse);
      return JSON.parse(json);
    }
    if(trimmed.startsWith('enc:')){
      const json = await decryptString(trimmed);
      return JSON.parse(json);
    }
    return JSON.parse(trimmed);
  }catch(e){
    console.error('backup decrypt error', e);
    return null;
  }
}

async function migrateLegacyPlaintextData(){
  for(const key of SENSITIVE_KEYS){
    const raw = window.localStorage.getItem('carnet:' + key);
    if(raw === null || raw.startsWith('enc:')) continue;
    try{
      const value = JSON.parse(raw);
      await storageSet(key, value);
    }catch(e){ console.error('migration error for', key, e); }
  }
  window.localStorage.removeItem('carnet:pin_hash');
}

async function storageGet(key){
  try{
    const raw = window.localStorage.getItem('carnet:' + key);
    if(raw === null) return null;
    if(PLAINTEXT_KEYS.has(key)) return JSON.parse(raw);
    if(!cryptoKey) return null;
    const json = await decryptString(raw);
    return JSON.parse(json);
  }catch(e){ console.error('storage error', e); return null; }
}
async function storageSet(key, value){
  try{
    if(PLAINTEXT_KEYS.has(key)){
      window.localStorage.setItem('carnet:' + key, JSON.stringify(value));
      return;
    }
    if(!cryptoKey) return;
    const enc = await encryptString(JSON.stringify(value));
    window.localStorage.setItem('carnet:' + key, enc);
  }catch(e){ console.error('storage error', e); }
}

/* ---------- VIDEO STORAGE (IndexedDB — videos are too large for localStorage) ---------- */
const VIDEO_DB_NAME = 'carnet-media';
const VIDEO_STORE = 'videos';
let videoDbPromise = null;
function openVideoDB(){
  if(videoDbPromise) return videoDbPromise;
  videoDbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(VIDEO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(VIDEO_STORE)) db.createObjectStore(VIDEO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return videoDbPromise;
}
async function videoPut(id, blob){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function videoGet(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readonly');
    const req = tx.objectStore(VIDEO_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function videoDelete(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function formatFileSize(bytes){
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' Ko';
  return (bytes/(1024*1024)).toFixed(1) + ' Mo';
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

let toastTimer = null;
function showToast(msg){
  render();
  requestAnimationFrame(()=>{
    const t = document.querySelector('.toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 1800);
  });
}

let pendingUndoRestore = null;

function showUndoToast(message){
  render();
  requestAnimationFrame(()=>{
    const t = document.querySelector('.toast');
    if(!t) return;
    t.innerHTML = `<span>${escapeHtml(message)}</span><button type="button" class="toast-undo-btn" onclick="triggerUndo()">${tr('undo_button')}</button>`;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.classList.remove('show'); pendingUndoRestore = null; }, 5000);
  });
}

function triggerUndo(){
  const fn = pendingUndoRestore;
  pendingUndoRestore = null;
  clearTimeout(toastTimer);
  const t = document.querySelector('.toast');
  if(t) t.classList.remove('show');
  if(fn) fn();
}

async function removeFromArrayWithUndo(arrayKey, storageKey, id, message){
  const arr = state[arrayKey];
  const idx = arr.findIndex(x => x.id === id);
  if(idx === -1) return;
  const [item] = arr.splice(idx, 1);
  await storageSet(storageKey, arr);
  triggerAutoSync();
  pendingUndoRestore = async () => {
    state[arrayKey].splice(idx, 0, item);
    await storageSet(storageKey, state[arrayKey]);
    triggerAutoSync();
    render();
  };
  showUndoToast(message || tr('undo_deleted_generic'));
}

async function submitUnlockPassphrase(){
  const p = document.getElementById('passInputUnlock').value;
  if(!p){ return; }
  const saltB64 = window.localStorage.getItem('carnet:encSalt');
  const salt = base64ToBytes(saltB64);
  const key = await deriveKeyFromPassphrase(p, salt);
  cryptoKey = key;
  try{
    const verifierRaw = window.localStorage.getItem('carnet:encVerifier');
    const check = await decryptString(verifierRaw);
    if(check !== 'verify-ok') throw new Error('bad');
  }catch(e){
    cryptoKey = null;
    state.passError = tr('passphrase_wrong');
    render();
    return;
  }
  state.passError = '';
  await loadEncryptedAppData();
  if(!handleDeepLinkAfterUnlock()){
    goToWelcomeFlow();
  }
  attemptSilentGoogleReconnect();
}

async function changePassphrase(){
  const current = window.prompt(tr('security_current_passphrase_prompt'));
  if(current === null) return;
  const saltB64 = window.localStorage.getItem('carnet:encSalt');
  const salt = base64ToBytes(saltB64);
  const testKey = await deriveKeyFromPassphrase(current, salt);
  const oldKey = cryptoKey;
  cryptoKey = testKey;
  let ok = false;
  try{
    const verifierRaw = window.localStorage.getItem('carnet:encVerifier');
    ok = (await decryptString(verifierRaw)) === 'verify-ok';
  }catch(e){ ok = false; }
  if(!ok){
    cryptoKey = oldKey;
    showToast(tr('passphrase_wrong'));
    return;
  }
  const next = window.prompt(tr('security_new_passphrase_prompt'));
  if(next === null) { cryptoKey = oldKey; return; }
  if(next.length < 8){ cryptoKey = oldKey; showToast(tr('passphrase_too_short')); return; }
  const confirmNext = window.prompt(tr('security_confirm_new_passphrase_prompt'));
  if(confirmNext !== next){ cryptoKey = oldKey; showToast(tr('passphrase_mismatch')); return; }
  const newSalt = crypto.getRandomValues(new Uint8Array(16));
  const newKey = await deriveKeyFromPassphrase(next, newSalt);
  cryptoKey = newKey;
  window.localStorage.setItem('carnet:encSalt', bytesToBase64(newSalt));
  const verifier = await encryptString('verify-ok');
  window.localStorage.setItem('carnet:encVerifier', verifier);
  for(const key of SENSITIVE_KEYS){
    await storageSet(key, state[key]);
  }
  showToast(tr('security_passphrase_changed'));
}

let _listDragState = null;

function startItemDrag(e, itemId){
  e.preventDefault();
  const container = document.getElementById('listItemsContainer');
  const row = container && container.querySelector(`.list-item[data-id="${itemId}"]`);
  if(!container || !row) return;
  row.classList.add('dragging');
  _listDragState = { container };
  document.addEventListener('pointermove', onListItemDragMove);
  document.addEventListener('pointerup', onListItemDragEnd);
}

function onListItemDragMove(e){
  if(!_listDragState) return;
  const { container } = _listDragState;
  const draggingRow = container.querySelector('.list-item.dragging');
  if(!draggingRow) return;
  const rows = Array.from(container.querySelectorAll('.list-item:not(.dragging)'));
  const y = e.clientY;
  let inserted = false;
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(y < rect.top + rect.height / 2){
      container.insertBefore(draggingRow, r);
      inserted = true;
      break;
    }
  }
  if(!inserted) container.appendChild(draggingRow);
}

function onListItemDragEnd(){
  if(!_listDragState) return;
  const { container } = _listDragState;
  document.removeEventListener('pointermove', onListItemDragMove);
  document.removeEventListener('pointerup', onListItemDragEnd);
  const draggingRow = container.querySelector('.list-item.dragging');
  if(draggingRow) draggingRow.classList.remove('dragging');
  const newOrderIds = Array.from(container.querySelectorAll('.list-item')).map(r => r.dataset.id);
  const itemsById = {};
  (state.currentNote.items || []).forEach(i => { itemsById[i.id] = i; });
  state.currentNote.items = newOrderIds.map(id => itemsById[id]).filter(Boolean);
  _listDragState = null;
}

function fileToText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('lecture impossible'));
    reader.readAsText(file);
  });
}

function fileToCompressedDataUrl(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else{ width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image invalide'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.readAsDataURL(file);
  });
}

function getUpcomingOccurrences(daysAhead, filterCategory, searchQuery){
  const todayIso = todayISO();
  const q = (searchQuery || '').trim().toLowerCase();
  const [ty,tm,td] = todayIso.split('-').map(Number);
  const results = [];
  for(let i=0; i<=daysAhead; i++){
    const d = new Date(ty, tm-1, td+i);
    const iso = dateToISO(d.getFullYear(), d.getMonth(), d.getDate());
    state.events.forEach(e => {
      if(filterCategory && (e.category || 'rdv') !== filterCategory) return;
      if(q && !(e.title||'').toLowerCase().includes(q)) return;
      if(eventOccursOnDate(e, iso)) results.push({ date: iso, event: e });
    });
  }
  return results;
}

function getNextEvent(filterCategory){
  const occ = getUpcomingOccurrences(730, filterCategory, '');
  if(!occ.length) return null;
  occ.sort((a,b) => a.date.localeCompare(b.date));
  return occ[0];
}

function daysUntil(iso){
  const todayIso = todayISO();
  const [ty,tm,td] = todayIso.split('-').map(Number);
  const [ny,nm,nd] = iso.split('-').map(Number);
  const t = new Date(ty,tm-1,td);
  const n = new Date(ny,nm-1,nd);
  return Math.round((n - t) / 86400000);
}

function dateToISO(y,m,d){
  const pad = n => String(n).padStart(2,'0');
  return `${y}-${pad(m+1)}-${pad(d)}`;
}

function eventOccursOnDate(event, iso){
  if(!event.date) return false;
  if(event.date === iso) return true;
  if(!event.recurrence || event.recurrence === 'none') return false;
  const [sy,sm,sd] = event.date.split('-').map(Number);
  const [ty,tm,td] = iso.split('-').map(Number);
  const start = new Date(sy, sm-1, sd);
  const target = new Date(ty, tm-1, td);
  if(target < start) return false;
  if(event.recurrence === 'daily') return true;
  if(event.recurrence === 'weekly') return target.getDay() === start.getDay();
  if(event.recurrence === 'monthly') return td === sd;
  if(event.recurrence === 'yearly') return td === sd && tm === sm;
  return false;
}

  if(!e.title.trim()) return;
  const idx = state.events.findIndex(x => x.id === e.id);
  if(idx >= 0) state.events[idx] = e;
  else state.events.push(e);
  await storageSet('events', state.events);
  triggerAutoSync();
}

function eventOriginalLang(e){
  return e.originalLang || 'fr';
}
function eventHasFreshTranslation(e){
  return state.lang === 'en' && eventOriginalLang(e) === 'fr' && e.translatedEn
    && e.translatedEn.sourceTitle === (e.title || '') && e.translatedEn.sourceNotes === (e.notes || '');
}
function eventDisplayTitle(e){
  if(eventHasFreshTranslation(e)) return e.translatedEn.title || '';
  return e.title || '';
}
function eventDisplayNotes(e){
  if(eventHasFreshTranslation(e)) return e.translatedEn.notes || '';
  return e.notes || '';
}
async function ensureEventTranslation(id){
  if(state.lang !== 'en') return;
  const e = state.events.find(x => x.id === id);
  if(!e || !e.title || !e.title.trim()) return;
  if(eventOriginalLang(e) !== 'fr') return;
  const sig = e.title + '|' + (e.notes || '');
  if(e.translatedEn && e.translatedEn.sourceTitle === e.title && e.translatedEn.sourceNotes === (e.notes || '')) return;
  if(e.translateFailedFor === sig) return;
  if(state.eventsTranslating.has(id)) return;
  state.eventsTranslating.add(id);
  try{
    const [title, notes] = await Promise.all([
      myMemoryTranslate(e.title, 'fr', 'en'),
      (e.notes && e.notes.trim()) ? myMemoryTranslate(e.notes, 'fr', 'en') : Promise.resolve(''),
    ]);
    e.translatedEn = { title, notes, sourceTitle: e.title, sourceNotes: e.notes || '' };
    await storageSet('events', state.events);
    state.eventsTranslating.delete(id);
    render();
  }catch(err){
    console.error('event auto-translate error', err);
    e.translateFailedFor = sig;
    state.eventsTranslating.delete(id);
  }
}

function moodNoteHasFreshTranslation(){
  const iso = state.selectedMoodDate;

function moodNoteDisplayText(){

  return state.currentMoodNoteText || '';

async function ensureMoodNoteTranslation(){
  if(state.lang !== 'en') return;
  const iso = state.selectedMoodDate;
  const src = state.currentMoodNoteText;
  if(!iso || !src || !src.trim()) return;
  const cached = state.moodNoteTranslations[iso];
  if(cached && cached.sourceText === src) return;
  if(cached && cached.failedFor === src) return;
  if(state.moodNoteTranslating.has(iso)) return;
  state.moodNoteTranslating.add(iso);
  try{
    const text = await myMemoryTranslate(src, 'fr', 'en');
    state.moodNoteTranslations[iso] = { text, sourceText: src };
    await storageSet('moodNoteTranslations', state.moodNoteTranslations);
    state.moodNoteTranslating.delete(iso);
    render();
  }catch(err){
    console.error('mood note auto-translate error', err);
    state.moodNoteTranslations[iso] = { ...(state.moodNoteTranslations[iso]||{}), failedFor: src };
    state.moodNoteTranslating.delete(iso);
  }
}

function filmStats(){
  const entries = state.filmEntries;
  const total = entries.length;
  const avg = total ? entries.reduce((s,e) => s + (Number(e.rating)||0), 0) / total : 0;
  const genreCounts = {};
  entries.forEach(e => (e.genres||[]).forEach(g => { genreCounts[g] = (genreCounts[g]||0) + 1; }));
  const sortedGenres = Object.entries(genreCounts).sort((a,b) => b[1]-a[1]);
  return { total, avg, topGenre: sortedGenres.length ? sortedGenres[0][0] : null };
}

function getFilteredSortedFilmEntries(){
  let list = state.filmEntries.slice();
  if(state.filmTypeFilter !== 'all') list = list.filter(e => e.type === state.filmTypeFilter);
  if(state.filmGenreFilter !== 'all') list = list.filter(e => (e.genres||[]).includes(state.filmGenreFilter));
  if(state.filmMinRating > 0) list = list.filter(e => (Number(e.rating)||0) >= state.filmMinRating);
  if(state.filmFavoritesOnly) list = list.filter(e => !!e.favorite);
  const q = (state.filmListQuery || '').trim().toLowerCase();
  if(q) list = list.filter(e => (e.title||'').toLowerCase().includes(q));
  if(state.filmSortBy === 'rating') list.sort((a,b) => (Number(b.rating)||0) - (Number(a.rating)||0));
  else if(state.filmSortBy === 'ratingAsc') list.sort((a,b) => (Number(a.rating)||0) - (Number(b.rating)||0));
  else if(state.filmSortBy === 'alpha') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  else if(state.filmSortBy === 'dateAdded') list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  else list.sort((a,b) => (b.watchedDate||'').localeCompare(a.watchedDate||'') || (b.createdAt||0) - (a.createdAt||0));
  return list;
}

function filmAllGenres(){
  const set = new Set();
  state.filmEntries.forEach(e => (e.genres||[]).forEach(g => set.add(g)));
  return Array.from(set).sort((a,b) => a.localeCompare(b));
}

function filmBilanStats(year){
  const entries = state.filmEntries.filter(e => (e.watchedDate||'').slice(0,4) === String(year));
  const total = entries.length;
  const movies = entries.filter(e => e.type === 'movie').length;
  const series = entries.filter(e => e.type === 'series').length;
  const rated = entries.filter(e => Number(e.rating) > 0);
  const avg = rated.length ? rated.reduce((s,e) => s + Number(e.rating), 0) / rated.length : 0;
  const genreCounts = {};
  entries.forEach(e => (e.genres||[]).forEach(g => { genreCounts[g] = (genreCounts[g]||0) + 1; }));
  const sortedGenres = Object.entries(genreCounts).sort((a,b) => b[1]-a[1]);
  const topGenre = sortedGenres.length ? sortedGenres[0][0] : null;
  const bestRated = rated.length ? rated.slice().sort((a,b) => Number(b.rating) - Number(a.rating))[0] : null;
  return { total, movies, series, avg, topGenre, bestRated };
}

const TMDB_MOVIE_GENRES = {

  en: {28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Science Fiction',10770:'TV Movie',53:'Thriller',10752:'War',37:'Western'},
};
const TMDB_TV_GENRES = {
  fr: {10759:'Action & Aventure',16:'Animation',35:'Comédie',80:'Crime',99:'Documentaire',18:'Drame',10751:'Familial',10762:'Enfants',9648:'Mystère',10763:'Actualités',10764:'Réalité',10765:'Science-Fiction & Fantastique',10766:'Feuilleton',10767:'Talk-show',10768:'Guerre & Politique',37:'Western'},
  en: {10759:'Action & Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',10762:'Kids',9648:'Mystery',10763:'News',10764:'Reality',10765:'Sci-Fi & Fantasy',10766:'Soap',10767:'Talk',10768:'War & Politics',37:'Western'},
};

function tmdbGenreName(id, type){
  const table = (type === 'series' ? TMDB_TV_GENRES : TMDB_MOVIE_GENRES)[state.lang === 'en' ? 'en' : 'fr'];
  return table[id] || '';
}

async function searchFilmTitles(query, type){
  if(!state.tmdbApiKey) return 'nokey';
  const path = type === 'series' ? 'tv' : 'movie';
  const langParam = state.lang === 'en' ? 'en-US' : 'fr-FR';
  const url = `https://api.themoviedb.org/3/search/${path}?api_key=${encodeURIComponent(state.tmdbApiKey)}&query=${encodeURIComponent(query)}&language=${langParam}&include_adult=false`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response ' + res.status);
    const data = await res.json();
    return (data.results || []).slice(0, 8).map(r => {
      const title = type === 'series' ? (r.name || r.original_name || '') : (r.title || r.original_title || '');
      const dateStr = type === 'series' ? r.first_air_date : r.release_date;
      const genreId = (r.genre_ids || [])[0];
      return {
        title,
        year: (dateStr || '').slice(0,4),
        posterUrl: r.poster_path ? `https://image.tmdb.org/t/p/w500${r.poster_path}` : '',
        genre: genreId ? tmdbGenreName(genreId, type) : '',
      };
    }).filter(r => r.title);
  }catch(err){
    console.error('film search error', err);
    return null;
  }
}

async function runFilmSearch(){
  const q = (state.filmSearchQuery || '').trim();
  if(!q) return;
  if(!state.tmdbApiKey){
    state.filmSearchResults = 'nokey';
    state.filmSearchErrored = false;
    state.filmSearchLoading = false;
    render();
    return;
  }
  state.filmSearchLoading = true;
  state.filmSearchErrored = false;
  render();
  const results = await searchFilmTitles(q, state.filmSearchType);
  state.filmSearchLoading = false;
  state.filmSearchErrored = results === null;
  state.filmSearchResults = results === null ? [] : (results === 'nokey' ? 'nokey' : results);
  render();
}

function ageFromBirthDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const birth = new Date(y, m-1, d);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const monthDiff = now.getMonth() - birth.getMonth();
  if(monthDiff < 0 || (monthDiff === 0 && now.getDate() < birth.getDate())) age--;
  return age;
}

function recipeIngredientsText(recipe){
  if(recipe.ingredientsList) return recipe.ingredientsList;

function recipeAllergyMatches(recipe){

function recipePerServing(recipe){
  const s = recipe.servings || 1;
  return {
    cost: recipe.cost / s,
    calories: recipe.calories / s,
    protein: recipe.protein / s,
    carbs: recipe.carbs / s,
    fat: recipe.fat / s,
    sugar: recipe.sugar / s,
    fiber: recipe.fiber / s,
    sodium: recipe.sodium / s,
    potassium: recipe.potassium / s,
  };
}

function scaleIngredientAmount(amount, baseServings, desiredServings){
  if(!baseServings) return amount;
  return amount * (desiredServings / baseServings);
}
function formatScaledAmount(n){
  const rounded = Math.round(n * 100) / 100;
  return rounded % 1 === 0 ? String(rounded) : String(rounded);
}

const UNIT_CONVERSIONS = {
  mg: { base:'mass', factor: 0.001 },
  g: { base:'mass', factor: 1 },
  kg: { base:'mass', factor: 1000 },
  ml: { base:'vol', factor: 1 },
  cl: { base:'vol', factor: 10 },
  l: { base:'vol', factor: 1000 },
};

function formatSmartQuantity(amount, unit){
  const key = (unit || '').toLowerCase().trim();
  const conv = UNIT_CONVERSIONS[key];
  if(!conv || !isFinite(amount)) return `${formatScaledAmount(amount)}${unit ? unit : ''}`;
  const baseValue = amount * conv.factor;
  if(conv.base === 'mass'){
    if(baseValue >= 1000) return `${formatScaledAmount(baseValue/1000)}kg`;
    if(baseValue > 0 && baseValue < 1) return `${formatScaledAmount(baseValue*1000)}mg`;
    return `${formatScaledAmount(baseValue)}g`;
  }
  if(conv.base === 'vol'){
    if(baseValue >= 1000) return `${formatScaledAmount(baseValue/1000)}L`;
    if(baseValue >= 10) return `${formatScaledAmount(baseValue/10)}cl`;
    return `${formatScaledAmount(baseValue)}ml`;
  }
  return `${formatScaledAmount(amount)}${unit ? unit : ''}`;
}
function linkifyIngredientsInStep(text, ingredients, baseServings, desiredServings){
  let html = escapeHtml(text || '');
  (ingredients||[]).forEach(ing => {
    if(!ing.name || !ing.name.trim()) return;
    const escaped = ing.name.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escaped, 'gi');
    const scaled = scaleIngredientAmount(Number(ing.amount)||0, baseServings, desiredServings);
    const qty = `${formatSmartQuantity(scaled, ing.unit)} ${ing.name}`.trim();
    html = html.replace(regex, (m) => `<span class="ingredient-tap" onclick="event.stopPropagation(); showToast('${qty.replace(/'/g,"\\'")}')">${m}</span>`);
  });
  return html;
}

function getEffectiveRecipeContent(r, lang){
  if(lang === 'en' && r.translations && r.translations.en){
    const en = r.translations.en;
    const ingredients = (r.ingredients||[]).map(orig => {
      const match = (en.ingredients||[]).find(x => x.id === orig.id);
      return { ...orig, name: match ? match.name : orig.name, unit: match && match.unit ? match.unit : orig.unit };
    });
    const steps = (r.steps||[]).map(orig => {
      const match = (en.steps||[]).find(x => x.id === orig.id);
      return { ...orig, content: match ? match.content : orig.content };
    });

function episodeTimestamp(e){
  const time = e.startTime || e.time;
  if(!e.date || !time) return null;
  const dateParts = e.date.split('-').map(Number);
  const timeParts = time.split(':').map(Number);
  if(dateParts.length !== 3 || timeParts.length !== 2) return null;
  const [y, mo, d] = dateParts;
  const [h, mi] = timeParts;
  if([y,mo,d,h,mi].some(isNaN)) return null;
  return new Date(y, mo-1, d, h, mi).getTime();
}

function mostRecentEpisodeTimestamp(log, beforeMs){
  let best = null;
  log.forEach(e => {
    const t = episodeTimestamp(e);
    if(t !== null && t < beforeMs && (best === null || t > best)) best = t;
  });
  return best;
}

function getEpisodeCrossContext(excludeType){
  const nowMs = Date.now();
  const result = {};
  if(excludeType !== 'migraine'){
    const t = mostRecentEpisodeTimestamp(state.migraines, nowMs);
    result.migraineHoursAgo = t !== null ? (nowMs - t) / 3600000 : null;
  }
  if(excludeType !== 'stress'){
    const t = mostRecentEpisodeTimestamp(state.stressLog, nowMs);
    result.stressHoursAgo = t !== null ? (nowMs - t) / 3600000 : null;
  }
  if(excludeType !== 'deprime'){
    const t = mostRecentEpisodeTimestamp(state.deprimeLog, nowMs);
    result.deprimeHoursAgo = t !== null ? (nowMs - t) / 3600000 : null;
  }
  return result;
}

function bottleSvg(level, idSuffix){
  const fillFrac = level/4;
  const bodyTop = 14, bodyBottom = 66;
  const bodyHeight = bodyBottom - bodyTop;
  const fillHeight = fillFrac * bodyHeight;
  const fillY = bodyBottom - fillHeight;
  return `
    <svg viewBox="0 0 40 70" class="bottle-svg">
      <defs><clipPath id="bc-${idSuffix}"><rect x="6" y="${bodyTop}" width="28" height="${bodyHeight}" rx="6"/></clipPath></defs>
      <rect x="16" y="2" width="8" height="12" rx="2" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/>
      <rect x="6" y="${bodyTop}" width="28" height="${bodyHeight}" rx="6" fill="var(--paper-raised)" stroke="var(--ink-soft)" stroke-width="1.5"/>

function periodCycleStats(){
  const sorted = [...state.periodDays].sort();
  if(sorted.length === 0) return null;
  const starts = [];
  const durations = [];
  let streakStart = sorted[0];
  let streakLen = 1;
  for(let i=1; i<sorted.length; i++){
    const prev = new Date(sorted[i-1]);
    const cur = new Date(sorted[i]);
    const diffDays = Math.round((cur - prev) / 86400000);
    if(diffDays === 1){
      streakLen++;
    } else {
      starts.push(streakStart);
      durations.push(streakLen);
      streakStart = sorted[i];
      streakLen = 1;
    }
  }
  starts.push(streakStart);
  durations.push(streakLen);

  const avgDuration = Math.round(durations.reduce((a,b)=>a+b,0) / durations.length);
  if(starts.length < 2){
    return { avgCycle: null, avgDuration, nextEstimate: null };
  }
  const gaps = [];
  for(let i=1; i<starts.length; i++){
    const diff = Math.round((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
    gaps.push(diff);
  }
  const avgCycle = Math.round(gaps.reduce((a,b)=>a+b,0) / gaps.length);
  const lastStart = new Date(starts[starts.length-1]);
  const next = new Date(lastStart);
  next.setDate(next.getDate() + avgCycle);
  return { avgCycle, avgDuration, nextEstimate: dateToISO(next.getFullYear(), next.getMonth(), next.getDate()) };
}

function aggregatedWeightData(mode){
  const sorted = [...state.weightLog].sort((a,b)=> a.date.localeCompare(b.date));
  if(mode === 'daily'){
    return sorted.map(e => ({ label: e.date.slice(5), value: Number(e.weight) }));
  }
  const groups = {};
  sorted.forEach(e => {
    let key;
    if(mode === 'weekly'){
      const d = new Date(e.date);
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = dateToISO(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate());
    } else {
      key = e.date.slice(0,7);
    }
    if(!groups[key]) groups[key] = [];
    groups[key].push(Number(e.weight));
  });
  return Object.keys(groups).sort().map(k => ({
    label: mode === 'weekly' ? k.slice(5) : k,
    value: groups[k].reduce((a,b)=>a+b,0) / groups[k].length,
  }));
}

function currentWeekActivities(){
  const now = new Date();
  const dayOffset = (now.getDay() + 6) % 7; // Monday = 0
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOffset);
  const mondayIso = dateToISO(monday.getFullYear(), monday.getMonth(), monday.getDate());
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const sundayIso = dateToISO(sunday.getFullYear(), sunday.getMonth(), sunday.getDate());
  return state.activityLog.filter(e => e.date >= mondayIso && e.date <= sundayIso);
}

function weekSessionsCount(){ return currentWeekActivities().length; }
function weekCaloriesSum(){ return currentWeekActivities().reduce((sum, e) => sum + (Number(e.calories) || 0), 0); }
function weekDistanceSum(){ return currentWeekActivities().reduce((sum, e) => sum + (Number(e.distanceKm) || 0), 0); }

function computeSportAchievements(){
  const badges = [];
  // Weight change since the first logged entry
  if(state.weightLog.length >= 2){
    const sorted = [...state.weightLog].sort((a,b)=> a.date.localeCompare(b.date));
    const first = Number(sorted[0].weight);
    const last = Number(sorted[sorted.length-1].weight);
    const diff = Math.round((last - first) * 10) / 10;
    if(diff <= -1) badges.push({ icon: 'heart', text: tr('sport_achievement_weight_loss', Math.abs(diff)) });
    else if(diff >= 1) badges.push({ icon: 'heart', text: tr('sport_achievement_weight_gain', diff) });
  }
  // Sessions this month
  const monthPrefix = todayISO().slice(0,7);
  const sessionsThisMonth = state.activityLog.filter(e => (e.date || '').startsWith(monthPrefix)).length;
  if(sessionsThisMonth >= 1) badges.push({ icon: 'dumbbell', text: tr('sport_achievement_sessions_month', sessionsThisMonth) });
  // Consecutive-day streak of logged activity, ending today or yesterday
  const activityDates = new Set(state.activityLog.map(e => e.date));
  let streak = 0;
  let cursor = new Date();
  if(!activityDates.has(todayISO())){
    cursor.setDate(cursor.getDate() - 1);
  }
  while(true){
    const iso = dateToISO(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    if(!activityDates.has(iso)) break;
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  if(streak >= 2) badges.push({ icon: 'assistant', text: tr('sport_achievement_streak', streak) });
  return badges;
}

function avgPerDay(list){
  if(!list.length) return 0;
  const byDay = {};
  list.forEach(e => { byDay[e.date] = (byDay[e.date]||0) + (Number(e.calories)||0); });
  const days = Object.keys(byDay);
  const total = days.reduce((a,d)=> a + byDay[d], 0);
  return total / days.length;
}

function weightTrendDaysToGoal(){
  const sorted = [...state.weightLog].sort((a,b)=> a.date.localeCompare(b.date));
  if(sorted.length < 2 || !state.goalWeight) return undefined;
  const first = sorted[0], last = sorted[sorted.length-1];
  const daysSpan = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  if(daysSpan <= 0) return undefined;
  const rate = (Number(last.weight) - Number(first.weight)) / daysSpan; // kg/day
  const delta = state.goalWeight - Number(last.weight);
  if(Math.abs(delta) < 0.05) return 'reached';
  if(rate === 0 || Math.sign(rate) !== Math.sign(delta)) return 'wrong_direction';
  return Math.round(delta / rate);
}

function calorieDaysToGoal(){
  const latest = latestWeight();
  if(!latest || !state.goalWeight) return undefined;
  const avgFood = avgPerDay(state.foodLog);
  const avgActivity = avgPerDay(state.activityLog);
  if(!state.foodLog.length && !state.activityLog.length) return undefined;
  const netDaily = avgFood - avgActivity; // positive = surplus (gain), negative = deficit (loss)
  const delta = state.goalWeight - Number(latest.weight); // kg needed
  if(Math.abs(delta) < 0.05) return 'reached';
  const kcalNeeded = delta * 7700;
  if(netDaily === 0 || Math.sign(netDaily) !== Math.sign(kcalNeeded)) return 'wrong_direction';
  return Math.round(kcalNeeded / netDaily);
}

function formatGoalDate(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  return d.toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
}

async function geocodeCity(cityName, countryName){
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName.trim())}&count=8&language=fr`);
  if(!res.ok) throw new Error('geocode-failed');
  const data = await res.json();
  if(!data.results || !data.results.length) return null;
  let match = data.results[0];
  if(countryName){
    const found = data.results.find(r => r.country && r.country.toLowerCase().includes(countryName.toLowerCase()));
    if(found) match = found;
  }
  return { lat: match.latitude, lon: match.longitude, label: `${match.name}, ${match.country}`, source: 'manual' };
}

async function fetchLocationWeather(side, lat, lon){

        utcOffsetSeconds: data.utc_offset_seconds || 0,

    }

async function repayDebt(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt) return;
  const raw = window.prompt(tr('debt_repay_prompt'), '');
  if(raw === null) return;
  const val = parseFloat(raw.replace(',', '.'));
  if(isNaN(val) || val <= 0) return;
  if(debt.originalAmount === undefined) debt.originalAmount = Number(debt.amount);
  const remaining = Number(debt.amount) - val;
  debt.amount = remaining > 0 ? remaining : 0;
  debt.settled = remaining <= 0;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

async function settleDebt(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt) return;
  if(debt.originalAmount === undefined) debt.originalAmount = Number(debt.amount);
  debt.amount = 0;
  debt.settled = true;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

async function undoDebtRepayment(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt || debt.originalAmount === undefined) return;
  debt.amount = debt.originalAmount;
  delete debt.originalAmount;
  debt.settled = false;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

function renderWeightChart(){
  const data = aggregatedWeightData(state.weightChartMode);
  if(data.length < 2) return `<div class="translate-disclaimer">${tr('sport_chart_empty')}</div>`;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const w = 300, h = 120, pad = 12;
  const stepX = (w - 2*pad) / (data.length - 1);
  const coords = data.map((d,i) => {
    const x = pad + i*stepX;
    const y = pad + (1 - (d.value - min)/range) * (h - 2*pad);
    return { x, y };
  });
  const points = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="var(--teal-deep)"></circle>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="weight-chart-svg" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="var(--teal)" stroke-width="2"/>
      ${dots}
    </svg>
    <div class="weight-chart-labels">
      <span>${data[0].label} · ${min.toFixed(1)}kg</span>
      <span>${data[data.length-1].label} · ${max.toFixed(1)}kg</span>
    </div>
  `;
}

const DEEPLINK_NEW_JOURNAL_ENTRY = 'nouvelle-entree-journal';

function journalDeepLinkRequested(){
  // Accept both a query param (?action=..., most reliable across iOS home-screen bookmarks,
  // since fragments/hashes are sometimes dropped when a page is saved to the home screen)
  // and a hash (#...) for anyone who already saved the old-style link.
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('action') === DEEPLINK_NEW_JOURNAL_ENTRY) return true;
  }catch(err){ /* ignore */ }
  return window.location.hash === '#' + DEEPLINK_NEW_JOURNAL_ENTRY;
}

function handleDeepLinkAfterUnlock(){
  if(journalDeepLinkRequested()){
    window.history.replaceState(null, '', window.location.pathname);
    state.journalDate = todayISO();
    openJournalEntry(null);
    return true;
  }
  return false;
}

  if(!e) return [];
  const cats = journalEntryCategories(e);
  const q = (query || '').trim().toLowerCase();
  let pool = state.journal.filter(x => x.id !== e.id && (x.text||'').trim());
  if(cats.length){
    pool = pool.filter(x => journalEntryCategories(x).some(c => cats.includes(c)));
  }
  pool.sort((a,b) => (b.date + (b.startTime||'')).localeCompare(a.date + (a.startTime||'')));
  const seen = new Set();
  const results = [];
  for(const x of pool){
    const t = x.text.trim();
    const key = t.toLowerCase();
    if(seen.has(key)) continue;
    if(q && !key.includes(q)) continue;
    seen.add(key);
    results.push(t);
    if(results.length >= 5) break;
  }
  return results;
}

function entryDurationMinutesGeneric(startTime, endTime){
  if(!startTime || !endTime) return 0;
  const [sh,sm] = startTime.split(':').map(Number);
  const [eh,em] = endTime.split(':').map(Number);
  if(isNaN(sh) || isNaN(eh)) return 0;
  let start = sh*60+sm, end = eh*60+em;
  if(end < start) end += 24*60;
  return end - start;
}

function entryDurationMinutes(e){
  return entryDurationMinutesGeneric(e.startTime, e.endTime);
}

function formatDuration(totalMinutes){
  if(totalMinutes <= 0) return '0min';
  const h = Math.floor(totalMinutes/60);
  const m = totalMinutes % 60;
  if(h === 0) return `${m}min`;
  if(m === 0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}

function journalCatBlock(e, size){
  const cats = journalEntryCategories(e).map(id => journalCategoryById(id)).filter(Boolean);

  const duration = entryDurationMinutes(e);
  const hasText = !!(e.text && e.text.trim());

  if(!cats.length){

  }
  if(!hasText && cats.length > 1){
    return `
      <div class="journal-cat-stack-row">
        <div class="journal-cat-stack">

        </div>
        ${duration > 0 ? `<div class="journal-cat-stack-duration">${formatDuration(duration)}</div>` : ''}

function compareNotes(a, b){
  if(state.notesSortBy === 'created') return noteCreatedTime(b) - noteCreatedTime(a);
  if(state.notesSortBy === 'alpha') return (a.title||'').localeCompare((b.title||''), undefined, {sensitivity:'base'});
  if(state.notesSortBy === 'type'){
    const rank = n => n.type === 'list' ? 0 : (n.photos && n.photos.length ? 1 : 2);
    const diff = rank(a) - rank(b);
    return diff !== 0 ? diff : b.updated - a.updated;
  }
  return b.updated - a.updated;
}

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_BACKUP_FILENAME = 'carnet-sauvegarde.json';
let googleTokenClient = null;
let googleAccessToken = null;
let driveFileId = null;

function triggerAutoSync(){
  if(!state.googleConnected) return;

}

async function setGoogleClientId(value){
  state.googleClientId = value.trim();

}

function ensureGoogleTokenClient(){
  if(!state.googleClientId) return null;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if(googleTokenClient) return googleTokenClient;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.googleClientId,
    scope: DRIVE_SCOPE,
    callback: () => {},
  });
  return googleTokenClient;
}

function requestGoogleToken(){
  return new Promise((resolve, reject)=>{
    const client = ensureGoogleTokenClient();
    if(!client){ reject(new Error('google-not-ready')); return; }
    client.callback = (resp) => {
      if(resp.error){ reject(resp); return; }
      googleAccessToken = resp.access_token;
      resolve(resp.access_token);
    };
    client.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
  });
}

async function attemptSilentGoogleReconnect(){
  if(!state.googleClientId) return;
  const wasConnected = await storageGet('googleWasConnected');
  if(!wasConnected) return;
  let attempts = 0;
  const tryReconnect = () => {
    attempts++;
    const client = ensureGoogleTokenClient();
    if(!client){
      if(attempts < 10) setTimeout(tryReconnect, 500);
      return;
    }
    client.callback = (resp) => {
      if(resp.error) return; // échec silencieux (hors-ligne, popup bloqué...) : pas d'erreur affichée
      googleAccessToken = resp.access_token;
      state.googleConnected = true;
      render();
      driveUploadBackup();
    };
    try{
      client.requestAccessToken({ prompt: '' });
    }catch(e){
      // échec silencieux
    }
  };
  tryReconnect();
}

  if(!state.googleClientId){ showToast(tr('cloud_missing_client_id')); return; }
  try{
    await requestGoogleToken();
    state.googleConnected = true;
