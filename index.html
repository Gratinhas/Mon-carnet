      ${state.symptoms.length ? `<div class="budget-list">${symptomRows}</div>` : `<div class="translate-disclaimer">${tr('health_empty')}</div>`}
      <button class="settings-btn-full secondary budget-add-btn" onclick="openSymptomEntry(null)">${tr('budget_add')}</button>
    </div>
  `;

  // Treatment block
  const todayIso = todayISO();
  const treatmentRows = state.treatments.slice(0,8).map(e => {
    const takenToday = (e.takenDates || []).includes(todayIso);
    return `
    <div class="budget-row" onclick='openTreatmentEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
      <div class="budget-row-desc">
        <div>${escapeHtml(e.name)}${e.usualTime ? ` <span class="translate-disclaimer" style="display:inline">(${e.usualTime})</span>` : ''}</div>
        <div class="budget-row-date">${e.date ? formatDateDisplay(e.date) : tr('budget_no_date')}${e.notes ? ' · ' + escapeHtml(e.notes) : ''}</div>
      </div>
      <button type="button" class="treatment-taken-btn ${takenToday?'taken':''}" onclick="toggleTreatmentTakenToday('${e.id}', event)" title="${takenToday ? tr('health_treatment_taken_today') : tr('health_treatment_mark_taken')}">
        ${takenToday ? '✓' : '○'}
      </button>
    </div>
  `;}).join('');
  const treatmentBlock = `
    <div class="budget-block">
      <div class="budget-block-header"><div class="budget-block-title">${tr('health_treatments')}</div></div>
      ${state.treatments.length ? `<div class="budget-list">${treatmentRows}</div>` : `<div class="translate-disclaimer">${tr('health_empty')}</div>`}
      <button class="settings-btn-full secondary budget-add-btn" onclick="openTreatmentEntry(null)">${tr('budget_add')}</button>
    </div>
  `;

  // Allergy block
  const allergyRows = state.allergies.slice(0,8).map(e => `
    <div class="budget-row" onclick='openAllergyEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
      <div class="budget-row-desc">
        <div>${escapeHtml(e.name)}</div>
        <div class="budget-row-date">${e.notes ? escapeHtml(e.notes) : ''}</div>
      </div>
    </div>
  `).join('');
  const allergyBlock = `
    <div class="budget-block">
      <div class="budget-block-header"><div class="budget-block-title">${tr('health_allergies')}</div></div>
      ${state.allergies.length ? `<div class="budget-list">${allergyRows}</div>` : `<div class="translate-disclaimer">${tr('health_empty')}</div>`}
      <button class="settings-btn-full secondary budget-add-btn" onclick="openAllergyEntry(null)">${tr('budget_add')}</button>
    </div>
  `;

  // Hydration block
  const hydrationBottles = state.hydration[state.hydrationDate] || [];
  const hydrationTotal = hydrationTotalLiters();
  const bottlesHtml = hydrationBottles.map((level, i) => `
    <div class="bottle-item">
      <button class="bottle-btn" onclick="cycleHydrationBottle(${i})">${bottleSvg(level, i)}</button>
      <button class="category-chip-x" onclick="removeHydrationBottle(${i})">×</button>
    </div>
  `).join('');
  const hyLocale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [hy,hm,hd] = state.hydrationDate.split('-').map(Number);
  const hydrationDayLabel = new Date(hy,hm-1,hd).toLocaleDateString(hyLocale, { weekday:'short', day:'numeric', month:'short' });
  const hydrationBlock = `
    <div class="budget-block">
      <div class="budget-block-header">
        <div class="budget-block-title">${tr('health_hydration_title')}</div>
        <div class="budget-block-total" style="color:#3F7D8C">${hydrationTotal.toFixed(2)} L</div>
      </div>
      <div class="calendar-header" style="padding-bottom:10px">
        <button class="calendar-nav-btn" onclick="changeHydrationDay(-1)">${svgIcon('chevronLeft')}</button>
        <div class="calendar-month-label" style="font-size:0.9rem; text-transform:capitalize;">${hydrationDayLabel}</div>
        <button class="calendar-nav-btn" onclick="changeHydrationDay(1)">${svgIcon('chevronRight')}</button>
      </div>
      ${(() => {
        const rec = computeRecommendedHydrationLiters();
        return rec !== null
          ? `<div class="budget-remaining">${tr('health_hydration_recommended', rec)}</div>`
          : `<div class="translate-disclaimer">${tr('health_hydration_recommended_missing')}</div>`;
      })()}
      <div class="bottle-row">
        ${bottlesHtml}
        <button type="button" class="bottle-add-btn" onclick="addHydrationBottle()">+</button>
      </div>
      <div class="translate-disclaimer" style="margin-top:10px">${tr('health_hydration_hint')}</div>
    </div>
  `;

  // Migraine block
  const migraineRows = state.migraines.slice(0,8).map(e => {
    const level = intensityById(e.intensity);
    const duration = e.endTime ? entryDurationMinutesGeneric(e.startTime, e.endTime) : 0;
    return `
    <div class="budget-row" onclick='openMigraineEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
      <div class="budget-row-desc">
        <div><span class="category-dot" style="background:${level ? level.color : '#999'}"></span>${intensityLabel(e.intensity)}</div>
        <div class="budget-row-date">${formatDateDisplay(e.date)} · ${e.startTime}${e.endTime ? ' → ' + e.endTime : ''}${duration ? ' (' + formatDuration(duration) + ')' : ''}</div>
      </div>
    </div>
  `;}).join('');
  const migraineBlock = `
    <div class="budget-block">
      <div class="budget-block-header"><div class="budget-block-title">${tr('health_migraine')}</div></div>
      ${state.migraines.length ? `<div class="budget-list">${migraineRows}</div>` : `<div class="translate-disclaimer">${tr('health_empty')}</div>`}
      <button class="settings-btn-full secondary budget-add-btn" onclick="openMigraineEntry(null)">${tr('budget_add')}</button>
    </div>
  `;

  // Bathroom block
  const bathroomRows = state.bathroomLog.slice(0,8).map(e => `
    <div class="budget-row">
      <div class="budget-row-desc"><div>${formatDateDisplay(e.date)} · ${e.time}</div></div>
      <button class="row-delete-btn" onclick="deleteBathroomEntry('${e.id}')">×</button>
    </div>
  `).join('');
  const bathroomBlock = `
    <div class="budget-block">
      <div class="budget-block-header"><div class="budget-block-title">${tr('health_bathroom')}</div></div>
      <div class="budget-remaining">${tr('health_bathroom_count', state.bathroomLog.length)}</div>
      ${state.bathroomLog.length ? `<div class="budget-list">${bathroomRows}</div>` : `<div class="translate-disclaimer">${tr('health_empty')}</div>`}
      <button class="settings-btn-full secondary budget-add-btn" onclick="logBathroomVisit()">${tr('health_bathroom_log_button')}</button>
    </div>
  `;

  // Period block (mini calendar)
  const y = state.periodYear, m = state.periodMonth;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const monthLabel = new Date(y, m, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(y, m, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  let periodCells = '';
  for(let i=0; i<startOffset; i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    periodCells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    const marked = state.periodDays.includes(iso);
    const style = marked ? `style="background:#7A1F35; color:white; font-weight:600;"` : '';
    periodCells += `<button class="calendar-day" ${style} onclick="togglePeriodDay('${iso}')"><span>${d}</span></button>`;
  }
  const totalPeriodCells = startOffset + daysInMonth;
  const periodTrailing = (7 - (totalPeriodCells % 7)) % 7;
  for(let d=1; d<=periodTrailing; d++){
    periodCells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  const stats = periodCycleStats();
  const periodBlock = `
    <div class="budget-block">
      <div class="budget-block-header"><div class="budget-block-title">${tr('health_period')}</div></div>
      <p class="settings-desc">${tr('health_period_desc')}</p>
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="changePeriodMonth(-1)">${svgIcon('chevronLeft')}</button>
        <div class="calendar-month-label">${monthLabel}</div>
        <button class="calendar-nav-btn" onclick="changePeriodMonth(1)">${svgIcon('chevronRight')}</button>
      </div>
      <div class="calendar-grid">${periodCells}</div>
      <div class="journal-summary" style="margin-top:16px">
        ${stats ? `
          <div class="summary-row"><span class="summary-name">${tr('health_period_avg_duration', stats.avgDuration)}</span></div>
          ${stats.avgCycle ? `<div class="summary-row"><span class="summary-name">${tr('health_period_avg_cycle', stats.avgCycle)}</span></div>
          <div class="summary-row"><span class="summary-name">${tr('health_period_next_estimate', formatDateDisplay(stats.nextEstimate))}</span></div>` : `<div class="translate-disclaimer">${tr('health_period_not_enough_data')}</div>`}
        ` : `<div class="translate-disclaimer">${tr('health_period_not_enough_data')}</div>`}
      </div>
    </div>
  `;

  // Sleep block
  const sleepByDate = {};
  state.sleepLog.forEach(e => {
    const mins = entryDurationMinutesGeneric(e.bedTime, e.wakeTime);
    sleepByDate[e.date] = (sleepByDate[e.date] || 0) + mins;
  });
  const dailyTotals = Object.values(sleepByDate);
  const avgSleep = dailyTotals.length ? Math.round(dailyTotals.reduce((a,b)=>a+b,0) / dailyTotals.length) : 0;
  const wakeUpsValues = state.sleepLog.map(e => e.wakeUps || 0);

function formatFlexibleDate(dateStr){
  if(!dateStr) return tr('budget_no_date');
  if(/^\d{4}$/.test(dateStr)) return dateStr;
  if(/^\d{4}-\d{2}$/.test(dateStr)){
    const [y,m] = dateStr.split('-');
    return `${m}/${y}`;
  }
  if(/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return formatDateDisplay(dateStr);
  return dateStr;
}

function detectDatePrecision(dateStr){
  if(!dateStr) return 'none';
  if(/^\d{4}$/.test(dateStr)) return 'year';
  if(/^\d{4}-\d{2}$/.test(dateStr)) return 'month';
  return 'full';
}

function renderMoodCalendar(){
  const y = state.moodYear, m = state.moodMonth;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const monthLabel = new Date(y, m, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(y, m, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const todayIso = todayISO();

  const weekdayLabels = [0,1,2,3,4,5,6].map(i => {
    const d = new Date(2024, 0, 1 + i);
    return d.toLocaleDateString(locale, { weekday: 'short' }).slice(0,2);
  });

  let cells = '';
  for(let i=0; i<startOffset; i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    const isToday = iso === todayIso;
    const mood = state.moods[iso] ? moodById(state.moods[iso]) : null;
    const hasNote = !!state.moodNotes[iso];
    const style = mood ? `style="background:${mood.color}22; border:1.5px solid ${mood.color}; color:${mood.color};"` : '';
    cells += `
      <button class="calendar-day ${isToday && !mood ?'today':''}" ${style} onclick="selectMoodDay('${iso}')">
        <span>${d}</span>
        ${mood ? `<div class="calendar-day-dot" style="background:${mood.color}"></div>` : ''}
        ${hasNote ? `<div class="mood-note-marker">✎</div>` : ''}
      </button>
    `;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }

  const legend = MOODS.map(mo => `
    <div class="mood-legend-item"><span class="category-dot" style="background:${mo.color}"></span>${moodLabel(mo.id)}</div>
  `).join('');

  const monthPrefix = `${y}-${String(m+1).padStart(2,'0')}-`;
  const counts = {};
  Object.keys(state.moods).forEach(dateKey => {
    if(dateKey.startsWith(monthPrefix)){
      const id = state.moods[dateKey];
      counts[id] = (counts[id] || 0) + 1;
    }
  });
  const summaryRows = MOODS.filter(mo => counts[mo.id] > 0).map(mo => `
    <div class="summary-row">
      <span class="category-dot" style="background:${mo.color}"></span>
      <span class="summary-name">${moodLabel(mo.id)}</span>
      <span class="summary-duration">${tr('mood_summary_count', counts[mo.id])}</span>
    </div>
  `).join('');
  const summary = `
    <div class="journal-summary">
      <div class="photo-section-label">${tr('mood_summary_title')}</div>
      ${summaryRows || `<div class="translate-disclaimer">${tr('mood_summary_empty')}</div>`}

  `;

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>

      </div>
      <div class="calendar-weekdays">
        ${weekdayLabels.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
      </div>
      <div class="calendar-grid">${cells}</div>
      <div class="mood-legend">${legend}</div>
      ${summary}
    </div>
    ${renderBottomNav()}
  `;
}

function renderJournal(){
  if(state.journalSearchActive){
    const q = state.journalSearchQuery.trim().toLowerCase();
    const locale2 = state.lang === 'en' ? 'en-GB' : 'fr-FR';
    const results = q ? state.journal
      .filter(e => (e.text||'').toLowerCase().includes(q))
      .sort((a,b) => (b.date+((b.startTime)||'')).localeCompare(a.date+((a.startTime)||'')))
      : [];
    const resultsHtml = results.length ? `
      <div class="journal-list">
        ${results.map(e => {
          const cat = e.category ? journalCategoryById(e.category) : null;
          const [ry,rm,rd] = e.date.split('-').map(Number);
          const dLabel = new Date(ry,rm-1,rd).toLocaleDateString(locale2, { weekday:'short', day:'numeric', month:'short' });
          return `
            <div class="budget-row" onclick="goToJournalSearchResult('${e.date}')">
              <div class="budget-row-desc">
                <div>${cat ? `<span class="category-dot" style="background:${cat.color}"></span>` : ''}${escapeHtml(e.text)}</div>
                <div class="budget-row-date">${dLabel}${e.startTime ? ' · ' + e.startTime : ''}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : `<div class="translate-disclaimer">${q ? tr('search_no_results') : ''}</div>`;

    return `
      <div class="top-bar">
        <div class="top-bar-left">
          <button class="icon-btn" onclick="toggleJournalSearch()">${tr('cat_back')}</button>
          <h1>${tr('nav_journal')}</h1>
        </div>
      </div>
      <div class="content">
        <input type="text" id="journalSearchInput" class="search-input" placeholder="${tr('search_placeholder')}" value="${escapeAttr(state.journalSearchQuery)}" oninput="state.journalSearchQuery=this.value; debounceRender();">
        ${resultsHtml}
      </div>
    `;
  }

  const iso = state.journalDate;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [y,mo,d] = iso.split('-').map(Number);
  const label = new Date(y, mo-1, d).toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long' });
  const entries = state.journal
    .filter(e => e.date === iso)
    .sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));

  const totals = {};
  entries.forEach(e => {
    const key = e.category || '_none';
    totals[key] = (totals[key]||0) + entryDurationMinutes(e);
  });
  const totalRows = Object.keys(totals).filter(k => totals[k] > 0).map(key => {
    const cat = key === '_none' ? null : journalCategoryById(key);
    const name = cat ? cat.name : tr('journal_no_category');
    const color = cat ? cat.color : 'var(--ink-soft)';
    return `
      <div class="summary-row">
        <span class="category-dot" style="background:${color}"></span>
        <span class="summary-name">${escapeHtml(name)}</span>
        <span class="summary-duration">${formatDuration(totals[key])}</span>
      </div>
    `;
  }).join('');

  const summary = `
    <div class="journal-summary">
      <div class="photo-section-label">${tr('journal_summary_title')}</div>
      ${totalRows || `<div class="translate-disclaimer">${tr('journal_summary_empty')}</div>`}
    </div>
  `;

  const list = entries.length ? `
    <div class="journal-list">
      ${entries.map(e => {
        const cat = e.category ? journalCategoryById(e.category) : null;
        const duration = entryDurationMinutes(e);
        return `
        <div class="journal-row" onclick='openJournalEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
          <div class="journal-time">${e.startTime || ''}${e.endTime ? '<br>'+e.endTime : ''}</div>
          <div class="journal-track"><div class="journal-dot" style="${cat?`background:${cat.color}`:''}"></div></div>
          <div class="journal-card">
            ${cat ? `<div class="journal-card-cat"><span class="category-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}${duration>0?` · ${formatDuration(duration)}`:''}${e.person ? ` <span class="journal-who-tag">${tr('journal_who_tag', escapeHtml(e.person))}</span>` : ''}</div>` : (duration>0 ? `<div class="journal-card-cat">${formatDuration(duration)}${e.person ? ` <span class="journal-who-tag">${tr('journal_who_tag', escapeHtml(e.person))}</span>` : ''}</div>` : (e.person ? `<div class="journal-card-cat"><span class="journal-who-tag">${tr('journal_who_tag', escapeHtml(e.person))}</span></div>` : ''))}
            ${escapeHtml(e.text)}
          </div>
        </div>
      `;}).join('')}
    </div>
  ` : `
    <div class="empty-state">
      <strong>${tr('journal_empty_title')}</strong>
      ${tr('journal_empty_sub')}
    </div>
  `;

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" onclick="toggleJournalSearch()">${svgIcon('search')}</button>
        <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
      </div>
    </div>
    <div class="content">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="changeJournalDay(-1)">${svgIcon('chevronLeft')}</button>
        <input type="date" class="journal-date-input" value="${iso}" onchange="setJournalDate(this.value)">
        <button class="calendar-nav-btn" onclick="changeJournalDay(1)">${svgIcon('chevronRight')}</button>
      </div>
      <div class="journal-day-label">${label}</div>
      ${summary}
      ${list}
    </div>
    <button class="fab" onclick="openJournalEntry(null)">+</button>
    ${renderBottomNav()}
  `;
}

function renderEditor(){
  const n = state.currentNote;
  if(!n.date) n.date = todayISO();
  const photos = n.photos || [];
  const photoGrid = photos.map(p => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}" onclick="viewPhoto('${p.dataUrl}')">
      <button class="photo-remove" onclick="event.stopPropagation(); deletePhoto('${p.id}')">×</button>
    </div>
  `).join('');

  const langSelectOptions = (selected) => LANGS.map(l => `<option value="${l}" ${l===selected?'selected':''}>${langLabel(l)}</option>`).join('');
  const cached = (n.translations || {})[state.translateTo];
  const showCachedFromOther = cached && cached.from !== state.translateFrom;

  const items = n.items || [];
  const doneCount = items.filter(i => i.checked).length;
  const listHtml = `
    <div class="list-progress">${items.length ? tr('list_progress', doneCount, items.length) : ''}</div>
    <div class="list-items">
      ${items.map(i => `
        <div class="list-item">
          <button class="list-check ${i.checked?'checked':''}" onclick="toggleListItem('${i.id}')">${i.checked ? '✓' : ''}</button>
          <span class="list-item-text ${i.checked?'checked':''}" onclick="toggleListItem('${i.id}')">${escapeHtml(i.text)}</span>
          <button class="row-delete-btn" onclick="deleteListItem('${i.id}')">×</button>
        </div>
      `).join('') || `<div class="translate-disclaimer">${tr('list_empty')}</div>`}
    </div>
    <div class="list-add-row">
      <input type="text" id="listItemInput" class="list-add-input" placeholder="${tr('list_item_placeholder')}" onkeydown="if(event.key==='Enter'){event.preventDefault(); addListItem();}">
      <button class="list-add-btn" onclick="addListItem()">+</button>
    </div>
  `;

  return `
    <div class="editor">
      <div class="editor-bar">
        <button class="icon-btn" onclick="backFromEditor()">${tr('editor_back')}</button>
                <button class="icon-btn delete" onclick="deleteCurrentNote()">${tr('editor_delete')}</button>
      </div>
      <div class="editor-body">
        <input class="editor-title" id="titleInput" placeholder="${tr('editor_title_placeholder')}" value="${escapeAttr(n.title)}" oninput="state.currentNote.title=this.value">
        <input type="date" class="editor-date" id="dateInput" value="${n.date}" onchange="state.currentNote.date=this.value; render();">
        ${n.type === 'list' ? listHtml : `<textarea class="editor-content" id="contentInput" placeholder="${tr('editor_content_placeholder')}" oninput="state.currentNote.content=this.value">${escapeHtml(n.content)}</textarea>`}

        <div class="photo-section">
          <div class="photo-section-label">${tr('photos_label')}</div>
          <div class="photo-grid">
            ${photoGrid}
            <button type="button" class="photo-add-btn" onclick="document.getElementById('photoFileInput').click()">
              ${svgIcon('photo')}
            </button>
          </div>
          <input type="file" id="photoFileInput" accept="image/*" multiple onchange="handlePhotoInput(this)" class="visually-hidden">
        </div>

        ${n.type !== 'list' ? `
        <div class="translate-section">
          <div class="photo-section-label">${tr('translate_section_title')}</div>
          <div class="translate-row">
            <span>${tr('translate_from')}</span>
            <select onchange="setTranslateFrom(this.value)">${langSelectOptions(state.translateFrom)}</select>
            <span class="arrow">→</span>
            <span>${tr('translate_to')}</span>
            <select onchange="setTranslateTo(this.value)">${langSelectOptions(state.translateTo)}</select>
            <button class="translate-btn" ${state.translating || state.translateFrom===state.translateTo ? 'disabled' : ''} onclick="translateNote()">${tr('translate_button')}</button>
          </div>
          ${state.translating ? `<div class="translate-status">${tr('translate_loading')}</div>` : ''}
          ${state.translateErrored ? `<div class="translate-status">${tr('translate_error')}</div>` : ''}
          ${cached && !state.translating ? `
            <div class="translate-result">
              ${cached.title ? `<h4>${escapeHtml(cached.title)}</h4>` : ''}
              <p>${escapeHtml(cached.content)}</p>
              <div class="translate-disclaimer">${tr('translate_disclaimer')}</div>
            </div>
          ` : ''}
        </div>
        ` : ''}
      </div>
      ${renderSaveBar('backFromEditor()')}
    </div>
    ${state.viewingPhoto ? `
      <div class="lightbox" onclick="closeLightbox()">
        <img src="${state.viewingPhoto}">
      </div>
    ` : ''}
  `;
}
