function renderMoodCalendar(){
  if(state.moodSearchActive) return renderMoodSearch();
  const y = state.moodYear, m = state.moodMonth;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const monthLabel = new Date(y, m, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(y, m, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const todayIso = todayISO();

  const weekdayLabels = [0,1,2,3,4,5,6].map(i => {
    const d = new Date(2024, 0, 1 + i);
    return d.toLocaleDateString(locale, { weekday: 'short' }).slice(0,2);
  });

  let cells = '';
  for(let i=0; i<startOffset; i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    const isToday = iso === todayIso;
    const mood = state.moods[iso] ? moodById(state.moods[iso]) : null;
    const hasNote = !!state.moodNotes[iso];
    const intensity = state.moodIntensity[iso] || 2;
    const faceSize = 10 + intensity*3;
    const extras = dayMoodExtras(iso).slice(0,4);
    const extraDots = extras.map(ex => `<div class="calendar-day-dot" style="background:${moodById(ex.moodId).color}"></div>`).join('');
    cells += `
      <button class="calendar-day ${isToday ?'today':''}" onclick="selectMoodDay('${iso}')">
        <span>${d}</span>
        ${mood ? moodFaceSvg(mood.id, faceSize) : ''}
        ${hasNote ? `<div class="mood-note-marker">✎</div>` : ''}
        ${extraDots ? `<div class="calendar-day-dots">${extraDots}</div>` : ''}
      </button>
    `;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }

  const legend = MOODS.map(mo => `
    <div class="mood-legend-item">${moodFaceSvg(mo.id, 16)}${moodLabel(mo.id)}</div>
  `).join('');

  const monthPrefix = `${y}-${String(m+1).padStart(2,'0')}-`;
  const counts = {};
  Object.keys(state.moods).forEach(dateKey => {
    if(dateKey.startsWith(monthPrefix)){
      const id = state.moods[dateKey];
      counts[id] = (counts[id] || 0) + 1;
    }
  });
  const summaryRows = MOODS.filter(mo => counts[mo.id] > 0).map(mo => `
    <div class="summary-row">
      ${moodFaceSvg(mo.id, 16)}
      <span class="summary-name">${moodLabel(mo.id)}</span>
      <span class="summary-duration">${tr('mood_summary_count', counts[mo.id])}</span>
    </div>
  `).join('');
  const summary = `
    <div class="journal-summary">
      <div class="photo-section-label">${tr('mood_summary_title')}</div>
      ${summaryRows || `<div class="translate-disclaimer">${tr('mood_summary_empty')}</div>`}
    </div>
  `;

  const insights = moodPatternInsights();
  const insightLines = [];
  if(insights.hasSleepInsight){
    insightLines.push(tr('mood_patterns_sleep', insights.sleep.positive.avg.toFixed(1), insights.sleep.difficult.avg.toFixed(1)));
  }
  if(insights.hasHydrationInsight){
    insightLines.push(tr('mood_patterns_hydration', insights.hydration.positive.avg.toFixed(1), insights.hydration.difficult.avg.toFixed(1)));
  }
  if(insights.hasBathroomInsight){
    insightLines.push(tr('mood_patterns_bathroom', insights.bathroom.positive.avg.toFixed(1), insights.bathroom.difficult.avg.toFixed(1)));
  }
  if(insights.migraine){
    insightLines.push(tr('mood_patterns_migraine', insights.migraine.difficultPct, insights.migraine.positivePct));
  }
  if(insights.stress){
    insightLines.push(tr('mood_patterns_stress', insights.stress.difficultPct, insights.stress.positivePct));
  }
  if(insights.deprime){
    insightLines.push(tr('mood_patterns_deprime', insights.deprime.difficultPct, insights.deprime.positivePct));
  }
  if(insights.migraineAfterStress){
    insightLines.push(tr('mood_patterns_migraine_after_stress', insights.migraineAfterStress.pct));
  }
  if(insights.period){
    insightLines.push(tr('mood_patterns_period', insights.period.periodPct, insights.period.otherPct));
  }
  const patterns = `
    <div class="journal-summary">
      <div class="photo-section-label">${tr('mood_patterns_title')}</div>
      ${insights.hasAny
        ? `<div class="mood-patterns-list">${insightLines.map(line => `<div class="mood-pattern-row">${escapeHtml(line)}</div>`).join('')}</div>`
        : `<div class="translate-disclaimer">${tr('mood_patterns_empty')}</div>`}
    </div>
  `;

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" onclick="toggleMoodSearch()">${svgIcon('search')}</button>
        <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
      </div>
    </div>
    <div class="content">
      <div class="cal-illustrated">
        <div class="calendar-header">
          <button class="calendar-nav-btn" onclick="changeMoodMonth(-1)">${svgIcon('chevronLeft')}</button>
          <div class="calendar-month-label">${monthLabel}</div>
          <button class="calendar-nav-btn" onclick="changeMoodMonth(1)">${svgIcon('chevronRight')}</button>
        </div>
        <div class="calendar-weekdays">
          ${weekdayLabels.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
        </div>
        <div class="calendar-grid">${cells}</div>
      </div>
      <div class="mood-legend">${legend}</div>
      ${summary}
      ${patterns}
    </div>
    ${renderBottomNav()}
  `;
}

  const quickStartLink = `
    <div class="journal-stats-link journal-quickstart-link" onclick="openJournalQuickStart()">
      <span class="photo-section-label">▶ ${tr('journal_quickstart_link')}</span>
      <span>${svgIcon('chevronRight')}</span>
    </div>
  `;

  const ongoingEntries = state.journal.filter(e => e.date === iso && !e.endTime && !e.noEndTime && !e.unknown);
  const ongoingHtml = ongoingEntries.map(e => {
    const cats = journalEntryCategories(e).map(id => journalCategoryById(id)).filter(Boolean);
    if(cats[0]) ensureJournalCategoryTranslation(cats[0].id);
    const catName = cats[0] ? journalCategoryDisplayName(cats[0]) : '';
    const who = journalEntryWho(e);
    const whoLabel = who === 'together' ? tr('journal_who_together') : (who === 'me' ? tr('journal_who_me') : (e.person || partnerLabel));
    return `
      <div class="journal-stats-link journal-ongoing-link" onclick="switchJournalActivity('${e.id}')">
        <span class="photo-section-label">${tr('journal_switch_activity')} — ${escapeHtml(catName)} · ${escapeHtml(whoLabel)} · ${e.startTime}</span>
        <span>${svgIcon('chevronRight')}</span>
      </div>
    `;
  }).join('');

  const journalMinutePoints = Array.from(new Set(
    entries.flatMap(e => { const r = journalEntryMinuteRange(e); return [r.start, r.end]; })
  )).sort((a,b) => a - b);
  const journalRowSpans = {};
  entries.forEach(e => {
    const r = journalEntryMinuteRange(e);
    const startIdx = journalMinutePoints.indexOf(r.start);
    let endIdx = journalMinutePoints.indexOf(r.end);
    if(endIdx <= startIdx) endIdx = startIdx + 1;
    journalRowSpans[e.id] = { start: startIdx + 1, end: endIdx + 1 };
  });

  function miniCard(e){
    const who = journalEntryWho(e);
    const span = journalRowSpans[e.id] || { start: 1, end: 2 };
    const colStyle = who==='together' ? '' : `grid-column:${who==='me'?'1':'2'};`;
    if(e.unknown){
      return `
        <div class="journal-mini-card unknown ${who==='together'?'together':''}" style="grid-row:${span.start} / ${span.end};${colStyle}" onclick='openJournalEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'></div>
      `;
    }
    ensureJournalEntryTranslation(e.id);
    return `
      <div class="journal-mini-card ${who==='together'?'together':''}" style="grid-row:${span.start} / ${span.end};${colStyle}" onclick='openJournalEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
        <div class="journal-mini-time">${e.startTime || ''}${e.endTime ? ' - '+e.endTime : ''}</div>
        ${journalCatBlock(e, 'mini')}
        <div class="journal-mini-text">${escapeHtml(journalEntryDisplayText(e))}</div>
      </div>
    `;
  }

  let list;
  if(!entries.length){
    list = `
      <div class="empty-state">
        <strong>${tr('journal_empty_title')}</strong>
        ${tr('journal_empty_sub')}
      </div>
    `;
  }else if(filter === 'all'){
    list = `
      <div class="journal-two-col-header">
        <div class="journal-two-col-header-label">${tr('journal_col_me')}</div>
        <div class="journal-two-col-header-label">${escapeHtml(partnerLabel)}</div>
      </div>
      <div class="journal-two-col">
        ${entries.map(miniCard).join('')}
      </div>
    `;
  }else{
    const filtered = entries.filter(e => journalEntryWho(e) === filter);
    list = filtered.length ? `
      <div class="journal-list">
        ${filtered.map(e => {
          ensureJournalEntryTranslation(e.id);
          const cats = journalEntryCategories(e).map(id => journalCategoryById(id)).filter(Boolean);
          return `
          <div class="journal-row ${e.unknown?'unknown':''}" onclick='openJournalEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
            <div class="journal-time">${e.startTime || ''}${e.endTime ? '<br>'+e.endTime : ''}</div>
            <div class="journal-track"><div class="journal-dot" style="${e.unknown ? 'background:var(--journal-unknown)' : (cats[0]?`background:${cats[0].color}`:'')}"></div></div>
            <div class="journal-card">
              ${e.unknown ? `<div class="translate-disclaimer">${tr('journal_unknown_label')}</div>` : `
                ${journalCatBlock(e, 'row')}
                ${escapeHtml(journalEntryDisplayText(e))}
              `}
            </div>
          </div>
        `;}).join('')}
      </div>
    ` : `
      <div class="empty-state">
        <strong>${tr('journal_empty_title')}</strong>
        ${tr('journal_empty_sub')}
      </div>
    `;
  }

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" onclick="toggleJournalSearch()">${svgIcon('search')}</button>
        <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
      </div>
    </div>
    <div class="content">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="changeJournalDay(-1)">${svgIcon('chevronLeft')}</button>
        <input type="date" class="journal-date-input" value="${iso}" onchange="setJournalDate(this.value)">
        <button class="calendar-nav-btn" onclick="changeJournalDay(1)">${svgIcon('chevronRight')}</button>
      </div>
      <div class="journal-day-label">${label}</div>
      ${ongoingHtml}
      ${quickStartLink}
      ${statsLink}
      ${filterTabs}
      ${list}
    </div>
    <button class="fab" onclick="openJournalEntry(null)">+</button>
    ${renderBottomNav()}
  `;
}

function setJournalFilter(filter){
  state.journalFilter = filter;
  render();
}

function openJournalStats(){
  state.screen = 'journalStats';
  render();
}

function backFromJournalStats(){
  state.screen = 'journal';
  render();
}

function openJournalQuickStart(){
  state.journalQuickStartPerson = '';
  state.screen = 'journalQuickStart';
  render();
}

async function switchJournalActivity(entryId){
  const idx = state.journal.findIndex(x => x.id === entryId);
  if(idx < 0) return;
  const entry = state.journal[idx];
  entry.endTime = nowHHMM();
  state.journal[idx] = entry;
  await storageSet('journal', state.journal);
  triggerAutoSync();
  state.journalQuickStartPerson = entry.person || '';
  state.screen = 'journalQuickStart';
  render();
  showToast(tr('journal_switch_ended_toast', entry.endTime));
}

function setJournalQuickStartPerson(person){
  state.journalQuickStartPerson = person;
  render();
}

function promptJournalQuickStartOtherPerson(){
  const current = state.journalQuickStartPerson || '';
  const name = window.prompt(tr('journal_who_other_placeholder'), current);
  if(name === null) return;
  state.journalQuickStartPerson = name.trim();
  render();
}

function backFromJournalQuickStart(){
  state.screen = 'journal';
  render();
}

async function startJournalActivity(catId){
  const entry = {
    id: 'j' + Date.now(),
    date: state.journalDate,
    startTime: nowHHMM(),
    endTime: '',
    category: catId,
    categories: [catId],
    text: '',
    person: state.journalQuickStartPerson || '',
  };
  state.journal.push(entry);
  await storageSet('journal', state.journal);
  triggerAutoSync();
  state.screen = 'journal';
  render();
  showToast(tr('journal_quickstart_started'));
}

function renderJournalStats(){
  const iso = state.journalDate;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [y,mo,d] = iso.split('-').map(Number);
  const label = new Date(y, mo-1, d).toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long' });
  const entries = state.journal.filter(e => e.date === iso);

  const totalsByPerson = { me: 0, other: 0, together: 0 };
  entries.forEach(e => { totalsByPerson[journalEntryWho(e)] += entryDurationMinutes(e); });

  function categoryTotalsFor(filterWho){
    const totals = {};
    entries.filter(e => journalEntryWho(e) === filterWho).forEach(e => {
      const cats = journalEntryCategories(e);
      const keys = cats.length ? cats : ['_none'];
      keys.forEach(key => { totals[key] = (totals[key]||0) + entryDurationMinutes(e); });
    });
    return Object.keys(totals).filter(k => totals[k] > 0).map(key => {
      const cat = key === '_none' ? null : journalCategoryById(key);
      if(cat) ensureJournalCategoryTranslation(cat.id);
      const name = cat ? journalCategoryDisplayName(cat) : tr('journal_no_category');
      const color = cat ? cat.color : 'var(--ink-soft)';
      return `
        <div class="summary-row">
          <span class="category-dot" style="background:${color}"></span>
          <span class="summary-name">${escapeHtml(name)}</span>
          <span class="summary-duration">${formatDuration(totals[key])}</span>
        </div>
      `;
    }).join('');
  }

  const partnerLabel = (state.relationInfo && state.relationInfo.partnerName) ? state.relationInfo.partnerName : tr('journal_col_other');

  const meRows = categoryTotalsFor('me');
  const togetherRows = categoryTotalsFor('together');
  const otherRows = categoryTotalsFor('other');

  const personRows = `
    <div class="journal-stats-row">
      <span class="journal-stats-name">${tr('journal_stats_me')}</span>
      <span class="journal-stats-duration">${formatDuration(totalsByPerson.me)}</span>
    </div>
    <div class="journal-stats-row">
      <span class="journal-stats-name">${tr('journal_stats_together')}</span>
      <span class="journal-stats-duration">${formatDuration(totalsByPerson.together)}</span>
    </div>
    <div class="journal-stats-row">
      <span class="journal-stats-name">${tr('journal_stats_other')} ${escapeHtml(partnerLabel)}</span>
      <span class="journal-stats-duration">${formatDuration(totalsByPerson.other)}</span>
    </div>
  `;

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="icon-btn" onclick="backFromJournalStats()">${tr('cat_back')}</button>
        <h1>${tr('journal_stats_title')}</h1>
      </div>
    </div>
    <div class="content">
      <div class="journal-day-label">${label}</div>
      ${entries.length ? `
        <div class="journal-summary">
          <div class="photo-section-label">${tr('journal_who_label')}</div>
          ${personRows}
        </div>
        <div class="journal-summary">
          <div class="photo-section-label">${tr('journal_summary_title')} — ${tr('journal_stats_me')}</div>
          ${meRows || `<div class="translate-disclaimer">${tr('journal_summary_empty')}</div>`}
        </div>
        <div class="journal-summary">
          <div class="photo-section-label">${tr('journal_summary_title')} — ${tr('journal_stats_together')}</div>
          ${togetherRows || `<div class="translate-disclaimer">${tr('journal_summary_empty')}</div>`}
        </div>
        <div class="journal-summary">
          <div class="photo-section-label">${tr('journal_summary_title')} — ${tr('journal_stats_other')} ${escapeHtml(partnerLabel)}</div>
          ${otherRows || `<div class="translate-disclaimer">${tr('journal_summary_empty')}</div>`}
        </div>
      ` : `<div class="translate-disclaimer">${tr('journal_stats_empty')}</div>`}
    </div>
  `;
}

const NOTE_HIGHLIGHT_HEX_FALLBACK = {
  terracotta: '#E3B48C', sable: '#E8DFC8', sauge: '#C9D4B5', rose: '#D9A8AE', ciel: '#B8CDD9',
};

let _savedNoteSelectionRange = null;

function toggleNoteHighlightPicker(){
  const row = document.getElementById('noteHlRow');
  const el = document.getElementById('contentInput');
  if(!row || !el) return;
  const opening = row.hidden;
  if(opening){
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0 && el.contains(sel.anchorNode)){
      _savedNoteSelectionRange = sel.getRangeAt(0).cloneRange();
    }
    row.hidden = false;
  }else{
    row.hidden = true;
  }
}

function applyNoteHighlightColor(colorKey){
  const el = document.getElementById('contentInput');
  const row = document.getElementById('noteHlRow');
  if(!el) return;
  el.focus();
  const sel = window.getSelection();
  if(_savedNoteSelectionRange){
    sel.removeAllRanges();
    sel.addRange(_savedNoteSelectionRange);
  }
  if(sel && sel.rangeCount > 0 && !sel.isCollapsed){
    const range = sel.getRangeAt(0);
    try{
      const span = document.createElement('span');
      span.className = 'hl hl-' + colorKey;
      range.surroundContents(span);
      sel.removeAllRanges();
    }catch(e){
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('backColor', false, NOTE_HIGHLIGHT_HEX_FALLBACK[colorKey] || '#E3B48C');
    }
  }
  onNoteContentInput();
  if(row) row.hidden = true;
}

function cancelNoteLockPrompt(){
  const pending = state.pendingNoteLock;
  state.pendingNoteLock = null;
  state.noteLockEntry = '';

  state.noteLockError = false;
  state.screen = (pending && (pending.mode === 'setup' || pending.mode === 'remove')) ? 'editor' : 'home';
  render();
}

function noteLockKeyPress(digit){
  if(state.noteLockEntry.length >= 4) return;
  state.noteLockEntry += digit;
  state.noteLockError = false;
  render();
  if(state.noteLockEntry.length === 4){
    setTimeout(handleNoteLockPinComplete, 150);
  }
}

function noteLockKeyDelete(){
  state.noteLockEntry = state.noteLockEntry.slice(0, -1);
  render();
}

function handleNoteLockPinComplete(){
  const pending = state.pendingNoteLock;
  if(!pending) return;
  if(pending.mode === 'setup'){
    if(state.noteLockStage === 'enter'){
      state.noteLockFirst = state.noteLockEntry;
      state.noteLockEntry = '';
      state.noteLockStage = 'confirm';
      render();
    }else{
      if(state.noteLockEntry === state.noteLockFirst){
        const n = (state.currentNote && state.currentNote.id === pending.id) ? state.currentNote : state.notes.find(x => x.id === pending.id);
        if(n){
          n.locked = true;
          n.lockHash = simpleHash(state.noteLockEntry);
          state.unlockedNoteIds.add(n.id);
        }
        state.pendingNoteLock = null;
        state.noteLockEntry = '';
        state.noteLockFirst = '';
        state.noteLockStage = 'enter';
        state.screen = pending.target;
        render();
      }else{
        state.noteLockError = true;
        state.noteLockEntry = '';
        state.noteLockStage = 'enter';
        state.noteLockFirst = '';
        render();
      }
    }
  }else if(pending.mode === 'remove'){
    const n = (state.currentNote && state.currentNote.id === pending.id) ? state.currentNote : state.notes.find(x => x.id === pending.id);
    if(n && simpleHash(state.noteLockEntry) === n.lockHash){
      n.locked = false;
      n.lockHash = null;
      state.unlockedNoteIds.add(n.id);
      state.pendingNoteLock = null;
      state.noteLockEntry = '';
      state.screen = pending.target;
      render();
    }else{
      state.noteLockError = true;
      state.noteLockEntry = '';
      render();
      setTimeout(()=>{ state.noteLockError = false; render(); }, 600);
    }
  }else{
    const n = state.notes.find(x => x.id === pending.id);
    if(n && simpleHash(state.noteLockEntry) === n.lockHash){
      state.unlockedNoteIds.add(n.id);
      state.pendingNoteLock = null;
      state.noteLockEntry = '';
      if(pending.target === 'view'){
        state.viewingNoteId = n.id;
        state.screen = 'noteView';
        render();
      }else{
        openNote(n);
      }
    }else{
      state.noteLockError = true;
      state.noteLockEntry = '';
      render();
      setTimeout(()=>{ state.noteLockError = false; render(); }, 600);
    }
  }
}

function renderNoteLockPrompt(){
  const pending = state.pendingNoteLock;

  const title = isSetup

  const sub = isSetup ? tr('notes_lock_setup_sub') : isRemove ? tr('notes_lock_remove_sub') : tr('notes_lock_unlock_sub');
  const dots = [0,1,2,3].map(i => {
    let cls = 'pin-dot';
    if(state.noteLockError) cls += ' error';
    else if(i < state.noteLockEntry.length) cls += ' filled';
    return `<div class="${cls}"></div>`;

  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];

    return `<button class="key" onclick="noteLockKeyPress('${k}')">${k}</button>`;
  }).join('');
  return `

      <div class="keypad">${keypad}</div>
    </div>
  `;
}

function noteOriginalLang(n){
  return n.originalLang || 'fr';

async function translateHtmlPreservingTags(html, from, to){
  if(!html) return '';
  const container = document.createElement('div');
  container.innerHTML = html;
  const textNodes = [];
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node;
  while((node = walker.nextNode())){
    const parent = node.parentElement;
    if(parent && parent.classList && parent.classList.contains('inline-chk')) continue;
    if(node.nodeValue && node.nodeValue.trim()) textNodes.push(node);
  }
  const translations = await Promise.all(textNodes.map(t => myMemoryTranslate(t.nodeValue, from, to)));
  textNodes.forEach((t, i) => { t.nodeValue = translations[i]; });
  return container.innerHTML;
}

async function ensureNoteAutoTranslation(id){
  if(state.lang !== 'en') return;
  const n = state.notes.find(x => x.id === id);
  if(!n) return;
  if(noteOriginalLang(n) !== 'fr') return;
  if(n.translatedEn && n.translatedEn.sourceUpdated === n.updated) return;
  if(state.notesTranslating.has(id)) return;
  state.notesTranslating.add(id);
  try{
    const [title, content, items] = await Promise.all([
      myMemoryTranslate(n.title, 'fr', 'en'),
      n.richText ? translateHtmlPreservingTags(n.content, 'fr', 'en') : myMemoryTranslate(n.content || '', 'fr', 'en'),
      Promise.all((n.items||[]).map(i => myMemoryTranslate(i.text, 'fr', 'en'))),
    ]);
    n.translatedEn = { title, content, items, contentIsHtml: !!n.richText, sourceUpdated: n.updated };
    await storageSet('notes', state.notes);
  }catch(e){
    console.error('note auto-translate error', e);
  }
  state.notesTranslating.delete(id);
  render();
}

function noteHasFreshTranslation(n){
  return state.lang === 'en' && noteOriginalLang(n) === 'fr' && n.translatedEn && n.translatedEn.sourceUpdated === n.updated;
}

function noteViewText(n, field){
  if(noteHasFreshTranslation(n)) return n.translatedEn[field] || '';
  return n[field] || '';
}

function noteViewItemText(n, idx, fallback){
  if(noteHasFreshTranslation(n) && n.translatedEn.items && n.translatedEn.items[idx] !== undefined){
    return n.translatedEn.items[idx];
  }
  return fallback;
}

    const plain = n.translatedEn.content || '';
    return `<div class="note-view-content">${escapeHtml(plain)}</div>`;

  if(n.richText){
    return `<div class="note-view-content rich">${n.content || ''}</div>`;

  return `<div class="note-view-content">${escapeHtml(n.content || '')}</div>`;

function scallopQuarterBezier(cx, cy, r, a0deg, stepDeg){
  const kappa = 0.5522847498;
  const dir = stepDeg > 0 ? 1 : -1;
  const a0 = a0deg * Math.PI / 180;
  const a1 = (a0deg + stepDeg) * Math.PI / 180;
  const k = kappa * dir * r;
  const p1x = cx + r*Math.cos(a1), p1y = cy + r*Math.sin(a1);
  const t0x = -Math.sin(a0)*k, t0y = Math.cos(a0)*k;
  const t1x = -Math.sin(a1)*k, t1y = Math.cos(a1)*k;
  const c1x = cx + r*Math.cos(a0) + t0x, c1y = cy + r*Math.sin(a0) + t0y;
  const c2x = p1x - t1x, c2y = p1y - t1y;
  return `C ${c1x} ${c1y} ${c2x} ${c2y} ${p1x} ${p1y} `;
}

function buildScallopPath(w, h, R, r0){
  function calc(avail){
    const L = avail - 4*R;
    if(L <= 0) return { n: 0, r: R };
    const n = Math.max(1, Math.round(L / (2*r0)));
    const r = L / (2*n);
    return { n, r };
  }
  const top = calc(w);
  const bottom = calc(w);
  const left = calc(h);
  const right = calc(h);
  const r2 = R / Math.SQRT2; // radius for the corner bumps that pass through the true corner point

  let d = `M ${R} 0 `;
  // top: opening transition (corner point -> first valley), regular petals, closing transition
  d += scallopQuarterBezier(2*R, 0, R, 180, -90);
  let x = 2*R;
  for(let i=0;i<top.n;i++){
    const r = top.r;
    const cx = x + r, cy = R;
    d += scallopQuarterBezier(cx, cy, r, 180, 90);
    d += scallopQuarterBezier(cx, cy, r, 270, 90);
    x += 2*r;
  }
  d += scallopQuarterBezier(w-2*R, 0, R, 90, -90);
  // top-right corner: continuous bump through (w,0), no inward notch
  d += scallopQuarterBezier(w-R/2, R/2, r2, 225, 90);
  d += scallopQuarterBezier(w-R/2, R/2, r2, 315, 90);

  // right: opening transition, regular petals, closing transition
  d += scallopQuarterBezier(w, 2*R, R, 270, -90);
  let y = 2*R;
  for(let i=0;i<right.n;i++){
    const r = right.r;
    const cx = w-R, cy = y + r;
    d += scallopQuarterBezier(cx, cy, r, 270, 90);
    d += scallopQuarterBezier(cx, cy, r, 0, 90);
    y += 2*r;
  }
  d += scallopQuarterBezier(w, h-2*R, R, 180, -90);
  // bottom-right corner: continuous bump through (w,h)
  d += scallopQuarterBezier(w-R/2, h-R/2, r2, 315, 90);
  d += scallopQuarterBezier(w-R/2, h-R/2, r2, 45, 90);

  // bottom: opening transition, regular petals, closing transition
  d += scallopQuarterBezier(w-2*R, h, R, 0, -90);
  x = w - 2*R;
  for(let i=0;i<bottom.n;i++){
    const r = bottom.r;
    const cx = x - r, cy = h-R;
    d += scallopQuarterBezier(cx, cy, r, 0, 90);
    d += scallopQuarterBezier(cx, cy, r, 90, 90);
    x -= 2*r;
  }
  d += scallopQuarterBezier(2*R, h, R, 270, -90);
  // bottom-left corner: continuous bump through (0,h)
  d += scallopQuarterBezier(R/2, h-R/2, r2, 45, 90);
  d += scallopQuarterBezier(R/2, h-R/2, r2, 135, 90);

  // left: opening transition, regular petals, closing transition
  d += scallopQuarterBezier(0, h-2*R, R, 90, -90);
  y = h - 2*R;
  for(let i=0;i<left.n;i++){
    const r = left.r;
    const cx = R, cy = y - r;
    d += scallopQuarterBezier(cx, cy, r, 90, 90);
    d += scallopQuarterBezier(cx, cy, r, 180, 90);
    y -= 2*r;
  }
  d += scallopQuarterBezier(0, 2*R, R, 0, -90);
  // top-left corner: continuous bump through (0,0), closes back to M
  d += scallopQuarterBezier(R/2, R/2, r2, 135, 90);
  d += scallopQuarterBezier(R/2, R/2, r2, 225, 90);

  d += 'Z';
  return d;
}

function updateMoodNoteScallop(){
  const svgs = document.querySelectorAll('.mood-note-scallop-svg');
  svgs.forEach(svg => {
    const wrap = svg.closest('.mood-note-wrap');
    if(!wrap) return;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    if(!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const d = buildScallopPath(w, h, 11, 11);
    const path = svg.querySelector('.mood-note-scallop-path');
    if(path) path.setAttribute('d', d);
    const clipPathEl = svg.querySelector('.mood-note-scallop-clip');
    if(clipPathEl) clipPathEl.setAttribute('d', d);
    wrap.style.clipPath = `url(#moodNoteScallopClip)`;
    wrap.style.webkitClipPath = `url(#moodNoteScallopClip)`;
  });
}

function backFromNoteLinkPicker(){
  state.noteLinkPickerItemId = null;
  state.screen = 'editor';
  render();
}

function addNoteLink(id){
  if(!state.currentNote) return;
  if(state.noteLinkPickerItemId){
    const item = (state.currentNote.items || []).find(i => i.id === state.noteLinkPickerItemId);
    if(item) item.linkedNoteId = id;
    state.noteLinkPickerItemId = null;
    state.screen = 'editor';
    render();
    return;
  }
  if(!state.currentNote.links) state.currentNote.links = [];
  if(!state.currentNote.links.includes(id)){
    state.currentNote.links.push(id);
  }
  state.screen = 'editor';
  render();
}

function removeNoteLink(id){
  if(!state.currentNote || !state.currentNote.links) return;
  state.currentNote.links = state.currentNote.links.filter(x => x !== id);
  render();
}

function renderNoteLinkPicker(){
  const q = state.noteLinkPickerQuery.trim().toLowerCase();
  const currentId = state.currentNote ? state.currentNote.id : null;
  const itemMode = !!state.noteLinkPickerItemId;
  const linkedItem = itemMode ? (state.currentNote.items || []).find(i => i.id === state.noteLinkPickerItemId) : null;
  const linkedIds = itemMode
    ? (linkedItem && linkedItem.linkedNoteId ? [linkedItem.linkedNoteId] : [])
    : (state.currentNote ? (state.currentNote.links || []) : []);
  const candidates = state.notes
    .filter(n => n.id !== currentId && !n.archived && !noteIsLocked(n))
    .filter(n => !q || (n.title||'').toLowerCase().includes(q))
    .sort(compareNotes);
  return `
    <div class="top-bar">
      <button class="icon-btn" onclick="backFromNoteLinkPicker()">${tr('editor_back')}</button>
    </div>
    <div class="content">
      <h2 class="day-view-title">${tr('notes_link_picker_title')}</h2>
      <input type="text" class="search-input" placeholder="${tr('search_placeholder')}" value="${escapeAttr(state.noteLinkPickerQuery)}" oninput="state.noteLinkPickerQuery=this.value; render();">
      ${candidates.length ? candidates.map(n => `
        <div class="budget-row" onclick="addNoteLink('${n.id}')">
          <div class="budget-row-desc">
            <div>${n.title ? escapeHtml(n.title) : tr('untitled')}</div>
          </div>
          ${linkedIds.includes(n.id) ? `<span class="postit-cat-tag">${svgIcon('link')}</span>` : ''}
        </div>
      `).join('') : `<div class="empty-state"><strong>${tr('notes_link_picker_empty')}</strong></div>`}
    </div>
  `;
}

// Nettoyage : retire le service worker précédemment installé (et son cache),
// car son enregistrement semblait empêcher Brave de proposer à nouveau
// "Ajouter à l'écran d'accueil" sur cet appareil.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  }).catch(() => {});
}
if(window.caches){
  caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
}
