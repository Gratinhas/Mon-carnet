<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carnet</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper: #EFEAE0;
    --paper-raised: #F7F3EA;
    --ink: #2B2A28;
    --ink-soft: #6B655C;
    --line: #DAD2C2;
    --teal: #3F6259;
    --teal-deep: #2C4842;
    --amber: #C97B3D;
    --danger: #A2503B;
    --radius: 14px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Avenir Next", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  h1, h2, h3{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  /* ---------- LOCK SCREEN ---------- */
  .lock-screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 28px;
  }
  .lock-mark{
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--teal);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-mark svg{ width: 26px; height: 26px; }
  .lock-title{ font-size: 1.5rem; text-align:center; }
  .lock-sub{ color: var(--ink-soft); font-size: 0.9rem; text-align:center; margin-top: -16px; max-width: 280px; line-height:1.5; }
  .pin-dots{ display:flex; gap: 16px; margin: 4px 0; }
  .pin-dot{
    width: 14px; height:14px; border-radius:50%;
    border: 1.5px solid var(--ink-soft);
    background: transparent;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .pin-dot.filled{ background: var(--teal); border-color: var(--teal); transform: scale(1.1); }
  .pin-dot.error{ background: var(--danger); border-color: var(--danger); }
  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 14px;
    justify-content: center;
  }
  .key{
    width:64px; height:64px; border-radius:50%;
    border: none;
    background: var(--paper-raised);
    box-shadow: 0 1px 0 rgba(0,0,0,.06);
    font-size: 1.3rem;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .key:active{ background: var(--line); }
  .key.ghost{ background: transparent; box-shadow:none; color: var(--ink-soft); font-size: 0.95rem; }
  .lock-error{ color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  .lock-lang-switch{ display:flex; gap: 8px; margin-top: 4px; }
  .lock-lang-switch button{
    background: var(--paper-raised); border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 20px; padding: 5px 12px; font-size: 0.75rem;
  }
  .lock-lang-switch button.active{ background: var(--teal); color: white; border-color: var(--teal); }

  /* ---------- HEADER ---------- */
  .top-bar{
    padding: 20px 20px 14px;
    display:flex; align-items:baseline; justify-content: space-between;
  }
  .top-bar h1{ font-size: 1.6rem; }
  .top-bar .count{ color: var(--ink-soft); font-size: 0.85rem; }
  .top-bar-right{ display:flex; align-items:center; gap: 12px; }
  .settings-btn{
    background:none; border:none; color: var(--ink-soft); padding: 4px; display:flex;
  }
  .settings-btn svg{ width: 20px; height: 20px; }
  .settings-section{ padding-top: 8px; margin-bottom: 26px; }
  .settings-title{ font-family: Georgia, serif; font-size: 1.05rem; margin-bottom: 8px; }
  .settings-desc{ color: var(--ink-soft); font-size: 0.85rem; line-height: 1.55; margin: 0 0 16px; }
  .settings-btn-full{
    width: 100%; display:flex; align-items:center; gap: 10px; justify-content:center;
    background: var(--teal); color: white; border:none; border-radius: var(--radius);
    padding: 13px; font-size: 0.92rem; margin-bottom: 10px;
  }
  .settings-btn-full svg{ width: 18px; height: 18px; }
  .settings-btn-full.secondary{ background: var(--paper-raised); color: var(--teal-deep); border: 1px solid var(--line); }
  .cloud-field-label{ display:block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 6px; }
  .cloud-client-input{
    width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-raised);
    color: var(--ink); padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px;
  }
  .cloud-status{ color: var(--teal-deep); font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }
  .cloud-sync-time{ color: var(--ink-soft); font-size: 0.78rem; margin-bottom: 12px; }
  .lang-options{ display:flex; gap: 8px; flex-wrap: wrap; }
  .lang-option{
    flex: 1; min-width: 90px;
    background: var(--paper-raised); border: 1.5px solid var(--line); color: var(--ink);
    border-radius: var(--radius); padding: 12px 8px; font-size: 0.88rem;
  }
  .lang-option.active{ border-color: var(--teal); background: #E3EFEC; color: var(--teal-deep); font-weight: 600; }

  /* ---------- CONTENT ---------- */
  .content{
    flex:1;
    overflow-y: auto;
    padding: 0 16px 100px;
  }
  .empty-state{
    margin-top: 60px;
    text-align:center;
    color: var(--ink-soft);
    padding: 0 30px;
    line-height: 1.6;
  }
  .empty-state strong{ display:block; color: var(--ink); font-size: 1.1rem; margin-bottom: 6px; font-family: Georgia, serif; }

  .note-card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .note-card h3{ font-size: 1.05rem; margin-bottom: 4px; }
  .note-card p{
    margin:0; color: var(--ink-soft); font-size: 0.88rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.4;
  }
  .note-card .meta{ margin-top: 8px; font-size: 0.72rem; color: var(--ink-soft); }

  .fab{
    position: absolute;
    right: 20px; bottom: 92px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    color: white;
    font-size: 1.8rem;
    line-height: 0;
    box-shadow: 0 4px 14px rgba(44,72,66,.35);
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ background: var(--teal-deep); }

  /* ---------- NOTE EDITOR ---------- */
  .editor{
    flex:1; display:flex; flex-direction:column;
  }
  .editor-bar{
    display:flex; align-items:center; justify-content: space-between;
    padding: 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .icon-btn{
    background:none; border:none; color: var(--teal-deep);
    font-size: 0.95rem; padding: 8px 10px; display:flex; align-items:center; gap:4px;
  }
  .icon-btn.delete{ color: var(--danger); }
  .editor-body{ flex:1; display:flex; flex-direction:column; padding: 10px 20px 30px; overflow-y:auto; }
  .editor-title{
    border:none; background:transparent; outline:none;
    font-family: Georgia, serif; font-size: 1.4rem; font-weight: 600;
    color: var(--ink); padding: 8px 0; margin-bottom: 4px;
  }
  .editor-content{
    border:none; background:transparent; outline:none; resize:none;
    font-family: -apple-system, sans-serif; font-size: 1rem; color: var(--ink);
    line-height: 1.6; flex:1; padding: 8px 0; min-height: 140px;
  }
  .editor-title::placeholder, .editor-content::placeholder{ color: var(--ink-soft); }
  .editor-date{
    border:none; background:transparent; outline:none;
    font-family: -apple-system, sans-serif; font-size: 0.85rem; color: var(--ink-soft);
    padding: 2px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); width: fit-content;
  }
  .photo-section{ margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .photo-section-label{ font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 10px; }
  .photo-grid{ display:flex; flex-wrap:wrap; gap: 10px; }
  .photo-thumb{ position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; }
  .photo-thumb img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-remove{
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(43,42,40,.65); color: white; border: none;
    font-size: 0.85rem; line-height: 0; display:flex; align-items:center; justify-content:center;
  }
  .photo-add-btn{
    width: 84px; height: 84px; border-radius: 10px;
    border: 1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft); cursor: pointer;
  }
  .photo-add-btn svg{ width: 24px; height: 24px; }
  .note-photos{ display:flex; gap: 6px; margin-top: 10px; align-items:center; }
  .note-photos img{ width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
  .note-photos-more{ font-size: 0.75rem; color: var(--ink-soft); }
  .lightbox{
    position: fixed; inset: 0; background: rgba(20,19,17,.92);
    display:flex; align-items:center; justify-content:center; padding: 24px; z-index: 50;
  }
  .lightbox img{ max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox video{ max-width: 100%; max-height: 100%; border-radius: 8px; }
  .video-section{ margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .video-list{ display:flex; flex-direction:column; gap: 8px; margin-bottom: 10px; }
  .video-item{
    display:flex; align-items:center; gap: 10px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px;
  }
  .video-play{
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0;
    background: var(--teal); color:white; border:none; display:flex; align-items:center; justify-content:center;
  }
  .video-play svg{ width: 16px; height: 16px; }
  .video-info{ flex:1; min-width:0; }
  .video-name{ font-size: 0.85rem; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .video-size{ font-size: 0.72rem; color: var(--ink-soft); }
  .video-add-btn{
    display:flex; align-items:center; gap: 8px; justify-content:center;
    width: 100%; border: 1.5px dashed var(--line); border-radius: var(--radius);
    background: transparent; color: var(--ink-soft); padding: 12px; font-size: 0.88rem;
  }
  .video-add-btn svg{ width: 18px; height: 18px; }

  /* ---------- CALENDAR ---------- */
  .calendar-header{ display:flex; align-items:center; justify-content:space-between; padding: 10px 4px 18px; }
  .calendar-month-label{ font-family: Georgia, serif; font-size: 1.15rem; text-transform: capitalize; }
  .calendar-nav-btn{ background: var(--paper-raised); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .calendar-nav-btn svg{ width: 16px; height: 16px; }
  .calendar-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .calendar-weekday{ text-align:center; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-day{
    aspect-ratio: 1; border-radius: 10px; border: none; background: transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 3px;
    font-size: 0.9rem; color: var(--ink); position: relative;
  }
  .calendar-day.other-month{ color: var(--line); }
  .calendar-day.today{ background: var(--teal); color: white; font-weight: 600; }
  .calendar-day-dot{ width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
  .calendar-day-dots{ display:flex; gap: 3px; }
  .calendar-day.today .calendar-day-dot{ box-shadow: 0 0 0 1px white; }
  .calendar-day.has-couple{ background: rgba(122,31,53,0.16); border: 1.5px solid #7A1F35; color: #7A1F35; font-weight: 600; }
  .category-picker{ display:flex; flex-wrap:wrap; gap: 8px; padding: 10px 0 16px; }
  .category-chip{
    display:flex; align-items:center; gap: 6px;
    background: var(--paper-raised); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 7px 12px 7px 8px; font-size: 0.82rem; color: var(--ink-soft);
  }
  .category-chip .category-dot{ width: 10px; height: 10px; border-radius: 50%; background: var(--chip-color); }
  .category-chip.active{ border-color: var(--chip-color); color: var(--ink); background: white; font-weight: 600; }
  .event-title{ display:flex; align-items:center; gap: 8px; font-size: 0.95rem; }
  .event-title .category-dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .day-view-title{ font-size: 1.15rem; text-transform: capitalize; margin-bottom: 16px; }
  .event-item{
    display:flex; gap: 12px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .event-time{ font-size: 0.78rem; color: var(--teal-deep); font-weight: 600; min-width: 44px; padding-top: 2px; }
  .event-title{ font-size: 0.95rem; }
  .event-notes{ font-size: 0.82rem; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
  .event-time-row{ display:flex; align-items:center; flex-wrap:wrap; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px; font-size: 0.88rem; color: var(--ink-soft); }
  .event-time-row input{ border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--paper-raised); color: var(--ink); }

  /* ---------- JOURNAL ---------- */
  .journal-date-input{
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper-raised);
    color: var(--ink); padding: 6px 10px; font-size: 0.88rem;
  }
  .journal-day-label{ text-align:center; font-size: 0.82rem; color: var(--ink-soft); text-transform: capitalize; margin-bottom: 18px; }
  .journal-list{ display:flex; flex-direction:column; }
  .journal-row{ display:flex; gap: 10px; cursor:pointer; }
  .journal-time{ width: 46px; flex-shrink:0; font-size: 0.78rem; font-weight: 600; color: var(--teal-deep); padding-top: 10px; text-align:right; }
  .journal-track{ width: 2px; background: var(--line); align-self: stretch; position: relative; flex-shrink:0; }
  .journal-dot{ position:absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 9px; height:9px; border-radius:50%; background: var(--teal); border: 2px solid var(--paper); }
  .journal-card{
    flex:1; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; margin: 4px 0 14px; font-size: 0.9rem; line-height: 1.5;
  }
  .journal-card-cat{ display:flex; align-items:center; gap: 6px; font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 4px; }
  .category-chip.new-category{ border-style: dashed; color: var(--ink-soft); }
  .category-chip-wrap{ position: relative; display:inline-flex; }
  .category-chip-x{
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--danger); color: white; border: 2px solid var(--paper); font-size: 0.65rem;
    line-height: 0; display:flex; align-items:center; justify-content:center;
  }
  .journal-summary{ background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; }
  .summary-row{ display:flex; align-items:center; gap: 8px; padding: 5px 0; font-size: 0.85rem; }
  .summary-name{ flex:1; }
  .summary-duration{ font-weight: 600; color: var(--teal-deep); }
  .settings-category-row{ display:flex; align-items:center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .settings-category-row .category-dot{ width: 12px; height: 12px; border-radius: 50%; flex-shrink:0; }
  .settings-category-row span.name{ flex:1; font-size: 0.9rem; }
  .settings-category-row button{ background:none; border:none; color: var(--danger); font-size: 0.8rem; }
  .visually-hidden{
    position: absolute; width: 1px; height: 1px; padding:0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- TRANSLATION ---------- */
  .translate-section{ margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .translate-row{ display:flex; align-items:center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .translate-row select{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font-size: 0.82rem; color: var(--ink);
  }
  .translate-row .arrow{ color: var(--ink-soft); }
  .translate-btn{
    background: var(--teal); color: white; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 0.82rem; margin-left: auto;
  }
  .translate-btn[disabled]{ opacity: 0.6; }
  .translate-status{ font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 8px; }
  .translate-result{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-top: 4px;
  }
  .translate-result h4{ font-family: Georgia, serif; font-size: 1rem; margin-bottom: 6px; }
  .translate-result p{ margin: 0; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
  .translate-disclaimer{ font-size: 0.7rem; color: var(--ink-soft); margin-top: 8px; }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position: sticky; bottom:0;
    display:flex;
    background: var(--paper-raised);
    border-top: 1px solid var(--line);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .nav-item{
    flex: 0 0 auto; min-width: 70px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color: var(--ink-soft); font-size: 0.66rem; padding: 6px 4px;
  }
  .nav-item.active{ color: var(--teal-deep); }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item .soon{ font-size: 0.58rem; opacity: .75; }

  .toast{
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 20px;
    font-size: 0.82rem; opacity: 0; pointer-events:none; transition: opacity .25s; max-width: 85%; text-align:center;
    z-index: 60;
  }
  .toast.show{ opacity: 0.95; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById('app');

const STRINGS = {

async function storageGet(key){
  try{
    const raw = window.localStorage.getItem('carnet:' + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage error', e); return null; }
}
async function storageSet(key, value){
  try{ window.localStorage.setItem('carnet:' + key, JSON.stringify(value)); }catch(e){ console.error('storage error', e); }
}

/* ---------- VIDEO STORAGE (IndexedDB — videos are too large for localStorage) ---------- */
const VIDEO_DB_NAME = 'carnet-media';
const VIDEO_STORE = 'videos';
let videoDbPromise = null;
function openVideoDB(){
  if(videoDbPromise) return videoDbPromise;
  videoDbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(VIDEO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(VIDEO_STORE)) db.createObjectStore(VIDEO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return videoDbPromise;
}
async function videoPut(id, blob){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function videoGet(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readonly');
    const req = tx.objectStore(VIDEO_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function videoDelete(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function formatFileSize(bytes){
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' Ko';
  return (bytes/(1024*1024)).toFixed(1) + ' Mo';
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

let toastTimer = null;
function showToast(msg){
  render();
  requestAnimationFrame(()=>{
    const t = document.querySelector('.toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 1800);
  });
}

async function init(){
  const savedPin = await storageGet('pin_hash');
  const savedNotes = await storageGet('notes');
  const savedLang = await storageGet('lang');
  const savedEvents = await storageGet('events');
  const savedJournal = await storageGet('journal');
  const savedJournalCategories = await storageGet('journalCategories');
  const savedLastCategory = await storageGet('lastJournalCategory');
  state.lastJournalCategory = savedLastCategory || null;
  state.googleClientId = (await storageGet('googleClientId')) || '';
  state.lastDriveSync = (await storageGet('lastDriveSync')) || null;
  state.notes = savedNotes || [];
  state.events = savedEvents || [];
  state.journal = (savedJournal || []).map(e => e.startTime !== undefined ? e : {
    ...e, startTime: e.time || '', endTime: e.time || '', category: e.category || null,
  });
  state.journalCategories = savedJournalCategories || [];
  const today = new Date();
  state.calendarYear = today.getFullYear();
  state.calendarMonth = today.getMonth();
  state.journalDate = todayISO();
  state.lang = LANGS.includes(savedLang) ? savedLang : (LANGS.includes(navigator.language?.slice(0,2)) ? navigator.language.slice(0,2) : 'fr');
  state.screen = savedPin ? 'unlock' : 'setpin';
  state.savedPinHash = savedPin;
  document.title = tr('appTitle');
  document.documentElement.lang = state.lang;
  render();
}

async function setLang(lang){
  state.lang = lang;
  document.title = tr('appTitle');
  document.documentElement.lang = lang;
  await storageSet('lang', lang);
  render();
}

function onKeyPress(digit){
  if(state.pinEntry.length >= 4) return;
  state.pinEntry += digit;
  state.pinError = false;
  render();
  if(state.pinEntry.length === 4){
    setTimeout(handlePinComplete, 150);
  }
}
function onKeyDelete(){
  state.pinEntry = state.pinEntry.slice(0, -1);
  render();
}

async function handlePinComplete(){
  if(state.screen === 'setpin'){
    if(state.pinStage === 'enter'){
      state.firstPin = state.pinEntry;
      state.pinEntry = '';
      state.pinStage = 'confirm';
      render();
    } else {
      if(state.pinEntry === state.firstPin){
        const hash = simpleHash(state.pinEntry);
        await storageSet('pin_hash', hash);
        state.savedPinHash = hash;
        state.screen = 'home';
        state.pinEntry = '';
        render();
      } else {
        state.pinError = true;
        state.pinEntry = '';
        state.pinStage = 'enter';
        state.firstPin = '';
        render();
      }
    }
  } else if(state.screen === 'unlock'){
    const hash = simpleHash(state.pinEntry);
    if(hash === state.savedPinHash){
      state.screen = 'home';
      state.pinEntry = '';
      render();
    } else {
      state.pinError = true;
      state.pinEntry = '';
      render();
      setTimeout(()=>{ state.pinError = false; render(); }, 600);
    }
  }
}

function openNote(note){
  state.currentNote = note
    ? {...note, photos: note.photos ? [...note.photos] : [], videos: note.videos ? [...note.videos] : [], translations: note.translations ? {...note.translations} : {}}
    : { id: 'n' + Date.now(), title: '', content: '', date: todayISO(), updated: Date.now(), photos: [], videos: [], translations: {} };
  state.screen = 'editor';
  render();
}

function todayISO(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function formatNoteDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const locale = state.lang === 'en' ? 'en-GB' : state.lang === 'hu' ? 'hu-HU' : 'fr-FR';
  return date.toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
}

async function saveCurrentNote(){
  const n = state.currentNote;
  if(!n.title.trim() && !n.content.trim() && (!n.photos || !n.photos.length) && (!n.videos || !n.videos.length)){
    return;
  }
  n.updated = Date.now();
  const idx = state.notes.findIndex(x => x.id === n.id);
  if(idx >= 0) state.notes[idx] = n;
  else state.notes.unshift(n);
  await storageSet('notes', state.notes);
  triggerAutoSync();
}

async function deleteCurrentNote(){
  const videos = state.currentNote.videos || [];
  for(const v of videos){
    try{ await videoDelete(v.id); }catch(e){ console.error('video delete error', e); }
  }
  state.notes = state.notes.filter(x => x.id !== state.currentNote.id);
  await storageSet('notes', state.notes);
  triggerAutoSync();

function formatDate(ts){
  const d = new Date(ts);
  const locale = state.lang === 'en' ? 'en-GB' : state.lang === 'hu' ? 'hu-HU' : 'fr-FR';
  return d.toLocaleDateString(locale, { day:'numeric', month:'short' }) + ' · ' + d.toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit' });
}

function fileToCompressedDataUrl(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else{ width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image invalide'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.readAsDataURL(file);
  });
}

function nowHHMM(){

  const pad = n => String(n).padStart(2,'0');

}

function entryDurationMinutes(e){
  if(!e.startTime || !e.endTime) return 0;
  const [sh,sm] = e.startTime.split(':').map(Number);
  const [eh,em] = e.endTime.split(':').map(Number);
  if(isNaN(sh) || isNaN(eh)) return 0;
  let start = sh*60+sm, end = eh*60+em;
  if(end < start) end += 24*60;
  return end - start;
}

function formatDuration(totalMinutes){
  if(totalMinutes <= 0) return '0min';
  const h = Math.floor(totalMinutes/60);
  const m = totalMinutes % 60;
  if(h === 0) return `${m}min`;
  if(m === 0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}

/* ---------- GOOGLE DRIVE BACKUP ---------- */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_BACKUP_FILENAME = 'carnet-sauvegarde.json';
let googleTokenClient = null;
let googleAccessToken = null;
let driveFileId = null;

function triggerAutoSync(){
  if(!state.googleConnected) return;
  driveUploadBackup();
}

async function setGoogleClientId(value){
  state.googleClientId = value.trim();
  googleTokenClient = null;
  await storageSet('googleClientId', state.googleClientId);
}

function ensureGoogleTokenClient(){
  if(!state.googleClientId) return null;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if(googleTokenClient) return googleTokenClient;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.googleClientId,
    scope: DRIVE_SCOPE,
    callback: () => {},
  });
  return googleTokenClient;
}

function requestGoogleToken(){
  return new Promise((resolve, reject)=>{
    const client = ensureGoogleTokenClient();
    if(!client){ reject(new Error('google-not-ready')); return; }
    client.callback = (resp) => {
      if(resp.error){ reject(resp); return; }
      googleAccessToken = resp.access_token;
      resolve(resp.access_token);
    };
    client.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
  });
}

async function connectGoogleDrive(){
  if(!state.googleClientId){ showToast(tr('cloud_missing_client_id')); return; }
  try{
    await requestGoogleToken();
    state.googleConnected = true;
    render();
    showToast(tr('toast_drive_connected'));
    driveUploadBackup();
  }catch(e){
    console.error('google connect error', e);
    showToast(tr('toast_drive_backup_failed'));
  }
}

async function driveFindBackupFile(token){
  const q = encodeURIComponent(`name='${DRIVE_BACKUP_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if(!res.ok) throw new Error('drive-list-failed');
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

function buildBackupPayload(){
  return {
    app: 'carnet', version: 1, exportedAt: new Date().toISOString(),
    pin_hash: state.savedPinHash || null,
    notes: state.notes, events: state.events,
    journal: state.journal, journalCategories: state.journalCategories,
  };
}

async function driveUploadBackup(){
  if(!state.googleConnected && !state.googleClientId) return;
  try{
    const token = googleAccessToken || await requestGoogleToken();
    const content = JSON.stringify(buildBackupPayload());
    if(!driveFileId){
      const existing = await driveFindBackupFile(token);
      if(existing) driveFileId = existing.id;
    }
    const boundary = 'carnetboundary';
    const metadata = { name: DRIVE_BACKUP_FILENAME, mimeType: 'application/json' };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${driveFileId ? '{}' : JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const url = driveFileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: driveFileId ? 'PATCH' : 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body,
    });
    if(!res.ok) throw new Error('drive-upload-failed');
    const data = await res.json();
    driveFileId = data.id;
    state.googleConnected = true;
    state.lastDriveSync = Date.now();
    await storageSet('lastDriveSync', state.lastDriveSync);
    showToast(tr('toast_drive_backup_ok'));
    if(state.screen === 'settings') render();
  }catch(e){
    console.error('drive upload error', e);
    showToast(tr('toast_drive_backup_failed'));
  }
}

async function driveRestoreBackup(){
  if(!state.googleClientId){ showToast(tr('cloud_missing_client_id')); return; }
  try{
    const token = googleAccessToken || await requestGoogleToken();
    const existing = await driveFindBackupFile(token);
    if(!existing){ showToast(tr('toast_drive_no_backup')); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!res.ok) throw new Error('drive-download-failed');
    const data = await res.json();
    const ok = window.confirm(tr('confirm_import', state.notes.length, (data.notes||[]).length));
    if(!ok) return;
    state.notes = data.notes || [];
    state.events = data.events || [];
    state.journal = data.journal || [];
    state.journalCategories = data.journalCategories || [];
    await storageSet('notes', state.notes);
    await storageSet('events', state.events);
    await storageSet('journal', state.journal);
    await storageSet('journalCategories', state.journalCategories);
    if(data.pin_hash){ state.savedPinHash = data.pin_hash; await storageSet('pin_hash', data.pin_hash); }
    driveFileId = existing.id;
    state.googleConnected = true;
    render();
    showToast(tr('toast_backup_imported'));
  }catch(e){
    console.error('drive restore error', e);
    showToast(tr('toast_drive_backup_failed'));
  }
}

/* ---------- TRANSLATION ---------- */
const LANG_CODE_MAP = { fr: 'fr', en: 'en', hu: 'hu' };

async function googleTranslateChunk(text, from, to){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${LANG_CODE_MAP[from]}&tl=${LANG_CODE_MAP[to]}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  const segments = data && data[0] ? data[0] : [];
  const translated = segments.map(seg => seg[0]).join('');
  if(!translated) throw new Error('empty');
  return translated;
}

async function myMemoryChunkFallback(text, from, to){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${LANG_CODE_MAP[from]}|${LANG_CODE_MAP[to]}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  // Prefer a genuine machine-translation match over noisy community translation-memory entries
  let best = data && data.responseData && data.responseData.translatedText;
  if(Array.isArray(data && data.matches)){
    const mt = data.matches.find(m => m.translation && /mt!?/i.test((m['created-by'] || m['last-updated-by'] || '')));
    if(mt) best = mt.translation;
  }
  if(!best) throw new Error('empty');
  return best;
}

async function translateChunk(text, from, to){
  try{
    return await googleTranslateChunk(text, from, to);
  }catch(e){
    console.warn('Google Translate unavailable, falling back to MyMemory', e);
    return await myMemoryChunkFallback(text, from, to);
  }
}

async function myMemoryTranslate(text, from, to){
  if(!text || !text.trim()) return '';
  const chunks = text.match(/[\s\S]{1,1800}(?=\n|$)/g) || [text];
  const results = [];
  for(const chunk of chunks){
    results.push(await translateChunk(chunk, from, to));
  }
  return results.join(' ');
}

function renderCalendar(){
  const y = state.calendarYear, m = state.calendarMonth;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const monthLabel = new Date(y, m, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(y, m, 1);
  let startOffset = firstOfMonth.getDay() - 1; // make Monday = 0
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const todayIso = todayISO();

  const categoriesByDate = {};
  state.events.forEach(e => {
    if(!categoriesByDate[e.date]) categoriesByDate[e.date] = new Set();
    categoriesByDate[e.date].add(e.category || 'rdv');
  });

  const weekdayLabels = [0,1,2,3,4,5,6].map(i => {
    const d = new Date(2024, 0, 1 + i); // a known Monday
    return d.toLocaleDateString(locale, { weekday: 'short' }).slice(0,2);
  });

  let cells = '';
  for(let i=0; i<startOffset; i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    const isToday = iso === todayIso;
    const cats = categoriesByDate[iso] ? [...categoriesByDate[iso]].slice(0,3) : [];
    const hasCouple = (categoriesByDate[iso] || new Set()).has('couple');
    const dots = cats.map(c => `<div class="calendar-day-dot" style="background:${categoryColor(c)}"></div>`).join('');
    cells += `
      <button class="calendar-day ${isToday?'today':''} ${hasCouple ? 'has-couple':''}" onclick="selectDay('${iso}')">
        <span>${d}</span>
        ${dots ? `<div class="calendar-day-dots">${dots}</div>` : ''}
      </button>
    `;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }

  return `
    <div class="top-bar">
      <h1>${tr('nav_calendar')}</h1>
      <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
    </div>
    <div class="content">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="changeMonth(-1)">${svgIcon('chevronLeft')}</button>
        <div class="calendar-month-label">${monthLabel}</div>
        <button class="calendar-nav-btn" onclick="changeMonth(1)">${svgIcon('chevronRight')}</button>
      </div>
      <div class="calendar-weekdays">
        ${weekdayLabels.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
      </div>
      <div class="calendar-grid">${cells}</div>
    </div>
    ${renderBottomNav()}
  `;
}

function renderDayView(){
  const iso = state.selectedDate;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [y,mo,d] = iso.split('-').map(Number);
  const label = new Date(y, mo-1, d).toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const dayEvents = state.events
    .filter(e => e.date === iso)
    .sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));

  const list = dayEvents.length ? dayEvents.map(e => `
    <div class="event-item" onclick='openEvent(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
      <div class="event-time">${e.time ? e.time : tr('event_no_time')}</div>
      <div class="event-body">
        <div class="event-title"><span class="category-dot" style="background:${categoryColor(e.category)}"></span>${escapeHtml(e.title)}</div>
        ${e.notes ? `<div class="event-notes">${escapeHtml(e.notes)}</div>` : ''}
      </div>
    </div>
  `).join('') : `
    <div class="empty-state">
      <strong>${tr('event_empty_day')}</strong>
    </div>
  `;

  return `
    <div class="top-bar">
      <button class="icon-btn" onclick="backFromDay()">${tr('event_back')}</button>
    </div>
    <div class="content">
      <h2 class="day-view-title">${label}</h2>
      ${list}
    </div>
    <button class="fab" onclick="openEvent(null)">+</button>
  `;
}

function renderJournal(){
  const iso = state.journalDate;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [y,mo,d] = iso.split('-').map(Number);
  const label = new Date(y, mo-1, d).toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long' });
  const entries = state.journal
    .filter(e => e.date === iso)
    .sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));

  const totals = {};
  entries.forEach(e => {
    const key = e.category || '_none';
    totals[key] = (totals[key]||0) + entryDurationMinutes(e);
  });
  const totalRows = Object.keys(totals).filter(k => totals[k] > 0).map(key => {
    const cat = key === '_none' ? null : journalCategoryById(key);
    const name = cat ? cat.name : tr('journal_no_category');
    const color = cat ? cat.color : 'var(--ink-soft)';
    return `
      <div class="summary-row">
        <span class="category-dot" style="background:${color}"></span>
        <span class="summary-name">${escapeHtml(name)}</span>
        <span class="summary-duration">${formatDuration(totals[key])}</span>
      </div>
    `;
  }).join('');

  const summary = `
    <div class="journal-summary">
      <div class="photo-section-label">${tr('journal_summary_title')}</div>
      ${totalRows || `<div class="translate-disclaimer">${tr('journal_summary_empty')}</div>`}
    </div>
  `;

  const list = entries.length ? `
    <div class="journal-list">
      ${entries.map(e => {
        const cat = e.category ? journalCategoryById(e.category) : null;
        const duration = entryDurationMinutes(e);
        return `
        <div class="journal-row" onclick='openJournalEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
          <div class="journal-time">${e.startTime || ''}${e.endTime ? '<br>'+e.endTime : ''}</div>
          <div class="journal-track"><div class="journal-dot" style="${cat?`background:${cat.color}`:''}"></div></div>
          <div class="journal-card">
            ${cat ? `<div class="journal-card-cat"><span class="category-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}${duration>0?` · ${formatDuration(duration)}`:''}</div>` : (duration>0 ? `<div class="journal-card-cat">${formatDuration(duration)}</div>` : '')}
            ${escapeHtml(e.text)}
          </div>
        </div>
      `;}).join('')}
    </div>
  ` : `
    <div class="empty-state">
      <strong>${tr('journal_empty_title')}</strong>
      ${tr('journal_empty_sub')}
    </div>
  `;

  return `
    <div class="top-bar">
      <h1>${tr('nav_journal')}</h1>
      <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
    </div>
    <div class="content">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="changeJournalDay(-1)">${svgIcon('chevronLeft')}</button>
        <input type="date" class="journal-date-input" value="${iso}" onchange="setJournalDate(this.value)">
        <button class="calendar-nav-btn" onclick="changeJournalDay(1)">${svgIcon('chevronRight')}</button>
      </div>
      <div class="journal-day-label">${label}</div>
      ${summary}
      ${list}
    </div>
    <button class="fab" onclick="openJournalEntry(null)">+</button>
    ${renderBottomNav()}
  `;
}

function renderEditor(){
  const n = state.currentNote;
  if(!n.date) n.date = todayISO();
  const photos = n.photos || [];
  const photoGrid = photos.map(p => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}" onclick="viewPhoto('${p.dataUrl}')">
      <button class="photo-remove" onclick="event.stopPropagation(); deletePhoto('${p.id}')">×</button>
    </div>
  `).join('');

  const langSelectOptions = (selected) => LANGS.map(l => `<option value="${l}" ${l===selected?'selected':''}>${langLabel(l)}</option>`).join('');
  const cached = (n.translations || {})[state.translateTo];
  const videos = n.videos || [];
  const videoList = videos.map(v => `
    <div class="video-item">
      <button class="video-play" onclick="playVideo('${v.id}')">${svgIcon('video')}</button>
      <div class="video-info">
        <div class="video-name">${escapeHtml(v.name || '')}</div>
        <div class="video-size">${formatFileSize(v.size || 0)}</div>
      </div>
      <button class="photo-remove" onclick="deleteVideo('${v.id}')">×</button>
    </div>
  `).join('');
  const showCachedFromOther = cached && cached.from !== state.translateFrom;

  return `
    <div class="editor">
      <div class="editor-bar">
        <button class="icon-btn" onclick="backFromEditor()">${tr('editor_back')}</button>
        <button class="icon-btn delete" onclick="deleteCurrentNote()">${tr('editor_delete')}</button>
      </div>
      <div class="editor-body">
        <input class="editor-title" id="titleInput" placeholder="${tr('editor_title_placeholder')}" value="${escapeAttr(n.title)}" oninput="state.currentNote.title=this.value">
        <input type="date" class="editor-date" id="dateInput" value="${n.date}" onchange="state.currentNote.date=this.value; render();">
        <textarea class="editor-content" id="contentInput" placeholder="${tr('editor_content_placeholder')}" oninput="state.currentNote.content=this.value">${escapeHtml(n.content)}</textarea>

        <div class="photo-section">
          <div class="photo-section-label">${tr('photos_label')}</div>
          <div class="photo-grid">
            ${photoGrid}
            <button type="button" class="photo-add-btn" onclick="document.getElementById('photoFileInput').click()">
              ${svgIcon('photo')}
            </button>
          </div>
          <input type="file" id="photoFileInput" accept="image/*" multiple onchange="handlePhotoInput(this)" class="visually-hidden">
        </div>

        <div class="video-section">
          <div class="photo-section-label">${tr('videos_label')}</div>
          <div class="video-list">
            ${videoList}
          </div>
          <button type="button" class="video-add-btn" onclick="document.getElementById('videoFileInput').click()">
            ${svgIcon('video')} ${tr('videos_label')}
          </button>
          <input type="file" id="videoFileInput" accept="video/*" multiple onchange="handleVideoInput(this)" class="visually-hidden">
          <div class="translate-disclaimer">${tr('videos_backup_note')}</div>
        </div>

        <div class="translate-section">
          <div class="photo-section-label">${tr('translate_section_title')}</div>
          <div class="translate-row">
            <span>${tr('translate_from')}</span>
            <select onchange="setTranslateFrom(this.value)">${langSelectOptions(state.translateFrom)}</select>
            <span class="arrow">→</span>
            <span>${tr('translate_to')}</span>
            <select onchange="setTranslateTo(this.value)">${langSelectOptions(state.translateTo)}</select>
            <button class="translate-btn" ${state.translating || state.translateFrom===state.translateTo ? 'disabled' : ''} onclick="translateNote()">${tr('translate_button')}</button>
          </div>
          ${state.translating ? `<div class="translate-status">${tr('translate_loading')}</div>` : ''}
          ${state.translateErrored ? `<div class="translate-status">${tr('translate_error')}</div>` : ''}
          ${cached && !state.translating ? `
            <div class="translate-result">
              ${cached.title ? `<h4>${escapeHtml(cached.title)}</h4>` : ''}
              <p>${escapeHtml(cached.content)}</p>
              <div class="translate-disclaimer">${tr('translate_disclaimer')}</div>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
    ${state.viewingPhoto ? `
      <div class="lightbox" onclick="closeLightbox()">
        <img src="${state.viewingPhoto}">
      </div>
    ` : ''}
    ${state.viewingVideoUrl ? `
      <div class="lightbox" onclick="closeVideoPlayer()">
        <video src="${state.viewingVideoUrl}" controls autoplay playsinline onclick="event.stopPropagation()"></video>
      </div>
    ` : ''}
  `;
}

function renderBottomNav(){
  const items = [
    { id:'notes', label:tr('nav_notes'), icon:'notes' },
    { id:'calendar', label:tr('nav_calendar'), icon:'calendar' },
    { id:'journal', label:tr('nav_journal'), icon:'clock' },
    { id:'recipes', label:tr('nav_recipes'), icon:'recipe', soon:true },
    { id:'passwords', label:tr('nav_passwords'), icon:'key', soon:true },
  ];
  return `
    <div class="bottom-nav">
      ${items.map(it => `
        <button class="nav-item ${state.tab===it.id?'active':''}" onclick="switchTab('${it.id}')">
          ${svgIcon(it.icon)}
          <span>${it.label}</span>
          ${it.soon ? `<span class="soon">${tr('nav_soon')}</span>` : ''}
        </button>
      `).join('')}
    </div>
  `;
}

function switchTab(id){
  state.tab = id;
  if(id === 'notes') state.screen = 'home';
  else if(id === 'calendar') state.screen = 'calendar';
  else if(id === 'journal') state.screen = 'journal';
  else state.screen = 'soon';
  state.soonLabel = { recipes:tr('nav_recipes'), passwords:tr('nav_passwords') }[id];
  render();
}

function openNoteById(id){
  const n = state.notes.find(x => x.id === id);
  openNote(n);
}

function render(){
  let html = '';
  if(state.screen === 'loading') html = '';
  else if(state.screen === 'setpin' || state.screen === 'unlock') html = renderPinScreen();
  else if(state.screen === 'home') html = renderHome();
  else if(state.screen === 'settings') html = renderSettings();
  else if(state.screen === 'calendar') html = renderCalendar();
  else if(state.screen === 'day') html = renderDayView();
  else if(state.screen === 'eventEditor') html = renderEventEditor();
  else if(state.screen === 'journal') html = renderJournal();
  else if(state.screen === 'journalEntry') html = renderJournalEntryEditor();
  else if(state.screen === 'soon') html = renderSoon(state.soonLabel || '');
  else if(state.screen === 'editor') html = renderEditor();

  app.innerHTML = html + '<div class="toast"></div>';

  if(state.screen === 'editor'){
    const c = document.getElementById('contentInput');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }
  if(state.screen === 'journalEntry'){
    const j = document.getElementById('journalTextInput');
    if(j){ j.focus(); j.setSelectionRange(j.value.length, j.value.length); }
  }
}
