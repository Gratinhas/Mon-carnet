<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carnet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F7D8C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper: #EFEAE0;
    --paper-raised: #F7F3EA;
    --ink: #2B2A28;
    --ink-soft: #6B655C;
    --line: #DAD2C2;
    --teal: #3F6259;
    --teal-deep: #2C4842;
    --amber: #C97B3D;
    --danger: #A2503B;
    --radius: 14px;
    font-size: 16px;
  }
  :root.dark{
    --paper: #1E1B17;
    --paper-raised: #262220;
    --ink: #EDE6DA;
    --ink-soft: #A79E90;
    --line: #3A342E;
    --teal: #4FA391;
    --teal-deep: #7BCBB8;
    --amber: #E0954F;
    --danger: #E2776A;
  }
  html.dark, html.dark body{ background: var(--paper); }
  html.dark .lightbox{ background: rgba(0,0,0,.92); }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Avenir Next", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  h1, h2, h3{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  /* ---------- LOCK SCREEN ---------- */
  .lock-screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 28px;
  }
  .lock-mark{
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--teal);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-mark svg{ width: 26px; height: 26px; }
  .lock-title{ font-size: 1.5rem; text-align:center; }
  .lock-sub{ color: var(--ink-soft); font-size: 0.9rem; text-align:center; margin-top: -16px; max-width: 280px; line-height:1.5; }
  .pin-dots{ display:flex; gap: 16px; margin: 4px 0; }
  .pin-dot{
    width: 14px; height:14px; border-radius:50%;
    border: 1.5px solid var(--ink-soft);
    background: transparent;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .pin-dot.filled{ background: var(--teal); border-color: var(--teal); transform: scale(1.1); }
  .pin-dot.error{ background: var(--danger); border-color: var(--danger); }
  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 14px;
    justify-content: center;
  }
  .key{
    width:64px; height:64px; border-radius:50%;
    border: none;
    background: var(--paper-raised);
    box-shadow: 0 1px 0 rgba(0,0,0,.06);
    font-size: 1.3rem;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .key:active{ background: var(--line); }
  .key.ghost{ background: transparent; box-shadow:none; color: var(--ink-soft); font-size: 0.95rem; }
  .lock-error{ color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  .lock-lang-switch{ display:flex; gap: 8px; margin-top: 4px; }
  .emergency-access-btn{
    background: none; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 20px; padding: 9px 18px; font-size: 0.82rem; font-weight: 600;
    max-width: 280px; width: 100%;
  }
  .emergency-card{
    width: 100%; max-width: 340px; display:flex; flex-direction:column; gap: 10px; margin: 10px 0 20px;
  }
  .emergency-row{
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--danger);
    border-radius: 10px; padding: 10px 14px;
  }
  .emergency-label{ font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .emergency-value{ font-size: 1rem; margin-top: 2px; }
  .passphrase-input{
    width: 100%; max-width: 280px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper-raised); color: var(--ink); padding: 13px 14px; font-size: 1rem;
  }
  .passphrase-toggle{ background:none; border:none; color: var(--teal-deep); font-size: 0.85rem; margin-top: -8px; }
  .lock-lang-switch button{
    background: var(--paper-raised); border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 20px; padding: 5px 12px; font-size: 0.75rem;
  }
  .lock-lang-switch button.active{ background: var(--teal); color: white; border-color: var(--teal); }

  /* ---------- HEADER ---------- */
  .top-bar{
    padding: 20px 20px 14px;
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
  }
  .top-bar h1{ font-size: 1.6rem; }
  .top-bar .count{ color: var(--ink-soft); font-size: 0.85rem; }
  .top-bar-right{ display:flex; align-items:center; gap: 12px; flex-shrink:0; }
  .top-bar-left{ display:flex; align-items:center; gap: 8px; flex:1; min-width:0; }
  .top-bar-left h1{ font-size: 1.4rem; }
  .top-bar-left .icon-btn{ padding: 4px 4px 4px 0; }

  /* ---------- CATEGORY HOME (GRID) ---------- */
  .home-info-card{
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    color: white;
    text-align:center;
  }
  .home-date{ font-family: Georgia, serif; font-size: 1.05rem; text-transform: capitalize; margin-bottom: 4px; }
  .home-time{ font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
  .relation-location-live{ display:flex; align-items:center; justify-content:center; gap: 8px; flex-wrap:wrap; font-weight: 600; margin: 4px 0; }
  .home-weather{ display:flex; align-items:center; justify-content:center; gap: 10px; }
  .home-weather-icon{ font-size: 1.8rem; }
  .home-weather-temp{ font-size: 1.6rem; font-weight: 700; }
  .home-weather-label{ font-size: 0.9rem; opacity: 0.9; }
  .home-weather-loading{ font-size: 0.85rem; opacity: 0.85; }
  .home-weather-retry{
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white;
    border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; margin: 3px;
  }
  .home-location-setup{ display:flex; flex-direction:column; gap: 8px; margin-top: 6px; }
  .home-location-setup input{ background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: white; }
  .home-location-setup input::placeholder{ color: rgba(255,255,255,0.7); }
  .welcome-slide{
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(160deg, var(--teal), var(--teal-deep));
    color: white; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 32px; gap: 6px; cursor: pointer;
    animation: welcomeFadeIn 1.1s ease;
  }
  .welcome-slide.welcome-fade-out{
    animation: welcomeFadeOut 0.6s ease forwards;
  }
  @keyframes welcomeFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes welcomeFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .welcome-greeting{ font-family: Georgia, serif; font-size: 1.6rem; margin-bottom: 6px; }
  .welcome-date{ font-size: 1.05rem; text-transform: capitalize; opacity: 0.95; }
  .welcome-time{ font-size: 2.4rem; font-weight: 700; margin: 6px 0; }
  .welcome-weather{ font-size: 1.15rem; margin-bottom: 10px; }
  .welcome-message{ font-family: Georgia, serif; font-style: italic; font-size: 1.05rem; margin-top: 14px; max-width: 320px; }
  .welcome-tap-hint{ font-size: 0.75rem; opacity: 0.75; position: absolute; bottom: 36px; }
  .welcome-section-title{ font-family: Georgia, serif; font-size: 1.15rem; margin-bottom: 12px; }
  .welcome-list{ display:flex; flex-direction:column; gap: 8px; max-width: 320px; width:100%; }
  .welcome-list-item{
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px; padding: 10px 14px; font-size: 0.9rem;
  }
  .welcome-list-empty{ font-size: 0.85rem; opacity: 0.85; }
  .profile-banner{
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--teal);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
    display:flex; flex-direction:column; gap: 10px;
  }
  .profile-banner-text{ font-size: 0.82rem; color: var(--ink-soft); line-height:1.5; }
  .profile-banner-actions{ display:flex; align-items:center; justify-content:space-between; gap: 10px; }
  .profile-banner-btn{
    background: var(--teal); color: white; border: none; border-radius: 20px;
    padding: 7px 16px; font-size: 0.8rem; font-weight: 600;
  }
  .profile-banner-close{ background:none; border:none; color: var(--ink-soft); font-size: 1.1rem; padding: 4px 8px; }
  .search-input{
    width: 100%; border: 1px solid var(--line); border-radius: 20px; background: var(--paper-raised);
    color: var(--ink); padding: 10px 16px; font-size: 0.88rem; margin-bottom: 14px;
  }
  .pwd-row-secret{
    display:flex; align-items:center; gap: 8px; margin-top: 6px; font-family: monospace; font-size: 0.85rem;
  }
  .pwd-row-secret .icon-btn{ padding: 2px; width: 24px; height: 24px; }
  .pwd-row-secret svg{ width: 16px; height: 16px; }
  .category-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .category-tile{
    aspect-ratio: 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 12px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .category-tile svg{ width: 38px; height: 38px; color: var(--teal-deep); }
  .category-tile span{ font-family: Georgia, serif; font-size: 0.98rem; color: var(--ink); text-align:center; padding: 0 10px; }

  .category-card{
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .category-header{
    width: 100%; display:flex; align-items:center; justify-content:space-between;
    background: none; border: none; padding: 18px 18px; text-align:left;
    font-family: Georgia, serif; font-size: 1.1rem; color: var(--ink);
  }
  .category-chevron{ width: 18px; height: 18px; color: var(--ink-soft); display:flex; transition: transform .2s; }
  .category-chevron svg{ width: 100%; height: 100%; }
  .category-chevron.open{ transform: rotate(90deg); }
  .subcategory-list{}
  .subcategory-item{
    width: 100%; display:flex; align-items:center; justify-content:space-between;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 16px 18px; text-align:left; font-size: 0.95rem; color: var(--ink);
  }
  .subcategory-item:last-child{ border-bottom: none; }
  .subcategory-item .soon{ font-size: 0.68rem; color: var(--ink-soft); background: var(--paper); border-radius: 10px; padding: 2px 8px; }
  .life-card{
    width:100%; display:flex; align-items:center; gap: 14px;
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 4px solid var(--life-color, var(--teal));
    border-radius: var(--radius); padding: 16px 16px; margin-bottom: 12px; text-align:left;
  }
  .life-card-icon{
    width: 42px; height: 42px; border-radius: 50%; flex-shrink:0;
    background: color-mix(in srgb, var(--life-color, var(--teal)) 18%, transparent);
    color: var(--life-color, var(--teal));
    display:flex; align-items:center; justify-content:center;
  }
  .life-card-icon svg{ width: 20px; height: 20px; }
  .life-card-text{ flex:1; min-width:0; }
  .life-card-title{ font-family: Georgia, serif; font-size: 1.05rem; color: var(--ink); margin-bottom: 3px; }
  .life-card-preview{ font-size: 0.78rem; color: var(--ink-soft); }
  .life-card > svg{ width:18px; height:18px; color: var(--ink-soft); flex-shrink:0; }
  .settings-btn{
    background:none; border:none; color: var(--ink-soft); padding: 4px; display:flex;
  }
  .settings-btn svg{ width: 20px; height: 20px; }
  .settings-section{ padding-top: 8px; margin-bottom: 26px; }
  .settings-title{ font-family: Georgia, serif; font-size: 1.05rem; margin-bottom: 8px; }
  .settings-desc{ color: var(--ink-soft); font-size: 0.85rem; line-height: 1.55; margin: 0 0 16px; }
  .settings-btn-full{
    width: 100%; display:flex; align-items:center; gap: 10px; justify-content:center;
    background: var(--teal); color: white; border:none; border-radius: var(--radius);
    padding: 13px; font-size: 0.92rem; margin-bottom: 10px;
  }
  .settings-btn-full svg{ width: 18px; height: 18px; }
  .settings-btn-full.secondary{ background: var(--paper-raised); color: var(--teal-deep); border: 1px solid var(--line); }
  .cloud-field-label{ display:block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 6px; }
  .cloud-client-input{
    width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-raised);
    color: var(--ink); padding: 10px 12px; font-size: 0.85rem; margin-bottom: 12px;
  }
  .cloud-status{ color: var(--teal-deep); font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }
  .cloud-sync-time{ color: var(--ink-soft); font-size: 0.78rem; margin-bottom: 12px; }
  .lang-options{ display:flex; gap: 8px; flex-wrap: wrap; }
  .lang-option{
    flex: 1; min-width: 90px;
    background: var(--paper-raised); border: 1.5px solid var(--line); color: var(--ink);
    border-radius: var(--radius); padding: 12px 8px; font-size: 0.88rem;
  }
  .lang-option.active{ border-color: var(--teal); background: #E3EFEC; color: var(--teal-deep); font-weight: 600; }

  /* ---------- CONTENT ---------- */
  .content{
    flex:1;
    overflow-y: auto;
    padding: 0 16px 100px;
  }
  .empty-state{
    margin-top: 60px;
    text-align:center;
    color: var(--ink-soft);
    padding: 0 30px;
    line-height: 1.6;
  }
  .empty-state strong{ display:block; color: var(--ink); font-size: 1.1rem; margin-bottom: 6px; font-family: Georgia, serif; }

  .note-card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .note-card h3{ font-size: 1.05rem; margin-bottom: 4px; }
  .note-card p{
    margin:0; color: var(--ink-soft); font-size: 0.88rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.4;
  }
  .note-card .meta{ margin-top: 8px; font-size: 0.72rem; color: var(--ink-soft); }

  .fab{
    position: absolute;
    right: 20px; bottom: 92px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    color: white;
    font-size: 1.8rem;
    line-height: 0;
    box-shadow: 0 4px 14px rgba(44,72,66,.35);
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ background: var(--teal-deep); }

  /* ---------- NOTE EDITOR ---------- */
  .editor{
    flex:1; display:flex; flex-direction:column;
  }
  .editor-bar{
    display:flex; align-items:center; justify-content: space-between;
    padding: 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .icon-btn{
    background:none; border:none; color: var(--teal-deep);
    font-size: 0.95rem; padding: 8px 10px; display:flex; align-items:center; gap:4px;
  }
  .icon-btn.delete{ color: var(--danger); }
  .editor-body{ flex:1; display:flex; flex-direction:column; padding: 10px 20px 30px; overflow-y:auto; }
  .editor-title{
    border:none; background:transparent; outline:none;
    font-family: Georgia, serif; font-size: 1.4rem; font-weight: 600;
    color: var(--ink); padding: 8px 0; margin-bottom: 4px;
  }
  .editor-content{
    border:none; background:transparent; outline:none; resize:none;
    font-family: -apple-system, sans-serif; font-size: 1rem; color: var(--ink);
    line-height: 1.6; flex:1; padding: 8px 0; min-height: 140px;
  }
  .editor-title::placeholder, .editor-content::placeholder{ color: var(--ink-soft); }
  .editor-date{
    border:none; background:transparent; outline:none;
    font-family: -apple-system, sans-serif; font-size: 0.85rem; color: var(--ink-soft);
    padding: 2px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); width: fit-content;
  }
  .photo-section{ margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .photo-section-label{ font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 10px; }
  .photo-grid{ display:flex; flex-wrap:wrap; gap: 10px; }
  .photo-thumb{ position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; }
  .photo-thumb img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-remove{
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(43,42,40,.65); color: white; border: none;
    font-size: 0.85rem; line-height: 0; display:flex; align-items:center; justify-content:center;
  }
  .photo-add-btn{
    width: 84px; height: 84px; border-radius: 10px;
    border: 1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft); cursor: pointer;
  }
  .photo-add-btn svg{ width: 24px; height: 24px; }
  .note-photos{ display:flex; gap: 6px; margin-top: 10px; align-items:center; }
  .note-photos img{ width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
  .note-photos-more{ font-size: 0.75rem; color: var(--ink-soft); }
  .lightbox{
    position: fixed; inset: 0; background: rgba(20,19,17,.92);
    display:flex; align-items:center; justify-content:center; padding: 24px; z-index: 50;
  }
  .lightbox img{ max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox video{ max-width: 100%; max-height: 100%; border-radius: 8px; }
  .video-section{ margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .video-list{ display:flex; flex-direction:column; gap: 8px; margin-bottom: 10px; }
  .video-item{
    display:flex; align-items:center; gap: 10px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px;
  }
  .video-play{
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0;
    background: var(--teal); color:white; border:none; display:flex; align-items:center; justify-content:center;
  }
  .video-play svg{ width: 16px; height: 16px; }
  .video-info{ flex:1; min-width:0; }
  .video-name{ font-size: 0.85rem; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .video-size{ font-size: 0.72rem; color: var(--ink-soft); }
  .video-add-btn{
    display:flex; align-items:center; gap: 8px; justify-content:center;
    width: 100%; border: 1.5px dashed var(--line); border-radius: var(--radius);
    background: transparent; color: var(--ink-soft); padding: 12px; font-size: 0.88rem;
  }
  .video-add-btn svg{ width: 18px; height: 18px; }

  /* ---------- CALENDAR ---------- */
  .calendar-header{ display:flex; align-items:center; justify-content:space-between; padding: 10px 4px 18px; }
  .calendar-month-label{ font-family: Georgia, serif; font-size: 1.15rem; text-transform: capitalize; }
  .calendar-nav-btn{ background: var(--paper-raised); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .calendar-nav-btn svg{ width: 16px; height: 16px; }
  .calendar-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .calendar-weekday{ text-align:center; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-day{
    aspect-ratio: 1; border-radius: 10px; border: none; background: transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 3px;
    font-size: 0.9rem; color: var(--ink); position: relative;
  }
  .calendar-day.other-month{ color: var(--line); }
  .calendar-day.today{ background: var(--teal); color: white; font-weight: 600; }
  .calendar-day-dot{ width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
  .calendar-day-dots{ display:flex; gap: 3px; }
  .calendar-day.today .calendar-day-dot{ box-shadow: 0 0 0 1px white; }
  .calendar-day.has-couple{ background: rgba(122,31,53,0.16); border: 1.5px solid #7A1F35; color: #7A1F35; font-weight: 600; }

  /* ---------- MOOD ---------- */
  .mood-legend{ display:flex; flex-wrap:wrap; gap: 10px 16px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

function normalizeUrl(url){
  const trimmed = (url || '').trim();
  if(!trimmed) return '';
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return 'https://' + trimmed;
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

function relationDurationParts(startISO){
  const [y,m,d] = startISO.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if(days < 0){
    months--;
    days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  }
  if(months < 0){
    years--;
    months += 12;
  }
  return { years, months, days };
}

function getTodayReminders(){
  const today = todayISO();
  const yesterday = (() => {
    const [y,m,d] = today.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() - 1);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  })();
  const reminders = [];
  if(!state.moods[today]) reminders.push({ key: 'mood_' + today, text: tr('home_reminder_mood') });
  const hasRecentSleep = state.sleepLog.some(e => !e.isNap && (e.date === today || e.date === yesterday));
  if(!hasRecentSleep) reminders.push({ key: 'sleep_' + today, text: tr('home_reminder_sleep') });
  const hasWeightToday = state.weightLog.some(e => e.date === today);
  if(!hasWeightToday) reminders.push({ key: 'weight_' + today, text: tr('home_reminder_weight') });
  const untakenCount = state.treatments.filter(t => !(t.takenDates || []).includes(today)).length;
  if(untakenCount > 0) reminders.push({ key: 'treatment_' + today, text: tr('home_reminder_treatment', untakenCount) });
  return reminders.filter(r => !state.dismissedReminders[r.key]);
}

  return btoa(binary);
}
function base64ToBytes(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function deriveKeyFromPassphrase(passphrase, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 210000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptString(plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, enc.encode(plaintext));
  const combined = new Uint8Array(iv.length + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.length);
  return 'enc:' + bytesToBase64(combined);
}

async function decryptString(payload){
  if(!payload || !payload.startsWith('enc:')) throw new Error('not-encrypted');
  const combined = base64ToBytes(payload.slice(4));
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, data);
  return new TextDecoder().decode(dec);
}

async function encryptBackupPayload(payload){
  return await encryptString(JSON.stringify(payload));
}
async function decryptBackupPayload(text){
  try{
    if(text.trim().startsWith('enc:')){
      const json = await decryptString(text.trim());
      return JSON.parse(json);
    }
    return JSON.parse(text);
  }catch(e){
    console.error('backup decrypt error', e);
    return null;
  }
}

async function migrateLegacyPlaintextData(){
  for(const key of SENSITIVE_KEYS){
    const raw = window.localStorage.getItem('carnet:' + key);
    if(raw === null || raw.startsWith('enc:')) continue;
    try{
      const value = JSON.parse(raw);
      await storageSet(key, value);
    }catch(e){ console.error('migration error for', key, e); }
  }
  window.localStorage.removeItem('carnet:pin_hash');
}

async function storageGet(key){
  try{
    const raw = window.localStorage.getItem('carnet:' + key);
    if(raw === null) return null;
    if(PLAINTEXT_KEYS.has(key)) return JSON.parse(raw);
    if(!cryptoKey) return null;
    const json = await decryptString(raw);
    return JSON.parse(json);
  }catch(e){ console.error('storage error', e); return null; }
}
async function storageSet(key, value){
  try{
    if(PLAINTEXT_KEYS.has(key)){
      window.localStorage.setItem('carnet:' + key, JSON.stringify(value));
      return;
    }
    if(!cryptoKey) return;
    const enc = await encryptString(JSON.stringify(value));
    window.localStorage.setItem('carnet:' + key, enc);
  }catch(e){ console.error('storage error', e); }
}

/* ---------- VIDEO STORAGE (IndexedDB — videos are too large for localStorage) ---------- */
const VIDEO_DB_NAME = 'carnet-media';
const VIDEO_STORE = 'videos';
let videoDbPromise = null;
function openVideoDB(){
  if(videoDbPromise) return videoDbPromise;
  videoDbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(VIDEO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(VIDEO_STORE)) db.createObjectStore(VIDEO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return videoDbPromise;
}
async function videoPut(id, blob){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function videoGet(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readonly');
    const req = tx.objectStore(VIDEO_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function videoDelete(id){
  const db = await openVideoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(VIDEO_STORE, 'readwrite');
    tx.objectStore(VIDEO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function formatFileSize(bytes){
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' Ko';
  return (bytes/(1024*1024)).toFixed(1) + ' Mo';
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

let toastTimer = null;
function showToast(msg){

    t.classList.add('show');

let pendingUndoRestore = null;

function showUndoToast(message){
  render();
  requestAnimationFrame(()=>{
    const t = document.querySelector('.toast');
    if(!t) return;
    t.innerHTML = `<span>${escapeHtml(message)}</span><button type="button" class="toast-undo-btn" onclick="triggerUndo()">${tr('undo_button')}</button>`;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.classList.remove('show'); pendingUndoRestore = null; }, 5000);

  pendingUndoRestore = null;

  const t = document.querySelector('.toast');

}

async function removeFromArrayWithUndo(arrayKey, storageKey, id, message){
  const arr = state[arrayKey];
  const idx = arr.findIndex(x => x.id === id);
  if(idx === -1) return;
  const [item] = arr.splice(idx, 1);
  await storageSet(storageKey, arr);
  triggerAutoSync();
  pendingUndoRestore = async () => {
    state[arrayKey].splice(idx, 0, item);
    await storageSet(storageKey, state[arrayKey]);
    triggerAutoSync();
    render();
  };
  showUndoToast(message || tr('undo_deleted_generic'));
}

async function changePassphrase(){
  const current = window.prompt(tr('security_current_passphrase_prompt'));
  if(current === null) return;
  const saltB64 = window.localStorage.getItem('carnet:encSalt');
  const salt = base64ToBytes(saltB64);
  const testKey = await deriveKeyFromPassphrase(current, salt);
  const oldKey = cryptoKey;
  cryptoKey = testKey;
  let ok = false;
  try{
    const verifierRaw = window.localStorage.getItem('carnet:encVerifier');
    ok = (await decryptString(verifierRaw)) === 'verify-ok';
  }catch(e){ ok = false; }
  if(!ok){
    cryptoKey = oldKey;
    showToast(tr('passphrase_wrong'));
    return;
  }
  const next = window.prompt(tr('security_new_passphrase_prompt'));
  if(next === null) { cryptoKey = oldKey; return; }
  if(next.length < 8){ cryptoKey = oldKey; showToast(tr('passphrase_too_short')); return; }
  const confirmNext = window.prompt(tr('security_confirm_new_passphrase_prompt'));
  if(confirmNext !== next){ cryptoKey = oldKey; showToast(tr('passphrase_mismatch')); return; }
  const newSalt = crypto.getRandomValues(new Uint8Array(16));
  const newKey = await deriveKeyFromPassphrase(next, newSalt);
  cryptoKey = newKey;
  window.localStorage.setItem('carnet:encSalt', bytesToBase64(newSalt));
  const verifier = await encryptString('verify-ok');
  window.localStorage.setItem('carnet:encVerifier', verifier);
  for(const key of SENSITIVE_KEYS){
    await storageSet(key, state[key]);
  }
  showToast(tr('security_passphrase_changed'));
}

function fileToCompressedDataUrl(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else{ width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image invalide'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.readAsDataURL(file);
  });
}

  if(m < 0){ m = 11; y -= 1; }
  if(m > 11){ m = 0; y += 1; }
  state.calendarMonth = m;
  state.calendarYear = y;
  render();
}

function dateToISO(y,m,d){
  const pad = n => String(n).padStart(2,'0');
  return `${y}-${pad(m+1)}-${pad(d)}`;
}

function eventOccursOnDate(event, iso){
  if(!event.date) return false;
  if(event.date === iso) return true;
  if(!event.recurrence || event.recurrence === 'none') return false;
  const [sy,sm,sd] = event.date.split('-').map(Number);
  const [ty,tm,td] = iso.split('-').map(Number);
  const start = new Date(sy, sm-1, sd);
  const target = new Date(ty, tm-1, td);
  if(target < start) return false;
  if(event.recurrence === 'daily') return true;
  if(event.recurrence === 'weekly') return target.getDay() === start.getDay();
  if(event.recurrence === 'monthly') return td === sd;
  if(event.recurrence === 'yearly') return td === sd && tm === sm;
  return false;
}

  let age = now.getFullYear() - birth.getFullYear();

function scaleIngredientAmount(amount, baseServings, desiredServings){
  if(!baseServings) return amount;
  return amount * (desiredServings / baseServings);
}
function formatScaledAmount(n){
  const rounded = Math.round(n * 100) / 100;
  return rounded % 1 === 0 ? String(rounded) : String(rounded);
}

const UNIT_CONVERSIONS = {
  mg: { base:'mass', factor: 0.001 },
  g: { base:'mass', factor: 1 },
  kg: { base:'mass', factor: 1000 },
  ml: { base:'vol', factor: 1 },
  cl: { base:'vol', factor: 10 },
  l: { base:'vol', factor: 1000 },
};

function formatSmartQuantity(amount, unit){
  const key = (unit || '').toLowerCase().trim();
  const conv = UNIT_CONVERSIONS[key];
  if(!conv || !isFinite(amount)) return `${formatScaledAmount(amount)}${unit ? unit : ''}`;
  const baseValue = amount * conv.factor;
  if(conv.base === 'mass'){
    if(baseValue >= 1000) return `${formatScaledAmount(baseValue/1000)}kg`;
    if(baseValue > 0 && baseValue < 1) return `${formatScaledAmount(baseValue*1000)}mg`;
    return `${formatScaledAmount(baseValue)}g`;
  }
  if(conv.base === 'vol'){
    if(baseValue >= 1000) return `${formatScaledAmount(baseValue/1000)}L`;
    if(baseValue >= 10) return `${formatScaledAmount(baseValue/10)}cl`;
    return `${formatScaledAmount(baseValue)}ml`;
  }
  return `${formatScaledAmount(amount)}${unit ? unit : ''}`;
}
function linkifyIngredientsInStep(text, ingredients, baseServings, desiredServings){
  let html = escapeHtml(text || '');
  (ingredients||[]).forEach(ing => {
    if(!ing.name || !ing.name.trim()) return;
    const escaped = ing.name.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escaped, 'gi');
    const scaled = scaleIngredientAmount(Number(ing.amount)||0, baseServings, desiredServings);
    const qty = `${formatSmartQuantity(scaled, ing.unit)} ${ing.name}`.trim();
    html = html.replace(regex, (m) => `<span class="ingredient-tap" onclick="event.stopPropagation(); showToast('${qty.replace(/'/g,"\\'")}')">${m}</span>`);
  });
  return html;
}

function getEffectiveRecipeContent(r, lang){
  if(lang === 'en' && r.translations && r.translations.en){
    const en = r.translations.en;
    const ingredients = (r.ingredients||[]).map(orig => {
      const match = (en.ingredients||[]).find(x => x.id === orig.id);
      return { ...orig, name: match ? match.name : orig.name, unit: match && match.unit ? match.unit : orig.unit };
    });
    const steps = (r.steps||[]).map(orig => {
      const match = (en.steps||[]).find(x => x.id === orig.id);
      return { ...orig, content: match ? match.content : orig.content };
    });
    return { name: en.name || r.name, ingredients, steps };
  }
  return { name: r.name, ingredients: r.ingredients||[], steps: r.steps||[] };
}

  const r = state.currentRecipe;
  state.recipeTranslating = true;

  try{
    const name = await myMemoryTranslate(r.name, 'fr', 'en');
    const ingredientNames = await Promise.all((r.ingredients||[]).map(i => myMemoryTranslate(i.name, 'fr', 'en')));
    const ingredientUnits = await Promise.all((r.ingredients||[]).map(i => i.unit ? myMemoryTranslate(i.unit, 'fr', 'en') : ''));
    const stepContents = await Promise.all((r.steps||[]).map(s => myMemoryTranslate(s.content, 'fr', 'en')));
    r.translations = r.translations || {};
    r.translations.en = {
      name,
      ingredients: (r.ingredients||[]).map((ing,idx) => ({ id: ing.id, name: ingredientNames[idx], unit: ingredientUnits[idx] })),
      steps: (r.steps||[]).map((s,idx) => ({ id: s.id, content: stepContents[idx] })),
    };
    const idx2 = state.recipes.findIndex(x => x.id === r.id);
    if(idx2 >= 0) state.recipes[idx2] = r;
    await storageSet('recipes', state.recipes);
    triggerAutoSync();
    state.recipeViewLang = 'en';
  }catch(e){
    console.error('recipe translation error', e);
    showToast(tr('translate_error'));

  state.recipeTranslating = false;

function periodCycleStats(){
  const sorted = [...state.periodDays].sort();
  if(sorted.length === 0) return null;
  const starts = [];
  const durations = [];
  let streakStart = sorted[0];
  let streakLen = 1;
  for(let i=1; i<sorted.length; i++){
    const prev = new Date(sorted[i-1]);
    const cur = new Date(sorted[i]);
    const diffDays = Math.round((cur - prev) / 86400000);
    if(diffDays === 1){
      streakLen++;
    } else {
      starts.push(streakStart);
      durations.push(streakLen);
      streakStart = sorted[i];
      streakLen = 1;
    }
  }
  starts.push(streakStart);
  durations.push(streakLen);

  const avgDuration = Math.round(durations.reduce((a,b)=>a+b,0) / durations.length);
  if(starts.length < 2){
    return { avgCycle: null, avgDuration, nextEstimate: null };
  }
  const gaps = [];
  for(let i=1; i<starts.length; i++){
    const diff = Math.round((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
    gaps.push(diff);
  }
  const avgCycle = Math.round(gaps.reduce((a,b)=>a+b,0) / gaps.length);
  const lastStart = new Date(starts[starts.length-1]);
  const next = new Date(lastStart);
  next.setDate(next.getDate() + avgCycle);
  return { avgCycle, avgDuration, nextEstimate: dateToISO(next.getFullYear(), next.getMonth(), next.getDate()) };
}

function aggregatedWeightData(mode){
  const sorted = [...state.weightLog].sort((a,b)=> a.date.localeCompare(b.date));
  if(mode === 'daily'){
    return sorted.map(e => ({ label: e.date.slice(5), value: Number(e.weight) }));
  }
  const groups = {};
  sorted.forEach(e => {
    let key;
    if(mode === 'weekly'){
      const d = new Date(e.date);
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - ((d.getDay()+6)%7));
      key = dateToISO(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate());
    } else {
      key = e.date.slice(0,7);
    }
    if(!groups[key]) groups[key] = [];
    groups[key].push(Number(e.weight));
  });
  return Object.keys(groups).sort().map(k => ({
    label: mode === 'weekly' ? k.slice(5) : k,
    value: groups[k].reduce((a,b)=>a+b,0) / groups[k].length,
  }));
}

function avgPerDay(list){
  if(!list.length) return 0;
  const byDay = {};
  list.forEach(e => { byDay[e.date] = (byDay[e.date]||0) + (Number(e.calories)||0); });
  const days = Object.keys(byDay);
  const total = days.reduce((a,d)=> a + byDay[d], 0);
  return total / days.length;
}

function weightTrendDaysToGoal(){
  const sorted = [...state.weightLog].sort((a,b)=> a.date.localeCompare(b.date));
  if(sorted.length < 2 || !state.goalWeight) return undefined;
  const first = sorted[0], last = sorted[sorted.length-1];
  const daysSpan = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  if(daysSpan <= 0) return undefined;
  const rate = (Number(last.weight) - Number(first.weight)) / daysSpan; // kg/day
  const delta = state.goalWeight - Number(last.weight);
  if(Math.abs(delta) < 0.05) return 'reached';
  if(rate === 0 || Math.sign(rate) !== Math.sign(delta)) return 'wrong_direction';
  return Math.round(delta / rate);
}

function calorieDaysToGoal(){
  const latest = latestWeight();
  if(!latest || !state.goalWeight) return undefined;
  const avgFood = avgPerDay(state.foodLog);
  const avgActivity = avgPerDay(state.activityLog);
  if(!state.foodLog.length && !state.activityLog.length) return undefined;
  const netDaily = avgFood - avgActivity; // positive = surplus (gain), negative = deficit (loss)
  const delta = state.goalWeight - Number(latest.weight); // kg needed
  if(Math.abs(delta) < 0.05) return 'reached';
  const kcalNeeded = delta * 7700;
  if(netDaily === 0 || Math.sign(netDaily) !== Math.sign(kcalNeeded)) return 'wrong_direction';
  return Math.round(kcalNeeded / netDaily);
}

function formatGoalDate(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  return d.toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
}

async function geocodeCity(cityName, countryName){
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName.trim())}&count=8&language=fr`);
  if(!res.ok) throw new Error('geocode-failed');
  const data = await res.json();
  if(!data.results || !data.results.length) return null;
  let match = data.results[0];
  if(countryName){
    const found = data.results.find(r => r.country && r.country.toLowerCase().includes(countryName.toLowerCase()));

function convertAmount(amount, from, to){
  const rates = currentRates();
  const toEur = from === 'EUR' ? amount : amount / rates[from];
  return to === 'EUR' ? toEur : toEur * rates[to];
}

function converterResultsHtml(){

  const to = state.converterTo;

  const result = convertAmount(amount, state.converterFrom, to);
  const decimals = (to === 'HUF' || to === 'JPY') ? 0 : 2;
  return `<div class="converter-result">${result.toFixed(decimals)} ${cur.symbol}</div>`;

async function repayDebt(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt) return;
  const raw = window.prompt(tr('debt_repay_prompt'), '');
  if(raw === null) return;
  const val = parseFloat(raw.replace(',', '.'));
  if(isNaN(val) || val <= 0) return;
  if(debt.originalAmount === undefined) debt.originalAmount = Number(debt.amount);
  const remaining = Number(debt.amount) - val;
  debt.amount = remaining > 0 ? remaining : 0;
  debt.settled = remaining <= 0;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

async function settleDebt(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt) return;
  if(debt.originalAmount === undefined) debt.originalAmount = Number(debt.amount);
  debt.amount = 0;
  debt.settled = true;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

async function undoDebtRepayment(id){
  const debt = state.debts.find(d => d.id === id);
  if(!debt || debt.originalAmount === undefined) return;
  debt.amount = debt.originalAmount;
  delete debt.originalAmount;
  debt.settled = false;
  await storageSet('debts', state.debts);
  triggerAutoSync();
  render();
}

function renderWeightChart(){
  const data = aggregatedWeightData(state.weightChartMode);
  if(data.length < 2) return `<div class="translate-disclaimer">${tr('sport_chart_empty')}</div>`;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const w = 300, h = 120, pad = 12;
  const stepX = (w - 2*pad) / (data.length - 1);
  const coords = data.map((d,i) => {
    const x = pad + i*stepX;
    const y = pad + (1 - (d.value - min)/range) * (h - 2*pad);
    return { x, y };
  });
  const points = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="var(--teal-deep)"></circle>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="weight-chart-svg" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="var(--teal)" stroke-width="2"/>
      ${dots}
    </svg>
    <div class="weight-chart-labels">
      <span>${data[0].label} · ${min.toFixed(1)}kg</span>
      <span>${data[data.length-1].label} · ${max.toFixed(1)}kg</span>
    </div>
  `;
}

function entryDurationMinutesGeneric(startTime, endTime){
  if(!startTime || !endTime) return 0;
  const [sh,sm] = startTime.split(':').map(Number);
  const [eh,em] = endTime.split(':').map(Number);
  if(isNaN(sh) || isNaN(eh)) return 0;
  let start = sh*60+sm, end = eh*60+em;
  if(end < start) end += 24*60;
  return end - start;
}

function entryDurationMinutes(e){
  return entryDurationMinutesGeneric(e.startTime, e.endTime);
}

function formatDuration(totalMinutes){
  if(totalMinutes <= 0) return '0min';
  const h = Math.floor(totalMinutes/60);
  const m = totalMinutes % 60;
  if(h === 0) return `${m}min`;
  if(m === 0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_BACKUP_FILENAME = 'carnet-sauvegarde.json';

function triggerAutoSync(){

function ensureGoogleTokenClient(){
  if(!state.googleClientId) return null;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if(googleTokenClient) return googleTokenClient;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.googleClientId,
    scope: DRIVE_SCOPE,
    callback: () => {},
  });
  return googleTokenClient;
}

function requestGoogleToken(){
  return new Promise((resolve, reject)=>{
    const client = ensureGoogleTokenClient();
    if(!client){ reject(new Error('google-not-ready')); return; }
    client.callback = (resp) => {
      if(resp.error){ reject(resp); return; }
      googleAccessToken = resp.access_token;
      resolve(resp.access_token);
    };
    client.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
  });
}

async function driveFindBackupFile(token){
  const q = encodeURIComponent(`name='${DRIVE_BACKUP_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if(!res.ok) throw new Error('drive-list-failed');
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

function buildBackupPayload(){
  return {
    app: 'carnet', version: 2, exportedAt: new Date().toISOString(),
    notes: state.notes, events: state.events,

  };

async function driveUploadBackup(){
  if(!state.googleConnected && !state.googleClientId) return;
  try{
    const token = googleAccessToken || await requestGoogleToken();
    const content = await encryptBackupPayload(buildBackupPayload());
    if(!driveFileId){
      const existing = await driveFindBackupFile(token);
      if(existing) driveFileId = existing.id;
    }
    const boundary = 'carnetboundary';
    const metadata = { name: DRIVE_BACKUP_FILENAME, mimeType: 'text/plain' };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${driveFileId ? '{}' : JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: text/plain\r\n\r\n${content}\r\n--${boundary}--`;
    const url = driveFileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: driveFileId ? 'PATCH' : 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body,
    });
    if(!res.ok) throw new Error('drive-upload-failed');
    const data = await res.json();
    driveFileId = data.id;
    state.googleConnected = true;
    state.lastDriveSync = Date.now();
    await storageSet('lastDriveSync', state.lastDriveSync);
    showToast(tr('toast_drive_backup_ok'));
    if(state.screen === 'settings') render();
  }catch(e){
    console.error('drive upload error', e);
    showToast(tr('toast_drive_backup_failed'));
  }
}

/* ---------- TRANSLATION ---------- */
const LANG_CODE_MAP = { fr: 'fr', en: 'en', hu: 'hu' };

async function googleTranslateChunk(text, from, to){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${LANG_CODE_MAP[from]}&tl=${LANG_CODE_MAP[to]}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  const segments = data && data[0] ? data[0] : [];
  const translated = segments.map(seg => seg[0]).join('');
  if(!translated) throw new Error('empty');
  return translated;
}

async function myMemoryChunkFallback(text, from, to){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${LANG_CODE_MAP[from]}|${LANG_CODE_MAP[to]}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  // Prefer a genuine machine-translation match over noisy community translation-memory entries
  let best = data && data.responseData && data.responseData.translatedText;
  if(Array.isArray(data && data.matches)){
    const mt = data.matches.find(m => m.translation && /mt!?/i.test((m['created-by'] || m['last-updated-by'] || '')));
    if(mt) best = mt.translation;
  }
  if(!best) throw new Error('empty');
  return best;
}

async function translateChunk(text, from, to){
  try{
    return await googleTranslateChunk(text, from, to);
  }catch(e){
    console.warn('Google Translate unavailable, falling back to MyMemory', e);
    return await myMemoryChunkFallback(text, from, to);
  }
}

async function myMemoryTranslate(text, from, to){
  if(!text || !text.trim()) return '';
  const chunks = text.match(/[\s\S]{1,1800}(?=\n|$)/g) || [text];
  const results = [];
  for(const chunk of chunks){
    results.push(await translateChunk(chunk, from, to));
  }
  return results.join(' ');
}

async function translateNote(){
  const n = state.currentNote;
  const from = state.translateFrom, to = state.translateTo;
  if(from === to) return;
  state.translating = true;
  render();
  try{
    const [title, content] = await Promise.all([
      myMemoryTranslate(n.title, from, to),
      myMemoryTranslate(n.content, from, to),
    ]);
    if(!n.translations) n.translations = {};
    n.translations[to] = { title, content, from, at: Date.now() };
    await saveCurrentNote();
  }catch(e){
    console.error('translate error', e);
    state.translateErrored = true;
  }
  state.translating = false;
  render();
}

function withinLastNDays(dateStr, days){
  if(!dateStr) return false;
  if(days === 0) return true;
  const parts = dateStr.split('-').map(Number);
  if(parts.length < 3 || parts.some(isNaN)) return false;
  const [y,m,d] = parts;
  const date = new Date(y, m-1, d);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return date >= cutoff;
}

function buildAssistantDataContext(){
  const DAYS = state.assistantWindowDays || 90;
  const windowLabel = DAYS === 0 ? 'tout l\'historique disponible' : `les ${DAYS} derniers jours`;
  const lines = [];
  lines.push(`(Les données datées ci-dessous couvrent ${windowLabel}. Si la question porte sur une période antérieure non couverte, dis-le clairement plutôt que de conclure qu'il ne s'est rien passé.)`);

  lines.push(`--- SOMMEIL (${windowLabel}) ---`);
  state.sleepLog.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date} : coucher ${e.bedTime}, réveil ${e.wakeTime}, durée ${formatDuration(entryDurationMinutesGeneric(e.bedTime, e.wakeTime))}${e.wakeUps ? `, ${e.wakeUps} réveil(s) dans la nuit` : ''}${e.isNap ? ' (sieste, à additionner à la nuit du même jour)' : ''}`);
  });

  lines.push(`--- MIGRAINES (${windowLabel}) ---`);
  state.migraines.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date} ${e.startTime}${e.endTime ? '-'+e.endTime : ''} : intensité ${intensityLabel(e.intensity)}${e.notes ? ', notes : '+e.notes : ''}`);
  });

  lines.push(`--- HUMEUR (${windowLabel}) ---`);
  Object.keys(state.moods).filter(d => withinLastNDays(d, DAYS)).sort().forEach(d => {
    lines.push(`${d} : ${moodLabel(state.moods[d])}${state.moodNotes[d] ? ' — '+state.moodNotes[d] : ''}`);
  });

  lines.push(`--- JOURNAL / ACTIVITES DU QUOTIDIEN (${windowLabel}) ---`);
  lines.push("(Le champ [Qui] précise l'auteur de l'entrée : 'Moi' = l'utilisatrice, sinon le prénom indiqué désigne une autre personne comme son compagnon. Ne jamais attribuer à l'utilisatrice une entrée dont le [Qui] n'est pas 'Moi'.)");
  state.journal.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const cat = e.category ? journalCategoryById(e.category) : null;
    const who = e.person ? e.person : 'Moi';
    lines.push(`${e.date} ${e.startTime||''}-${e.endTime||'?'} : ${e.text}${cat ? ' ['+cat.name+']' : ''} [Qui : ${who}]`);
  });

  lines.push(`--- ACTIVITE PHYSIQUE (${windowLabel}) ---`);
  state.activityLog.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date} : ${e.description}, ${e.calories} kcal brûlées`);
  });

  lines.push(`--- ALIMENTATION (${windowLabel}) ---`);
  state.foodLog.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date} ${e.time||''} : ${e.description}${e.category ? ' ['+tr('food_cat_'+e.category)+']' : ''}${e.calories ? ', '+e.calories+' kcal' : ''}${e.cholesterol ? ', '+e.cholesterol+'mg cholestérol' : ''}`);
  });

  lines.push(`--- POIDS (${windowLabel}) ---`);
  state.weightLog.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date} : ${e.weight} kg`);
  });

  lines.push(`--- EVENEMENTS DU CALENDRIER (${windowLabel}) ---`);
  state.events.filter(e => withinLastNDays(e.date, DAYS)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    lines.push(`${e.date}${e.time ? ' '+e.time : ''} : ${e.title}${e.notes ? ' — '+e.notes : ''}`);
  });

  lines.push('--- MALADIES ENREGISTREES ---');
  state.illnesses.forEach(e => lines.push(`${e.date} : ${e.name}${e.notes ? ' — '+e.notes : ''}`));

  lines.push('--- SYMPTOMES ---');
  state.symptoms.forEach(e => lines.push(`${[e.date, e.isAllDay ? tr('health_symptom_all_day') : e.time].filter(Boolean).join(' ') || 'date non renseignée'} : ${e.name}${e.notes ? ' — '+e.notes : ''}`));

  lines.push('--- TRAITEMENTS EN COURS ---');
  state.treatments.forEach(e => lines.push(`${e.date} : ${e.name}${e.notes ? ' — '+e.notes : ''}`));

  lines.push('--- ALLERGIES CONNUES ---');
  state.allergies.forEach(e => lines.push(`${e.name}${e.notes ? ' — '+e.notes : ''}`));

  lines.push('--- REPERTOIRE (CONTACTS) ---');
  state.contacts.forEach(c => {
    const name = [c.firstName, c.lastName].filter(Boolean).join(' ');
    const cat = contactCategoryLabel(c);
    const parts = [];
    if(cat) parts.push(cat);
    if(c.phone) parts.push('tél : ' + c.phone);
    if(c.email) parts.push('email : ' + c.email);
    if(c.postalAddress) parts.push('adresse : ' + c.postalAddress.replace(/\n/g, ', '));
    lines.push(`${name}${parts.length ? ' — ' + parts.join(', ') : ''}`);
  });

  lines.push(`--- HYDRATATION (${windowLabel}) ---`);
  Object.keys(state.hydration).filter(d => withinLastNDays(d, DAYS)).sort().forEach(d => {
    const bottles = state.hydration[d] || [];
    const liters = bottles.reduce((s,l)=> s + (4-l)/4*1.5, 0);
    lines.push(`${d} : ${liters.toFixed(2)} L`);
  });

  return lines.join('\n');
}

async function askAssistant(){
  const input = document.getElementById('assistantQuestionInput');
  const question = input ? input.value.trim() : '';
  if(!question) return;
  if(!state.assistantApiKey){ showToast(tr('assistant_missing_key')); return; }
  state.assistantLoading = true;
  render();
  try{
    const dataContext = buildAssistantDataContext();
    const systemPrompt = "Tu es un assistant personnel bienveillant qui analyse les données de vie de l'utilisateur (santé, sommeil, activité physique, alimentation, humeur, journal, événements, répertoire de contacts) pour répondre à ses questions de façon précise. Base-toi UNIQUEMENT sur les données fournies ci-dessous. Cite des chiffres et des faits concrets tirés des données (par exemple : 'X épisodes ont été enregistrés, pour Y d'entre eux...'). Si les données sont insuffisantes pour répondre avec certitude, dis-le clairement plutôt que d'inventer. Réponds de façon concise et bienveillante, jamais alarmiste. Tu n'es pas un professionnel de santé : si la question porte sur un sujet médical, rappelle-le brièvement à la fin de ta réponse.";
    const res = await fetch(RELAY_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Relay-Secret': state.assistantApiKey,
      },
      body: JSON.stringify({
        model: state.assistantModel || 'claude-sonnet-5',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: `Données disponibles :\n${dataContext}\n\nQuestion : ${question}` }],
      }),
    });
    if(!res.ok){
      let detail = '';
      try{
        const errJson = await res.json();
        detail = (errJson && errJson.error && errJson.error.message) || '';
      }catch(_){}
      if(res.status === 401) throw new Error('invalid-key');
      throw new Error(detail || ('api-error-' + res.status));
    }
    const data = await res.json();
    const answer = (data.content || []).map(b => b.text || '').join('\n').trim() || tr('assistant_empty_response');
    const entry = { id: 'as' + Date.now(), date: todayISO(), question, answer };
    state.assistantHistory.unshift(entry);
    await storageSet('assistantHistory', state.assistantHistory);
    await trackAiSpend(state.assistantModel, data.usage);
    triggerAutoSync();
    if(input) input.value = '';
  }catch(e){
    console.error('assistant error', e);
    if(e.message === 'invalid-key') showToast(tr('assistant_invalid_key'));
    else showToast(tr('assistant_error_detail', e.message));
  }
  state.assistantLoading = false;
  render();
}

    const res = await fetch(RELAY_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Relay-Secret': state.assistantApiKey,
      },
      body: JSON.stringify({
        model: state.assistantModel || 'claude-sonnet-5',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: `Données disponibles :\n${dataContext}\n\nMotif du rendez-vous : ${motif}` }],

- Structure ta réponse en jours (ex: "Jour 1 — ...") avec pour chaque jour une liste d'exercices, chacun avec un nombre de séries et de répétitions ou une durée.

- Respecte scrupuleusement les contraintes/préférences indiquées (matériel disponible, douleurs ou zones à ménager, durée maximale de séance, etc.).
- Si des éléments de santé sont enregistrés (maladie, traitement, migraine récente), réduis prudemment l'intensité générale (moins de séries, plus de repos) et ajoute une phrase rappelant de consulter un professionnel de santé avant de commencer — mais n'adapte JAMAIS des exercices précis à une pathologie donnée, tu n'es pas qualifié pour ça.
- Tu n'es pas un professionnel de santé ou un coach certifié : reste sur des principes d'entraînement standards et prudents.
- Réponds uniquement avec le programme, sans préambule.`;
    const userMsg = `Données disponibles :\n${dataContext}\n\nNiveau : ${tr('sport_level_' + state.fitnessLevel)}\nObjectif d'entraînement : ${tr('sport_goal_' + state.trainingGoal)}\nContraintes ou préférences : ${state.coachConstraints || '(aucune indiquée)'}`;
    const res = await fetch(RELAY_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Relay-Secret': state.assistantApiKey,
      },
      body: JSON.stringify({
        model: state.assistantModel || 'claude-sonnet-5',
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{ role: 'user', content: userMsg }],
      }),
    });
    if(!res.ok){
      let detail = '';
      try{
        const errJson = await res.json();
        detail = (errJson && errJson.error && errJson.error.message) || '';
      }catch(_){}
      if(res.status === 401) throw new Error('invalid-key');
      throw new Error(detail || ('api-error-' + res.status));
    }
    const data = await res.json();
    const text = (data.content || []).map(b => b.text || '').join('\n').trim() || tr('assistant_empty_response');
    state.coachProgram = { date: todayISO(), text, level: state.fitnessLevel, goal: state.trainingGoal, constraints: state.coachConstraints };

  }catch(e){

    if(e.message === 'invalid-key') showToast(tr('assistant_invalid_key'));

const AI_MODEL_PRICING = {
  opus: { input: 15, output: 75 },
  sonnet: { input: 3, output: 15 },
  haiku: { input: 1, output: 5 },
};

function getModelPricing(model){
  const m = (model || '').toLowerCase();
  if(m.includes('opus')) return AI_MODEL_PRICING.opus;
  if(m.includes('haiku')) return AI_MODEL_PRICING.haiku;
  return AI_MODEL_PRICING.sonnet;
}

async function trackAiSpend(model, usage){
  if(!usage) return;
  const pricing = getModelPricing(model);
  const cost = ((usage.input_tokens||0)/1e6)*pricing.input + ((usage.output_tokens||0)/1e6)*pricing.output;
  state.aiSpendTotalUsd = (state.aiSpendTotalUsd || 0) + cost;
  await storageSet('aiSpendTotalUsd', state.aiSpendTotalUsd);
  triggerAutoSync();
}

function renderDayRecap(){
  const date = getDayRecapDate();
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const [y,m,d] = date.split('-').map(Number);
  const dateLabel = new Date(y,m-1,d).toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const sleepEntries = state.sleepLog.filter(e => e.date === date);
  const mood = state.moods[date];
  const moodNote = state.moodNotes[date];
  const activities = state.activityLog.filter(e => e.date === date);
  const meals = state.foodLog.filter(e => e.date === date);
  const mealsCalories = meals.reduce((s,e) => s + (Number(e.calories)||0), 0);
  const hydrationLiters = hydrationLitersForDate(date);

  const sleepHtml = sleepEntries.length ? sleepEntries.map(e => `
    <div class="summary-row">
      <span class="summary-name">${e.bedTime||'?'} → ${e.wakeTime||'?'}${e.isNap ? ' · ' + tr('health_sleep_nap_badge') : ''}${e.wakeUps ? ' · ' + tr('health_sleep_wakeups_short', e.wakeUps) : ''}</span>
      <span class="summary-duration">${formatDuration(entryDurationMinutesGeneric(e.bedTime, e.wakeTime))}</span>
    </div>
  `).join('') : `<div class="translate-disclaimer">${tr('day_recap_no_sleep')}</div>`;

  const moodHtml = mood ? `
    <div class="summary-row"><span class="summary-name">${moodLabel(mood)}</span></div>
    ${moodNote ? `<div class="translate-disclaimer">${escapeHtml(moodNote)}</div>` : ''}
  ` : `<div class="translate-disclaimer">${tr('day_recap_no_mood')}</div>`;

  const activityHtml = activities.length ? activities.map(e => `
    <div class="summary-row"><span class="summary-name">${escapeHtml(e.description)}</span><span class="summary-duration">${e.calories} kcal</span></div>
  `).join('') : `<div class="translate-disclaimer">${tr('day_recap_no_activity')}</div>`;

  const mealsHtml = meals.length ? `
    <div class="summary-row"><span class="summary-name">${tr('day_recap_meals_count', meals.length)}</span><span class="summary-duration">${mealsCalories} kcal</span></div>
    ${meals.map(e => `<div class="translate-disclaimer">${e.time ? e.time + ' — ' : ''}${escapeHtml(e.description)}</div>`).join('')}
  ` : `<div class="translate-disclaimer">${tr('day_recap_no_meals')}</div>`;

  const cy = state.dayRecapYear, cm = state.dayRecapMonth;
  const monthLabel = new Date(cy, cm, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(cy, cm, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(cy, cm+1, 0).getDate();
  const daysInPrevMonth = new Date(cy, cm, 0).getDate();
  const todayIso = todayISO();
  const weekdayLabels = [0,1,2,3,4,5,6].map(i => {
    const wd = new Date(2024, 0, 1 + i);
    return wd.toLocaleDateString(locale, { weekday: 'short' }).slice(0,2);
  });
  let calCells = '';
  for(let i=0; i<startOffset; i++){
    const dd = daysInPrevMonth - startOffset + i + 1;
    calCells += `<div class="calendar-day other-month"><span>${dd}</span></div>`;
  }
  for(let dd=1; dd<=daysInMonth; dd++){
    const iso = dateToISO(cy,cm,dd);
    const isToday = iso === todayIso;
    const isSelected = iso === date;
    const hasData = dayHasAnyData(iso);
    calCells += `
      <button class="calendar-day ${isToday && !isSelected ? 'today' : ''}" ${isSelected ? `style="background:var(--teal); border-color:var(--teal); color:white;"` : ''} onclick="selectDayRecapDay('${iso}')">
        <span>${dd}</span>
        ${hasData && !isSelected ? `<div class="calendar-day-dot" style="background:var(--teal)"></div>` : ''}
      </button>
    `;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let dd=1; dd<=trailing; dd++){
    calCells += `<div class="calendar-day other-month"><span>${dd}</span></div>`;
  }
  const calendarHtml = `
    <div class="calendar-header">
      <button class="calendar-nav-btn" onclick="changeDayRecapMonth(-1)">${svgIcon('chevronLeft')}</button>
      <div class="calendar-month-label" style="text-transform:capitalize;">${monthLabel}</div>
      <button class="calendar-nav-btn" onclick="changeDayRecapMonth(1)">${svgIcon('chevronRight')}</button>
    </div>
    <div class="calendar-grid">
      ${weekdayLabels.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
      ${calCells}
    </div>
  `;

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
    </div>
    <div class="content">
      ${calendarHtml}
      <h2 class="day-view-title" style="text-transform:capitalize; margin-bottom:14px; margin-top:14px;">${dateLabel}</h2>

      <div class="journal-summary">
        <div class="photo-section-label">${tr('day_recap_sleep_title')}</div>
        ${sleepHtml}
      </div>
      <div class="journal-summary" style="margin-top:14px">
        <div class="photo-section-label">${tr('day_recap_mood_title')}</div>
        ${moodHtml}
      </div>
      <div class="journal-summary" style="margin-top:14px">
        <div class="photo-section-label">${tr('day_recap_activity_title')}</div>
        ${activityHtml}
      </div>
      <div class="journal-summary" style="margin-top:14px">
        <div class="photo-section-label">${tr('day_recap_meals_title')}</div>
        ${mealsHtml}
      </div>
      <div class="journal-summary" style="margin-top:14px">
        <div class="photo-section-label">${tr('day_recap_hydration_title')}</div>
        <div class="summary-row"><span class="summary-name">${tr('day_recap_hydration_amount', hydrationLiters.toFixed(2))}</span></div>
      </div>
    </div>
    ${renderBottomNav()}
  `;
}

function renderGlobalSearchResults(query){
  const q = query.trim().toLowerCase();
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';

  let notesResults = [], journalResults = [], contactResults = [], recipeResults = [];
  if(q){
    notesResults = state.notes.filter(n => (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q) || (n.items||[]).some(i => (i.text||'').toLowerCase().includes(q)));
    journalResults = state.journal.filter(e => (e.text||'').toLowerCase().includes(q)).sort((a,b)=>(b.date+((b.startTime)||'')).localeCompare(a.date+((a.startTime)||'')));
    contactResults = state.contacts.filter(c => (c.firstName||'').toLowerCase().includes(q) || (c.lastName||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q));
    recipeResults = allRecipes().filter(r => (r.name||'').toLowerCase().includes(q) || recipeIngredientsText(r).toLowerCase().includes(q));
  }
  const totalResults = notesResults.length + journalResults.length + contactResults.length + recipeResults.length;

  const section = (title, rows) => rows.length ? `
    <div class="photo-section-label" style="margin-top:16px">${title}</div>
    <div class="budget-list">${rows.join('')}</div>
  ` : '';

  const notesHtml = notesResults.map(n => `
    <div class="budget-row" onclick='openNoteById("${n.id}")'>
      <div class="budget-row-desc">
        <div>${n.title ? escapeHtml(n.title) : tr('untitled')}</div>
        <div class="budget-row-date">${escapeHtml((n.content||'').slice(0,60))}</div>
      </div>
    </div>
  `);

  const journalHtml = journalResults.map(e => {
    const [y,m,d] = e.date.split('-').map(Number);
    const dLabel = new Date(y,m-1,d).toLocaleDateString(locale, { weekday:'short', day:'numeric', month:'short' });
    return `
      <div class="budget-row" onclick="state.journalDate='${e.date}'; state.screen='journal'; render();">
        <div class="budget-row-desc">
          <div>${escapeHtml(e.text)}</div>
          <div class="budget-row-date">${dLabel}${e.startTime ? ' · ' + e.startTime : ''}</div>
        </div>
      </div>
    `;
  });

  const contactsHtml = contactResults.map(c => `
    <div class="budget-row" onclick='openContactEntry(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <div class="budget-row-desc">
        <div>${escapeHtml((c.firstName + ' ' + c.lastName).trim() || tr('untitled'))}</div>
        <div class="budget-row-date">${[contactCategoryLabel(c), c.phone || c.email].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
  `);

  const recipesHtml = recipeResults.map(r => `
    <div class="budget-row" onclick="${r.source==='builtin' ? `viewBuiltinRecipe('${r.id}')` : `viewCustomRecipe('${r.id}')`}">
      <div class="budget-row-desc">
        <div>${escapeHtml(r.name)}</div>
        <div class="budget-row-date">${r.source==='builtin' ? tr('recipe_builtin_badge') : tr('recipe_custom_badge')}</div>
      </div>
    </div>
  `);

  if(!q) return '';
  if(totalResults === 0) return `<div class="translate-disclaimer" style="margin-top:10px">${tr('search_no_results')}</div>`;
  return `
    ${section(tr('global_search_section_notes'), notesHtml)}
    ${section(tr('global_search_section_journal'), journalHtml)}
    ${section(tr('global_search_section_directory'), contactsHtml)}
    ${section(tr('global_search_section_recipes'), recipesHtml)}
  `;
}

function renderRelation(){
  const info = state.relationInfo;

  let distanceHtml = `<div class="translate-disclaimer">${tr('relation_distance_missing')}</div>`;
  if(info.myLocation && info.partnerLocation){
    const km = haversineKm(info.myLocation.lat, info.myLocation.lon, info.partnerLocation.lat, info.partnerLocation.lon);
    distanceHtml = `<div class="relation-distance">${tr('relation_distance', km.toLocaleString(state.lang==='en'?'en-GB':'fr-FR'))}</div>`;
  } else if(info.myCountry && info.partnerCountry && COUNTRY_COORDS[info.myCountry] && COUNTRY_COORDS[info.partnerCountry]){
    const [lat1,lon1] = COUNTRY_COORDS[info.myCountry];
    const [lat2,lon2] = COUNTRY_COORDS[info.partnerCountry];
    const km = haversineKm(lat1,lon1,lat2,lon2);
    distanceHtml = `<div class="relation-distance">${tr('relation_distance', km.toLocaleString(state.lang==='en'?'en-GB':'fr-FR'))}</div>`;
  }

  let durationHtml = '';
  if(info.startDate){
    const { years, months, days } = relationDurationParts(info.startDate);
    const parts = [];
    if(years > 0) parts.push(tr('relation_duration_years', years));
    if(months > 0) parts.push(tr('relation_duration_months', months));
    if(days > 0 || parts.length === 0) parts.push(tr('relation_duration_days', days));
    durationHtml = `
      <div class="relation-since">${tr('relation_since_label')} ${formatDateDisplay(info.startDate)}</div>
      <div class="relation-duration">${parts.join(', ')}</div>
    `;
  }

  return `
    <div class="top-bar">
      <div class="top-bar-left">
        ${renderBreadcrumb()}
      </div>
      <button class="settings-btn" onclick="openSettings()">${svgIcon('settings')}</button>
    </div>
    <div class="content">
      <div class="love-heart-wrap" onclick="setPartnerName()">

function renderWelcome2(){
  const today = todayISO();

  const [ty,tm,td] = today.split('-').map(Number);
  const endDate = new Date(ty, tm-1, td);
  endDate.setDate(endDate.getDate() + 6);
  const endIso = `${endDate.getFullYear()}-${String(endDate.getMonth()+1).padStart(2,'0')}-${String(endDate.getDate()).padStart(2,'0')}`;

  const weekEvents = state.events
    .filter(e => e.date >= today && e.date <= endIso)
    .sort((a,b) => (a.date+((a.time)||'')).localeCompare(b.date+((b.time)||'')));

  return `

function renderCalendar(){
  const y = state.calendarYear, m = state.calendarMonth;
  const locale = state.lang === 'en' ? 'en-GB' : 'fr-FR';
  const monthLabel = new Date(y, m, 1).toLocaleDateString(locale, { month:'long', year:'numeric' });
  const firstOfMonth = new Date(y, m, 1);
  let startOffset = firstOfMonth.getDay() - 1; // make Monday = 0
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const todayIso = todayISO();

  const categoriesByDate = {};
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    state.events.forEach(e => {
      if(eventOccursOnDate(e, iso)){
        if(!categoriesByDate[iso]) categoriesByDate[iso] = new Set();
        categoriesByDate[iso].add(e.category || 'rdv');
      }
    });
  }

  const weekdayLabels = [0,1,2,3,4,5,6].map(i => {
    const d = new Date(2024, 0, 1 + i); // a known Monday
    return d.toLocaleDateString(locale, { weekday: 'short' }).slice(0,2);
  });

  let cells = '';
  for(let i=0; i<startOffset; i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    cells += `<div class="calendar-day other-month"><span>${d}</span></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = dateToISO(y,m,d);
    const isToday = iso === todayIso;
    const cats = categoriesByDate[iso] ? [...categoriesByDate[iso]].slice(0,3) : [];
    const hasCouple = (categoriesByDate[iso] || new Set()).has('couple');
    const dots = cats.map(c => `<div class="calendar-day-dot" style="background:${categoryColor(c)}"></div>`).join('');
    cells += `
      <button class="calendar-day ${isToday?'today':''} ${hasCouple ? 'has-couple':''}" onclick="selectDay('${iso}')">
        <span>${d}</span>
        ${dots ? `<div class="calendar-day-dots">${dots}</div>` : ''}
      </button>
    `;
  }
  const totalCells = startOffset + daysInMonth;

}

function computeNutritionTargets(){
  const info = state.personalInfo;
  const w = latestWeight();
  if(!info || !info.birthDate || !info.sex || !w || !state.height || !state.fitnessLevel) return null;
  const age = ageFromBirthDate(info.birthDate);
  const weight = Number(w.weight);
  const height = Number(state.height);
  let bmr;
  if(info.sex === 'male') bmr = 10*weight + 6.25*height - 5*age + 5;
  else if(info.sex === 'female') bmr = 10*weight + 6.25*height - 5*age - 161;
  else bmr = 10*weight + 6.25*height - 5*age - 78;

  const activityMultiplierByLevel = { sedentary:1.2, beginner:1.375, intermediate:1.55, advanced:1.725, expert:1.9 };
  const activityMultiplier = activityMultiplierByLevel[state.fitnessLevel] || 1.2;

  let tdee = bmr * activityMultiplier;
  if(state.goalWeight){
    if(state.goalWeight < weight - 0.5) tdee -= 500;
    else if(state.goalWeight > weight + 0.5) tdee += 300;
  }
  const calories = Math.round(tdee);
  return {
    calories,
    protein: Math.round(weight * 1.4),
    carbs: Math.round((calories*0.5)/4),
    fat: Math.round((calories*0.3)/9),
    sugarMax: Math.round((calories*0.10)/4),
    fiber: info.sex === 'male' ? 30 : 25,
    sodiumMax: 2000,
    potassium: 3500,
    cholesterolMax: 300,
  };
}

function nutrientIndicator(value, target, isLimit){
  const pct = (value / target) * 100;
  if(isLimit){
    return pct <= 100 ? { label: tr('nutri_within_limit'), level:'ok' } : { label: tr('nutri_over_limit'), level:'warn' };
  }
  if(pct < 70) return { label: tr('nutri_low'), level:'warn' };
  if(pct > 130) return { label: tr('nutri_high'), level:'warn' };
  return { label: tr('nutri_adequate'), level:'ok' };
}

function foodTotalsForDate(iso){
  return state.foodLog.filter(e => e.date === iso).reduce((acc, e) => {
    acc.calories += Number(e.calories) || 0;
    acc.protein += Number(e.protein) || 0;
    acc.carbs += Number(e.carbs) || 0;
    acc.fat += Number(e.fat) || 0;
    acc.sugar += Number(e.sugar) || 0;
    acc.fiber += Number(e.fiber) || 0;
    acc.potassium += Number(e.potassium) || 0;
    acc.sodium += Number(e.sodium) || 0;
    acc.saturatedFat += Number(e.saturatedFat) || 0;
    acc.cholesterol += Number(e.cholesterol) || 0;
    return acc;
  }, { calories:0, protein:0, carbs:0, fat:0, sugar:0, fiber:0, potassium:0, sodium:0, saturatedFat:0, cholesterol:0 });
}

function foodDailyAverages(){
  const uniqueDates = [...new Set(state.foodLog.map(e => e.date))];
  if(!uniqueDates.length) return null;
  const sum = uniqueDates.reduce((acc, date) => {
    const t = foodTotalsForDate(date);
    Object.keys(acc).forEach(k => acc[k] += t[k]);
    return acc;
  }, { calories:0, protein:0, carbs:0, fat:0, sugar:0, fiber:0, potassium:0, sodium:0, saturatedFat:0, cholesterol:0 });
  const result = {};
  Object.keys(sum).forEach(k => result[k] = Math.round(sum[k] / uniqueDates.length));
  return result;
}

  const frequent = foodFrequency();
  const today = foodTotalsForDate(todayISO());

function renderFood(){
  const byDate = {};
  state.foodLog.forEach(e => {
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });
  const days = Object.keys(byDate).sort((a,b) => b.localeCompare(a));
  const today = todayISO();

  const dayBlocks = days.map(date => {
    const meals = byDate[date].sort((a,b) => (a.time||'').localeCompare(b.time||''));
    const totals = foodTotalsForDate(date);
    const isExpanded = state.expandedFoodDays[date] !== undefined ? state.expandedFoodDays[date] : (date === today);
    const mealRows = meals.map(e => `
      <div class="budget-row" onclick='openFoodEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
        <div class="budget-row-desc">
          <div>${e.time ? e.time + ' — ' : ''}${escapeHtml(e.description || '')}${e.category ? ` <span class="recipe-badge custom">${tr('food_cat_' + e.category)}</span>` : ''}</div>
        </div>
        <div class="budget-row-amount">${e.calories||0} kcal</div>
      </div>
    `).join('');
    return `
      <div class="budget-block">
        <div class="budget-block-header" style="cursor:pointer" onclick="toggleFoodDayExpanded('${date}')">
          <div class="budget-block-title">${formatDateDisplay(date)}</div>
          <div class="budget-block-total" style="color:var(--teal-deep)">${totals.calories} kcal</div>
        </div>
        ${isExpanded ? `
          <div class="photo-section-label" style="margin-top:8px">${tr('nutri_indicators_title')}</div>
          ${renderNutritionIndicators(totals)}
          <div class="budget-list" style="margin-top:10px">${mealRows}</div>
        ` : `
          <button type="button" class="translate-disclaimer" style="text-decoration:underline; background:none; border:none; padding:0; margin-top:4px;" onclick="event.stopPropagation(); toggleFoodDayExpanded('${date}')">${tr('food_day_expand')}</button>

  return `
    <div class="top-bar">
